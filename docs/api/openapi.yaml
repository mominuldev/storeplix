                $ref: '#/components/schemas/ApiError'
        '403':
          $ref: '#/components/responses/TenantForbiddenOrRole'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          description: '`domain_invalid`, `domain_reserved`, `domain_taken` or `validation_failed` (details.hostname)'
