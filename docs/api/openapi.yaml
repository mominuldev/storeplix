  /storefront/unsubscribe/{code}:
    get:
      tags:
      - storefront
      summary: Unsubscribe link status
      operationId: getStorefrontUnsubscribe
      description: 'Server-to-server (Next.js `/u/{code}`). Never changes state (P85-7). Lookup by sha256 within the host''s
        store: campaign_recipients, then automation_run_steps (1.14.0), then test codes. Limiter storefront-unsubscribe 20/min per shopper IP. Response `Cache-Control: private, no-store`.'
      security:
      - storefrontKey: []
      parameters:
      - $ref: '#/components/parameters/StorefrontHost'
      - $ref: '#/components/parameters/StorefrontClientIp'
      - $ref: '#/components/parameters/UnsubscribeCode'
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/UnsubscribeStatus'
        '401':
          description: Missing/invalid X-Storefront-Key (code `invalid_storefront_key`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: '`unsubscribe_link_invalid` (unknown or malformed code, or a code of another store — identical body)
            or `store_not_found` (unknown host)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          $ref: '#/components/responses/RateLimited'
    post:
      tags:
      - storefront
      summary: Unsubscribe or subscribe again
      operationId: postStorefrontUnsubscribe
      description: Server-to-server (page button, or `/u/{code}/one-click` with one_click true, RFC 8058). Idempotent. `unsubscribe`
        creates a `link` suppression for (store, channel, address), sets the recipient unsubscribed_at and the matching customer's
        accepts_marketing false; `resubscribe` removes only the `link` suppression for that address and channel. A test code
        → 200 with is_test true and no change. Not written to audit_logs.
      security:
      - storefrontKey: []
      parameters:
      - $ref: '#/components/parameters/StorefrontHost'
      - $ref: '#/components/parameters/StorefrontClientIp'
      - $ref: '#/components/parameters/UnsubscribeCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnsubscribeInput'
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/UnsubscribeStatus'
        '401':
          description: Missing/invalid X-Storefront-Key (code `invalid_storefront_key`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: '`unsubscribe_link_invalid` (unknown or malformed code, or a code of another store — identical body)
            or `store_not_found` (unknown host)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          $ref: '#/components/responses/RateLimited'
        '422':
          $ref: '#/components/responses/ValidationFailed'
