      operationId: createApiKey
      description: Needs developers.manage (PHASE-8-4 §6.1). Writes need the api_webhooks plan feature (Growth) → 402 otherwise.
        Scopes are normalized (implied reads added, de-duplicated). Every scope must be grantable by the actor (P84-5) → 422
        `scope_not_grantable` (details.scopes). At most 10 active keys → 422 `limit_reached`. `plain_key` is returned only in
        this response. Audited as api_key.created.
