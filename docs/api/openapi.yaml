          maxLength: 160
        share_image_media_id:
          type: [string, 'null']
    CreatePageInput:
      type: object
      description: '`title` required unless `template` is given.'
      properties:
        title:
          type: string
          maxLength: 120
        slug:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          maxLength: 80
        template:
          $ref: '#/components/schemas/PageTemplateCode'
        status:
          $ref: '#/components/schemas/PageStatus'
        body:
          type: array
          maxItems: 40
          items:
            $ref: '#/components/schemas/PageBlock'
        seo:
          $ref: '#/components/schemas/PageSeoInput'
        add_to_menu:
          oneOf:
          - $ref: '#/components/schemas/NavigationHandle'
          - type: 'null'
    UpdatePageInput:
      type: object
      required: [revision]
      properties:
        revision:
          type: integer
        title:
          type: string
          maxLength: 120
        slug:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          maxLength: 80
        status:
          $ref: '#/components/schemas/PageStatus'
        body:
          type: array
          maxItems: 40
          items:
            $ref: '#/components/schemas/PageBlock'
        seo:
          $ref: '#/components/schemas/PageSeoInput'
    NavigationHandle:
      type: string
      enum: [main, footer, help]
    NavLink:
      type: object
      description: |
        Discriminated by `type`: home | page{page_id} | url{url: http/https only} | collection{handle} |
        builtin{target: track_order|cart|search}.
      required: [type]
      properties:
        type:
          type: string
          enum: [home, page, url, collection, builtin]
        page_id:
          $ref: '#/components/schemas/Ulid'
        url:
          type: string
          maxLength: 2048
        handle:
          type: string
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
          maxLength: 80
        target:
          type: string
          enum: [track_order, cart, search]
    NavItem:
      type: object
      required: [id, label, link]
      properties:
        id:
          type: string
          pattern: ^[a-z0-9]{8,16}$
        label:
          type: string
          minLength: 1
          maxLength: 40
        link:
          $ref: '#/components/schemas/NavLink'
        children:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/NavItem'
          description: Only one level of children is allowed.
    NavItemResolved:
      allOf:
      - $ref: '#/components/schemas/NavItem'
      - type: object
        required: [href, link_status]
        properties:
          href:
            type: [string, 'null']
          link_status:
            type: string
            enum: [ok, page_unpublished, page_missing]
          page_title:
            type: [string, 'null']
    NavigationMenu:
      type: object
      required: [id, handle, title, items, revision, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        handle:
          $ref: '#/components/schemas/NavigationHandle'
        title:
          type: string
          maxLength: 40
        items:
          type: array
          items:
            $ref: '#/components/schemas/NavItemResolved'
        revision:
          type: integer
        updated_at:
          type: string
          format: date-time
    SaveNavigationInput:
      type: object
      required: [items, revision]
      properties:
        title:
          type: string
          maxLength: 40
        items:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/NavItem'
        revision:
          type: integer
    StoreSeo:
      type: object
      required: [title, description, share_image, hide_from_search]
      properties:
        title:
          type: [string, 'null']
          maxLength: 70
        description:
          type: [string, 'null']
          maxLength: 160
        share_image:
          oneOf:
          - $ref: '#/components/schemas/MediaRef'
          - type: 'null'
        hide_from_search:
          type: boolean
    StorefrontMedia:
      type: object
      required: [id, url, width, height, alt, srcset]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        url:
          type: string
          format: uri
        width:
          type: integer
        height:
          type: integer
        alt:
          type: [string, 'null']
        srcset:
          type: array
          items:
            type: object
            required: [url, width]
            properties:
              url:
                type: string
                format: uri
              width:
                type: integer
    StorefrontNavItem:
      type: object
      required: [id, label, href, children]
      properties:
        id:
          type: string
        label:
          type: string
        href:
          type: string
        children:
          type: array
          items:
            $ref: '#/components/schemas/StorefrontNavItem'
    StorefrontNavMenu:
      type: object
      required: [title, items]
      properties:
        title:
          type: string
        items:
          type: array
          items:
            $ref: '#/components/schemas/StorefrontNavItem'
    StorefrontPage:
      type: object
      required: [id, slug, title, status, body, media, seo, updated_at]
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        slug:
          type: string
        title:
          type: string
        status:
          $ref: '#/components/schemas/PageStatus'
        body:
          type: array
          items:
            $ref: '#/components/schemas/PageBlock'
        media:
          type: object
          additionalProperties:
            $ref: '#/components/schemas/StorefrontMedia'
        seo:
          type: object
          required: [title, description, og_image_url]
          properties:
            title:
              type: [string, 'null']
            description:
              type: [string, 'null']
            og_image_url:
              type: [string, 'null']
              format: uri
        updated_at:
          type: string
          format: date-time
    StorefrontPageIndexEntry:
      type: object
      required: [slug, updated_at]
      properties:
        slug:
          type: string
        updated_at:
          type: string
          format: date-time
