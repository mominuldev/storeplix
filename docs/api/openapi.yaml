openapi: 3.1.0
info:
  title: Store Plix API
  version: 1.14.0
  description: |
    1.14.0 (2026-11-24, Phase 8.6, PHASE-8-6-CONTRACT.md, ADR 0020): additive only. Automations and checkout recovery.
    New tag automations (marketing.manage; create/enable/PATCH of an `on` automation/test need the sms_automation plan
    feature → 402 feature_not_in_plan): GET|POST /stores/{store}/automations, GET|PATCH|DELETE .../automations/{automation},
    POST .../{automation}/enable|disable|dry-run|test-message, GET .../{automation}/stats,
    GET /stores/{store}/automation-runs[/{run}] (masked addresses; contact names need customers.view). Storefront:
    PUT /storefront/cart/contact (limiter storefront-cart-contact 10/min per shopper IP; the contact is never returned),
    POST /storefront/carts/recover (limiter storefront-cart-recover 20/min). MarketingOverview gains kpis.carts_recovered,
    kpis.recovered_revenue_amount, series[].recovery_amount, counts.automations (revenue_amount includes automation
    conversions, each order once). AuditActorType gains automation. The storefront unsubscribe endpoints also resolve
    automation message codes (shape unchanged). Automation messages count toward campaign_sms_per_month /
    campaign_emails_per_month ("Marketing SMS" / "Marketing emails"). New error codes automation_exists,
    automation_not_draft (409), automation_incomplete (422), recovery_link_invalid (404). The testing-only message sink
    gains automation_id.
    Phase 1, 1.1 (D1–D4), Phase 2, Phase 3 (storefront engine), Phase 4 (catalog, inventory, customers, CSV, dashboard, cookie auth) and Phase 5a (storefront catalog, cart, COD checkout, orders, shipping zones, coupons, go-live; PHASE-5-CONTRACT.md) endpoints. Phase 5b (PHASE-5B-CONTRACT.md): payment gateways, online checkout, payment links, gateway refunds, payment returns and webhooks, couriers and shipments, documents, edit items, returns and exchanges. Binding sources: docs/development/AGENT-CONTRACTS.md,
    docs/development/PHASE-2-CONTRACT.md, PHASE-3-CONTRACT.md, PHASE-4-CONTRACT.md and PHASE-5-CONTRACT.md. Conventions: docs/api/API-CONVENTIONS.md. Types mirror packages/types/src/index.ts.
    1.5.1 (2026-11-22, QA 5a F-L6): documentation-only alignment with the built and accepted Phase 5a deviations
    (Idempotency-Key format and 400 for a malformed key, zone area clash as 422, confirm also un-packs, manual orders with
    COD off, no-zone delivery charge, dashboard month rule). No shape changes.
    1.6.0 (2026-11-22, Phase 5b): additive only. New tags payments, couriers, documents, returns, webhooks; widened enums
    (ShipmentStatus, CancelReason, RefundMethod, CustomerSmsEvent, OrderEvent.type); new optional fields on Payment, Shipment,
    Order, OrderSummary, CheckoutInput/Result, StorefrontOrder, StorefrontCommerce and store settings. Clients must tolerate new enum values.
    Storefront limiter (P5B-9): 300/min per store host + shopper IP and 3 000/min per store host.
    1.6.1 (2026-11-22, Phase 5b as built): documentation alignment, additive only. OrderDashboard `waiting.pending_payment`,
    `waiting.to_book`, `shipments.problems`; StorefrontOrderTracking `shipment.{status,status_at,checked_at,events}`;
    orders list `filter[has_shipment]`, `filter[printed]`, `filter[not_printed]`; CourierSettings bounds (weight 100–20 000 g,
    Pathao 500–10 000; parcel_description ≤ 120 with only `{items}`/`{order_no}`); connect-courier `meta.webhook_secret`
    always present; missing-account answers (couriers 404; gateway PATCH/test 422 `gateway_not_connected`, disconnect 404);
    one signed SSLCommerz return URL (`r` optional); payment webhooks never 401, courier webhooks 401 `unauthenticated`;
    exchange `send_payment_link` = `custom` link for the goods price difference. Testing-only `/dev/*` routes are not part of
    this spec (API-CONVENTIONS §10.3). Limiters and 5b error codes: API-CONVENTIONS §3, §8, §10.
    1.7.0 (2026-11-22, Phase 6, PHASE-6-CONTRACT.md): additive only. New tags domains and internal; merchant domain
    endpoints under /stores/{store}/domains (list, add, show, re-check, make primary, remove); internal
    GET /internal/domains/allowed (Caddy `ask` allowlist); StorefrontConfig.store.redirect_host (P6-15); LimitKey gains
    custom_domains. New error codes domain_invalid, domain_reserved, domain_taken (422), domain_not_active,
    platform_domain_locked (409), domain_not_allowed (404). Testing-only /dev/domains/* routes are not part of this spec.
    1.8.0 (2026-11-23, Phase 7, PHASE-7-CONTRACT.md): additive only. Billing: POST /billing/quote, POST /billing/change-plan,
    DELETE /billing/scheduled-change, GET /billing/invoices, GET /billing/invoices/{invoice}, GET /billing/invoices/{invoice}/pdf,
    POST /billing/invoices/{invoice}/pay, GET /billing/payments/{payment}; public GET|POST /billing/payments/return/{provider}/{payment}
    and POST /billing/webhooks/sslcommerz. Reports: GET /stores/{store}/reports/{sales,profit,delivery}. Plan gains
    price_yearly_amount; Subscription gains billing_interval, scheduled_change, past_due_at, grace_ends_at, domain_grace_ends_at,
    open_invoice; FeatureAccess gains grace_ends_at, domain_grace_ends_at; DomainFailureCode gains plan_limit; every 402 may carry
    details.upgrade_plan. New error codes plan_unchanged, invoice_overdue, invoice_not_open (409), plan_unavailable,
    billing_gateway_unavailable (422). Testing-only /dev/billing/* and /dev/fake-billing-gateway/* routes are not part of this spec.
    1.9.0 (2026-11-23, Phase 8.1, PHASE-8-1-CONTRACT.md): additive only. New tag admin: /admin/auth/* (password + TOTP),
    /admin/invitations/{token}[/accept], /admin/overview, /admin/search, /admin/tenants[/{tenant}[/members|domains|invoices|audit-logs|
    suspend|reactivate|billing/quote|billing/change-plan|subscription/extend|impersonations]], /admin/invoices[/{invoice}[/pdf|mark-paid|
    void|resend]], /admin/domains[/{domain}/recheck|suspend|reinstate], /admin/audit-logs, /admin/impersonations[/{id}/revoke],
    /admin/team[...]. Merchant auth: POST|DELETE /auth/impersonation; /auth/me meta.impersonation. AuditLog actor type gains
    platform_user (shown as "Store Plix support", id null). /storefront/config may answer StorefrontSuspended. New error codes
    impersonation_read_only (403), impersonation_ended (401), invalid_totp (422), last_super_admin, staff_self_action (409).
    Every /admin/* route needs an admin-surface session; merchant routes refuse it (403 forbidden).
    1.10.0 (2026-11-23, Phase 8.2, PHASE-8-2-CONTRACT.md): additive only. GET /admin/analytics/overview and
    GET /admin/analytics/revenue (new platform permission view_analytics: super_admin, billing, read_only) and
    GET /admin/tenants/{tenant}/metrics (view_merchants), all read from nightly snapshot tables (as of meta.as_of, Dhaka
    days). AdminTenantSummary gains last_active_at and metrics; GET /admin/tenants gains sort values -mrr, mrr, -gmv_30d,
    -orders_30d, -last_active_at, last_active_at and meta.metrics_as_of. PlatformPermission gains view_analytics. No new
    error codes. Testing-only POST /dev/analytics/aggregate is not part of this spec.
    1.13.0 (2026-11-24, Phase 8.5, PHASE-8-5-CONTRACT.md, ADR 0019): additive only. Marketing campaigns (SMS + email),
    consent and opt-out. New tag campaigns (marketing.manage): GET /stores/{store}/marketing/overview,
    GET|POST /stores/{store}/campaigns, GET|PATCH|DELETE .../campaigns/{campaign}, POST .../campaigns/audience-preview,
    POST .../campaigns/estimate, POST .../{campaign}/test|schedule|send|unschedule|cancel|duplicate (schedule and send need
    Idempotency-Key), GET .../{campaign}/recipients (also customers.view; masked addresses). Customers (customers.edit):
    POST /stores/{store}/customers/{customer}/marketing-opt-out, DELETE .../marketing-opt-out/{channel}. Storefront:
    GET|POST /storefront/unsubscribe/{code} (limiter storefront-unsubscribe 20/min per shopper IP). Customer gains
    marketing (CustomerMarketing); LimitKey gains campaign_sms_per_month, campaign_emails_per_month. New error codes
    campaign_quiet_hours, campaign_unknown_merge_field, campaign_too_long, campaign_coupon_inactive,
    campaign_no_recipients (422), suppression_customer_owned (409), unsubscribe_link_invalid (404). Testing-only
    GET /dev/stores/{store}/message-sink is not part of this spec.
    1.12.0 (2026-11-24, Phase 8.4, PHASE-8-4-CONTRACT.md, ADR 0018): additive only. Developer API keys and outbound
    webhooks. New tags developers and external. Merchant (developers.manage; writes need the api_webhooks plan feature):
    GET|POST /api-keys, PATCH|DELETE /api-keys/{key}, GET /api-scopes, GET /webhook-event-types,
    GET|POST /stores/{store}/webhook-endpoints, PATCH|DELETE /stores/{store}/webhook-endpoints/{endpoint},
    POST .../{endpoint}/test, GET /stores/{store}/webhook-secret, POST .../webhook-secret/reveal|rotate,
    GET /stores/{store}/webhook-deliveries[/{delivery}], POST .../{delivery}/resend, POST .../webhook-deliveries/resend-failed.
    External API under /external/* with the new ApiKeyAuth scheme (`Authorization: Bearer sp_live_…`, scope per route
    in x-required-scope, limiter external-api 120/min per key): GET /external/me and orders, products, categories,
    inventory, customers reads plus order status, product create/update and stock adjustment writes, with the same
    response shapes as the merchant API. PermissionKey gains developers.manage; AuditActorType gains api_key. New error
    codes invalid_api_key (401), api_key_scope_missing (403), scope_not_grantable, limit_reached, webhook_url_not_allowed
    (422). Testing-only GET /dev/webhook-sink is not part of this spec.
    1.11.1 (2026-11-24, Phase 8.3 security fixes): DELETE /roles/{role} requires `revision` (stale → 409
    revision_conflict); imports also need the keys of what they write (products.edit + inventory.adjust, costs.view
    when a row sets cost; customers.edit) → 403 forbidden; product exports fill cost_price only for a requester with
    costs.view; accepting a custom-role invitation without custom_roles → 402 feature_not_in_plan; audit
    filter[subject_type] accepts `role`.
    1.11.0 (2026-11-23, Phase 8.3, PHASE-8-3-CONTRACT.md, ADR 0017): custom roles and granular permissions. New
    GET /permissions, GET|POST /roles, GET|PATCH|DELETE /roles/{role} (staff.manage; writes need the custom_roles plan
    feature). Every merchant tenant route now requires one of 23 PermissionKey values (contract §3); owner/admin/staff
    keep identical access as system roles. TenantMembership gains role_id, role_name, permissions; StaffMember gains
    role_id, role_name; InvitationPreview and AdminTenantMember gain role_name; TenantRole gains `custom` (clients must
    tolerate it). POST /staff/invitations and PATCH /staff/{member} accept role_id (legacy role still accepted). New
    error codes permission_not_held, cannot_edit_own_role (403), system_role_locked, role_in_use, role_limit_reached (409).
    Envelope: success `{data, meta?}`; error `{error:{code,message,details?}}`. IDs are ULIDs. snake_case JSON.
    Merchant routes need Bearer + X-Tenant-Id: missing header → 400 `tenant_required`; not a member → 403 `tenant_forbidden`;
    a resource id of another tenant → 404 `not_found`.
servers:
- url: http://localhost:8010/api/v1
  description: Local
- url: https://api.storeplix.com/api/v1
  description: Production
tags:
- name: system
- name: auth
- name: stores
- name: staff
- name: media
- name: billing
  description: 'Plans, subscription, features (Phase 2); invoices, plan changes and platform payments (Phase 7, PHASE-7 §6.1–6.2)'
- name: audit
- name: storefront
- name: themes
- name: pages
- name: navigation
- name: catalog
- name: inventory
- name: customers
- name: data
- name: dashboard
- name: geo
- name: shipping
- name: coupons
- name: orders
- name: payments
  description: 'Phase 5b: gateway accounts, payment links (PHASE-5B §4.1, §4.4)'
- name: couriers
  description: 'Phase 5b: courier accounts and shipments (PHASE-5B §4.6, §4.7)'
- name: documents
  description: 'Phase 5b: invoice and label PDFs (PHASE-5B §4.8)'
- name: returns
  description: 'Phase 5b: returns and exchanges (PHASE-5B §4.9)'
- name: webhooks
  description: 'Phase 5b: public payment returns and provider webhooks (PHASE-5B §4.3)'
- name: domains
  description: 'Phase 6: custom domains (PHASE-6 §4.1)'
- name: reports
  description: 'Phase 7: sales, profit and delivery reports (PHASE-7 §6.3–6.4)'
- name: admin
  description: 'Phase 8.1: super admin for platform staff (PHASE-8-1 §6); session `surface: admin` only'
- name: developers
  description: 'Phase 8.4: API keys, webhook endpoints, signing secret and delivery log (PHASE-8-4 §6)'
- name: external
  description: 'Phase 8.4: external API for merchant integrations, authenticated by an API key (PHASE-8-4 §3)'
- name: campaigns
  description: 'Phase 8.5: marketing overview, SMS/email campaigns and opt-out (PHASE-8-5 §4, §6)'
- name: automations
  description: 'Phase 8.6: recipe automations, run log and checkout recovery (PHASE-8-6 §9)'
- name: internal
  description: 'Phase 6: server-to-server allowlist for on-demand TLS (PHASE-6 §4.3); not exposed publicly'
paths:
  /health:
    get:
      tags:
      - system
      summary: Get health
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/HealthStatus'
  /auth/register:
    post:
      tags:
      - auth
      summary: Register
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - email
              - password
              - password_confirmation
              properties:
                name:
                  type: string
                  maxLength: 120
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                password_confirmation:
                  type: string
                phone:
                  type:
                  - string
                  - 'null'
                  maxLength: 20
                  description: E.164 preferred, e.g. +8801712345678
      responses:
        '201':
          description: Registered; token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/login:
    post:
      tags:
      - auth
      summary: Login
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '422':
          description: Bad credentials → `validation_failed` with `details.email`; or other validation errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/forgot-password:
    post:
      tags:
      - auth
      summary: Forgot password
      operationId: forgotPassword
      security: []
      description: |
        Always returns 202 with the same body whether or not the email exists (no account enumeration).
        Phase 2: sends a reset email (60-min single-use token; Mailpit locally). Rate-limited by the `auth` limiter.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
      responses:
        '202':
          description: Accepted (identical for known and unknown emails)
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/MessageResponse'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/reset-password:
    post:
      tags:
      - auth
      summary: Reset password
      operationId: resetPassword
      description: Consumes a 60-min single-use reset token; revokes all of the user's tokens.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordInput'
      responses:
        '200':
          description: Password reset
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/MessageResponse'
        '422':
          description: '`invalid_reset_token` (unknown/expired/used/email mismatch) or `validation_failed`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/logout:
    post:
      tags:
      - auth
      summary: Logout
      operationId: logout
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Current token revoked
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/otp/send:
    post:
      tags:
      - auth
      summary: Send OTP
      operationId: sendOtp
      description: |
        Sends a 6-digit code by SMS (TTL 5 min, resend cooldown 60 s; per-phone and per-IP hourly caps → 429 `otp_rate_limited`).
        `verify_phone` requires Bearer; the phone must be the user's, or replaces it while still unverified (422 otherwise).
        `login` / `reset_password`: identical 202 whether or not the phone is registered (a code is only sent when it is).
      security:
      - {}
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendOtpInput'
      responses:
        '202':
          description: Code sent (or silently not, see above)
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/SendOtpResponse'
        '401':
          description: '`unauthenticated` (purpose verify_phone without Bearer)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/phone/verify:
    post:
      tags:
      - auth
      summary: Verify phone
      operationId: verifyPhone
      description: Confirms the user's phone with a `verify_phone` code; sets `phone_verified_at`.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyPhoneInput'
      responses:
        '200':
          description: Verified user
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/InvalidOtp'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/login/otp:
    post:
      tags:
      - auth
      summary: Login with OTP
      operationId: loginWithOtp
      description: SMS sign-in with a `login` code. Same response shape as password login; marks the phone verified.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpLoginInput'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '422':
          $ref: '#/components/responses/InvalidOtp'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/reset-password/otp:
    post:
      tags:
      - auth
      summary: Reset password with OTP
      operationId: resetPasswordWithOtp
      description: Resets the password with a `reset_password` code; revokes all tokens.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpResetPasswordInput'
      responses:
        '200':
          description: Password reset
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/MessageResponse'
        '422':
          $ref: '#/components/responses/InvalidOtp'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/me:
    get:
      tags:
      - auth
      summary: Me
      operationId: me
      description: 'Phase 8.1: in an impersonation session (`surface: impersonation`) `data` is the staff user with only the
        impersonated tenant (role owner) and `meta.impersonation` is set; otherwise it is null.'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/User'
                  meta:
                    type: object
                    properties:
                      session_expires_at:
                        type:
                        - string
                        - 'null'
                        format: date-time
                      impersonation:
                        oneOf:
                        - $ref: '#/components/schemas/MeImpersonation'
                        - type: 'null'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    patch:
      tags:
      - auth
      summary: Update profile
      operationId: updateProfile
      description: Update own profile. Changing `email` requires `current_password`.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileInput'
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /auth/password:
    put:
      tags:
      - auth
      summary: Change password
      operationId: changePassword
      description: Change own password. Returns a NEW token; all other tokens (including the current one) are revoked.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordInput'
      responses:
        '200':
          $ref: '#/components/responses/AuthTokenOk'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /stores:
    get:
      tags:
      - stores
      summary: List stores
      operationId: listStores
      description: Stores of the current tenant (0 or 1 items; one store per tenant, D1). Any role.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
      - in: query
        name: per_page
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Stores
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Store'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/TenantRequired'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TenantForbiddenOrRole'
    post:
      tags:
      - stores
      summary: Create store
      operationId: createStore
      description: Create the tenant's store (owner/admin). Created as `draft` with a platform subdomain. The one-store check
        runs BEFORE validation, so a second request returns 409 even with an empty body.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStoreInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Store'
        '400':
