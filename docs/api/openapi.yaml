      - token
      - password
      - password_confirmation
      properties:
        email:
          type: string
          format: email
        token:
          type: string
        password:
          type: string
          minLength: 8
          maxLength: 128
        password_confirmation:
          type: string
    UpdateProfileInput:
      type: object
      required: []
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type:
          - string
          - 'null'
          maxLength: 20
        current_password:
          type: string
