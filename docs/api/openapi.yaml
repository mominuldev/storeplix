          - revenue_amount
          - average_recovered_amount
          - messages_sent_month
          properties:
            carts_left_behind: *id001
            carts_left_behind_amount:
              type: integer
            recovered: *id001
            recovery_rate_pct:
              type:
              - number
              - 'null'
            revenue_amount:
              type: integer
            average_recovered_amount:
              type:
              - integer
              - 'null'
            messages_sent_month: *id001
        currency:
          type: string
    CartContactInput:
      type: object
      required:
      - phone
      additionalProperties: false
      properties:
        phone:
          type: string
          maxLength: 20
          description: valid BD mobile; stored as 8801XXXXXXXXX
        name:
          type:
          - string
          - 'null'
          maxLength: 80
        email:
          type:
          - string
          - 'null'
          format: email
          maxLength: 254
    RecoverCartInput:
      type: object
      required:
      - code
      properties:
        code:
          type: string
          pattern: ^[A-Za-z0-9]{10}$
    RecoverCartResult:
      type: object
      required:
      - cart_token
      - next
      properties:
        cart_token:
          type: string
          description: new cart; set as sp_cart
        next:
          type: string
          enum:
          - checkout
          - cart
