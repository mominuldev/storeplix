          type: string
        status:
          type: string
          enum:
          - subscribed
          - unsubscribed
        is_test:
          type: boolean
          description: a test-send code; POST changes nothing
        store_name:
          type: string
    UnsubscribeInput:
      type: object
      required:
      - action
      properties:
        action:
          type: string
          enum:
          - unsubscribe
          - resubscribe
        one_click:
          type: boolean
      additionalProperties: false
    UpdateCampaignInput:
      type: object
      required:
      - revision
      additionalProperties: false
      description: 'PATCH (draft / scheduled only): any CreateCampaignInput field, plus revision (stale → 409 revision_conflict).'
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        channel:
          $ref: '#/components/schemas/CampaignChannel'
        language:
          $ref: '#/components/schemas/CampaignLanguage'
        audience:
          $ref: '#/components/schemas/CampaignAudience'
        body:
          type: string
          minLength: 1
          maxLength: 5000
          description: 'SMS: ≤ 5 parts including the "{shop}: " prefix and the opt-out footer (P85-18). Email: plain text ≤ 5,000
            chars. Merge fields {name}, {coupon}, {shop_link}, {product}; others → 422 campaign_unknown_merge_field.'
        subject:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 150
          description: required for email (no CR/LF); must be null/absent for SMS
        coupon_id:
          type:
          - string
          - 'null'
          description: store coupon ULID; required when {coupon} is used; must be active
        product_id:
          type:
          - string
          - 'null'
          description: store product ULID; required when {product} is used
        scheduled_at:
          type:
          - string
          - 'null'
          format: date-time
          description: remembered schedule time; stored on a draft without effect until /schedule; on a scheduled campaign re-validated
        revision:
          type: integer
    RecipeKey:
      type: string
      enum:
      - checkout_recovery
      - thank_you
      - vip_tag
      - return_flag
      - low_stock
      description: P86-2 fixed catalogue (UI order)
    AutomationStatus:
      type: string
      enum:
      - draft
      - 'on'
      - 'off'
    AutomationTrigger:
      type: string
      enum:
      - checkout.abandoned
      - order.delivered
      - return.received
      - stock.low
    AutomationMessage:
      type: object
      required:
      - channel
      - language
      - body
      - subject
      additionalProperties: false
      properties:
        channel:
          $ref: '#/components/schemas/MarketingChannel'
        language:
          $ref: '#/components/schemas/CampaignLanguage'
        body:
          type: string
          minLength: 1
          maxLength: 3000
          description: 'SMS: ≤ 3 parts incl. the shop prefix and opt-out footer (P86-7). Email: plain text ≤ 3,000 chars. Merge
            fields per recipe (contract §11.1 C11); others → 422 campaign_unknown_merge_field.'
        subject:
          type:
          - string
          - 'null'
          minLength: 1
          maxLength: 150
          description: required for email (no CR/LF); null for SMS
    AutomationConditionField:
      type: string
      enum:
      - order.total_amount
      - order.payment_method
      - order.channel
      - customer.tag
      - customer.delivered_orders_count
      - customer.risk
    AutomationCondition:
      description: §5 fixed list; all must hold; ≤ 5.
      oneOf:
      - type: object
        required:
        - field
        - op
        - value
        additionalProperties: false
        properties:
          field:
            type: string
            const: order.total_amount
          op:
            type: string
            enum:
            - gt
            - lt
          value:
            type: integer
            minimum: 0
            description: minor units
      - type: object
        required:
        - field
        - op
        - value
        additionalProperties: false
        properties:
          field:
            type: string
            const: order.payment_method
          op:
            type: string
            enum:
            - is
          value:
            type: string
            enum:
            - cod
            - online
      - type: object
        required:
        - field
        - op
        - value
        additionalProperties: false
        properties:
          field:
            type: string
            const: order.channel
          op:
            type: string
            enum:
            - in
          value:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              $ref: '#/components/schemas/OrderChannel'
      - type: object
        required:
        - field
        - op
        - value
        additionalProperties: false
        properties:
          field:
            type: string
            const: customer.tag
          op:
            type: string
            enum:
            - has
            - not_has
          value:
            type: string
            minLength: 1
            maxLength: 40
      - type: object
        required:
        - field
        - op
        - value
        additionalProperties: false
        properties:
          field:
            type: string
            const: customer.delivered_orders_count
          op:
            type: string
            enum:
            - gte
          value:
            type: integer
            minimum: 2
            maximum: 50
      - type: object
        required:
        - field
        - op
        - value
        additionalProperties: false
        properties:
          field:
            type: string
            const: customer.risk
          op:
            type: string
            enum:
            - is_not
          value:
            type: string
            const: risky
    CheckoutRecoverySettings:
      type: object
      additionalProperties: false
      required:
      - delay_minutes
      - step1
      - wait_hours
      - step2
      - exit_days
      - skip_risky
      properties:
        delay_minutes:
          type: integer
          minimum: 15
          maximum: 180
          default: 30
        step1:
          type: object
          required:
          - enabled
          - message
          additionalProperties: false
          properties:
            enabled:
              type: boolean
            message:
              $ref: '#/components/schemas/AutomationMessage'
        wait_hours:
          type: integer
          minimum: 6
          maximum: 48
          default: 24
        step2:
          type: object
          required:
          - enabled
          - coupon_id
          - message
          additionalProperties: false
          properties:
            enabled:
              type: boolean
            coupon_id:
              type:
              - string
              - 'null'
            message:
              $ref: '#/components/schemas/AutomationMessage'
        exit_days:
          type: integer
          minimum: 1
          maximum: 7
          default: 3
        skip_risky:
          type: boolean
          default: true
          description: derived condition customer.risk is_not risky (§11.1 C2)
    ThankYouSettings:
      type: object
      additionalProperties: false
      required:
      - delay_hours
      - message
      - conditions
      properties:
        delay_hours:
          type: integer
          minimum: 0
          maximum: 72
          default: 0
        message:
          $ref: '#/components/schemas/AutomationMessage'
        conditions:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/AutomationCondition'
          description: fields order.total_amount, order.payment_method, order.channel, customer.tag
    VipTagSettings:
      type: object
      additionalProperties: false
      required:
      - min_delivered
      - tag
      - message
      - coupon_id
      properties:
        min_delivered:
          type: integer
          minimum: 2
          maximum: 50
          default: 5
        tag:
          type: string
          minLength: 1
          maxLength: 40
          default: VIP
        message:
          allOf:
          - $ref: '#/components/schemas/AutomationMessage'
          - type: object
            required:
            - enabled
            properties:
              enabled:
                type: boolean
          description: when enabled, body must use {coupon} and coupon_id is required to enable
        coupon_id:
          type:
          - string
          - 'null'
    ReturnFlagSettings:
      type: object
      additionalProperties: false
      required:
      - tag
      properties:
        tag:
          type: string
          minLength: 1
          maxLength: 40
          default: Returned
    LowStockSettings:
      type: object
      additionalProperties: false
      properties: {}
      description: no parameters; threshold = the variant's effective low-stock threshold
    AutomationSettings:
      description: Shape depends on the automation's `recipe` (contract §11.1 C1).
      oneOf:
      - $ref: '#/components/schemas/CheckoutRecoverySettings'
      - $ref: '#/components/schemas/ThankYouSettings'
      - $ref: '#/components/schemas/VipTagSettings'
      - $ref: '#/components/schemas/ReturnFlagSettings'
      - $ref: '#/components/schemas/LowStockSettings'
    RecipeCard:
      type: object
      required:
      - recipe
      - name
      - description
      - trigger_label
      - action_label
      - icon
      - added
      properties:
        recipe:
          $ref: '#/components/schemas/RecipeKey'
        name:
          type: string
        description:
          type: string
        trigger_label:
          type: string
        action_label:
          type: string
        icon:
          type: string
          description: UI icon name
        added:
          type: boolean
    Automation:
      type: object
      required:
      - id
      - recipe
      - name
      - status
      - paused_reason
      - settings
      - trigger_label
      - action_label
      - runs_7d
      - last_run_at
      - created_at
      - updated_at
      - revision
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        recipe:
          $ref: '#/components/schemas/RecipeKey'
        name:
          type: string
          maxLength: 80
        status:
          $ref: '#/components/schemas/AutomationStatus'
        paused_reason:
          type:
          - string
          - 'null'
          enum:
          - plan
          - null
          description: plan = the plan lacks sms_automation (P86-17)
        settings:
          $ref: '#/components/schemas/AutomationSettings'
        trigger_label:
          type: string
          description: Figma tag text, e.g. "Checkout left 30 min"
        action_label:
          type: string
          description: e.g. "Reminder SMS"
        runs_7d: &id001
          type: integer
          minimum: 0
        last_run_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        revision:
          type: integer
    RecipeSchema:
      type: object
      required:
      - trigger
      - trigger_description
      - allowed_conditions
      - max_conditions
      - steps
      - merge_fields
      - sms_max_parts
      properties:
        trigger:
          $ref: '#/components/schemas/AutomationTrigger'
        trigger_description:
          type: string
        allowed_conditions:
          type: array
          items:
            $ref: '#/components/schemas/AutomationConditionField'
        max_conditions:
          type: integer
        steps:
          type: array
          items:
            type: object
            required:
            - kind
            - title
            - description
            - optional
            - message_step
            properties:
              kind:
                type: string
                enum:
                - send_message
                - add_tag
                - notify_team
                - wait
              title:
                type: string
              description:
                type: string
              optional:
                type: boolean
              message_step:
                type:
                - integer
                - 'null'
                enum:
                - 1
                - 2
                - null
        merge_fields:
          type: array
          items:
            type: string
            enum:
            - '{name}'
            - '{shop_link}'
            - '{coupon}'
            - '{product}'
            - '{cart_link}'
            - '{order_no}'
        sms_max_parts:
          type: integer
          const: 3
    AutomationDetail:
      allOf:
      - $ref: '#/components/schemas/Automation'
      - type: object
        required:
        - recipe_schema
        - stats_7d
        - last_edited_by
        properties:
          recipe_schema:
            $ref: '#/components/schemas/RecipeSchema'
          stats_7d:
            type: object
            required:
            - runs
            - completed
            - skipped
            - stopped
            - failed
            properties:
              runs: *id001
              completed: *id001
              skipped: *id001
              stopped: *id001
              failed: *id001
          last_edited_by:
            oneOf:
            - $ref: '#/components/schemas/UserRef'
            - type: 'null'
    AutomationListMeta:
      type: object
      required:
      - recipes
      - kpis
      properties:
        recipes:
          type: array
          items:
            $ref: '#/components/schemas/RecipeCard'
        kpis:
          type: object
          required:
          - active
          - drafts
          - total
          - runs_7d
          - runs_7d_succeeded_pct
          - messages_sent_month
          - carts_recovered_30d
          - recovered_revenue_30d
          properties:
            active: *id001
            drafts: *id001
            total: *id001
            runs_7d: *id001
            runs_7d_succeeded_pct:
              type:
              - number
              - 'null'
              description: completed ÷ non-skipped, one decimal
            messages_sent_month: *id001
            carts_recovered_30d: *id001
            recovered_revenue_30d:
              type: integer
              description: minor units
    CreateAutomationInput:
      type: object
      required:
      - recipe
      properties:
        recipe:
          $ref: '#/components/schemas/RecipeKey'
    UpdateAutomationInput:
      type: object
      required:
      - revision
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        settings:
          $ref: '#/components/schemas/AutomationSettings'
        revision:
          type: integer
    RunStatus:
      type: string
      enum:
      - running
      - waiting
      - completed
      - skipped
      - stopped
      - failed
    RunOutcomeReason:
      type: string
      enum:
      - conditions_not_met
      - subject_missing
      - no_eligible_address
      - converted
      - window_ended
      - opted_out
      - automation_off
      - plan
      - error
    RunSubjectType:
      type: string
      enum:
      - order
      - cart
      - return
      - inventory
    StepAction:
      type: string
      enum:
      - send_message
      - add_tag
      - notify_team
    StepStatus:
      type: string
      enum:
      - sending
      - done
      - skipped
      - failed
      - unknown
    StepReason:
      type: string
      enum:
      - not_eligible
      - no_address
      - opted_out
      - frequency_cap
      - allowance
      - coupon_inactive
      - no_customer
      - already_tagged
      - tags_full
      - no_recipients
      - provider_error
      - invalid_address
    AutomationRunStep:
      type: object
      required:
      - index
      - action
      - status
      - reason
      - channel
      - masked_address
      - parts
      - detail
      - executed_at
      properties:
        index: *id001
        action:
          $ref: '#/components/schemas/StepAction'
        status:
          $ref: '#/components/schemas/StepStatus'
        reason:
          oneOf:
          - $ref: '#/components/schemas/StepReason'
          - type: 'null'
        channel:
          oneOf:
          - $ref: '#/components/schemas/MarketingChannel'
          - type: 'null'
        masked_address:
          type:
          - string
          - 'null'
        parts: *id001
        detail:
          oneOf:
          - type: object
            properties:
              recipients: *id001
              tag:
                type: string
              coupon_code:
                type: string
              message_step:
                type: integer
                enum:
                - 1
                - 2
          - type: 'null'
        executed_at:
          type: string
          format: date-time
    AutomationRun:
      type: object
      required:
      - id
      - automation
      - trigger
      - status
      - outcome_reason
      - subject
      - contact
      - context
      - steps
      - started_at
      - resume_at
      - finished_at
      - conversion
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        automation:
          type: object
          required:
          - id
          - recipe
          - name
          properties:
            id:
              $ref: '#/components/schemas/Ulid'
            recipe:
              $ref: '#/components/schemas/RecipeKey'
            name:
              type: string
        trigger:
          $ref: '#/components/schemas/AutomationTrigger'
        status:
          $ref: '#/components/schemas/RunStatus'
        outcome_reason:
          oneOf:
          - $ref: '#/components/schemas/RunOutcomeReason'
          - type: 'null'
        outcome_detail:
          description: Per-condition results when `outcome_reason` is `conditions_not_met` (PHASE-8-6 §6 step 3); otherwise
            null.
          oneOf:
          - type: object
            required:
            - conditions
            properties:
              conditions:
                type: array
                items:
                  type: object
                  required:
                  - field
                  - label
                  - passed
                  - detail
                  properties:
                    field:
                      type: string
                    label:
                      type: string
                    passed:
                      type: boolean
                    detail:
                      type:
                      - string
                      - 'null'
          - type: 'null'
        subject: &id002
          type: object
          required:
          - type
          - id
          - label
          properties:
            type:
              $ref: '#/components/schemas/RunSubjectType'
            id:
              $ref: '#/components/schemas/Ulid'
            label:
              type: string
              description: e.g. "GS-1048", "Cart · 2 items"
        contact:
          oneOf:
          - type: object
            required:
            - masked_address
            - name
            properties:
              masked_address:
                type:
                - string
                - 'null'
              name:
                type:
                - string
                - 'null'
                description: null without customers.view (P86-18)
          - type: 'null'
        context:
          type: object
          description: trigger-time snapshot (§11.1 C9); keys depend on the subject
          properties:
            order_number:
              type: string
            order_total_amount:
              type: integer
            cart_line_count: *id001
            cart_total_amount:
              type: integer
            first_product_name:
              type: string
            first_product_image_url:
              type:
              - string
              - 'null'
              format: uri
            return_number:
              type: string
            product_name:
              type: string
            variant_name:
              type:
              - string
              - 'null'
            on_hand:
              type: integer
            currency:
              type: string
        steps:
          type: array
          items:
            $ref: '#/components/schemas/AutomationRunStep'
        started_at:
          type: string
          format: date-time
        resume_at:
          type:
          - string
          - 'null'
          format: date-time
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
        conversion:
          oneOf:
          - type: object
            required:
            - order
            properties:
              order:
                type: object
                required:
                - id
                - number
                - total_amount
                properties:
                  id:
                    $ref: '#/components/schemas/Ulid'
                  number:
                    type: string
                  total_amount:
                    type: integer
          - type: 'null'
    AutomationDryRunInput:
      type: object
      description: At most one id, matching the recipe's subject; none = latest matching subject.
      properties:
        order_id:
          $ref: '#/components/schemas/Ulid'
        cart_id:
          $ref: '#/components/schemas/Ulid'
        inventory_id:
          $ref: '#/components/schemas/Ulid'
        return_id:
          $ref: '#/components/schemas/Ulid'
    AutomationDryRun:
      type: object
      required:
      - subject
      - conditions
      - steps
      properties:
        subject:
          oneOf:
          - *id002
          - type: 'null'
        conditions:
          type: array
          items:
            type: object
            required:
            - label
            - passed
            - detail
            properties:
              label:
                type: string
              passed:
                type: boolean
              detail:
                type:
                - string
                - 'null'
        steps:
          type: array
          items:
            type: object
            required:
            - index
            - action
            - would
            - reason
            - rendered
            properties:
              index: *id001
              action:
                $ref: '#/components/schemas/StepAction'
              would:
                type: string
                enum:
                - send
                - skip
                - tag
                - notify
              reason:
                oneOf:
                - $ref: '#/components/schemas/StepReason'
                - type: 'null'
              rendered:
                oneOf:
                - type: object
                  required:
                  - channel
                  - subject
                  - text
                  - parts
                  properties:
                    channel:
                      $ref: '#/components/schemas/MarketingChannel'
                    subject:
                      type:
                      - string
                      - 'null'
                    text:
                      type: string
                    parts: *id001
                - type: 'null'
    AutomationTestMessageInput:
      type: object
      required:
      - step
      properties:
        step:
          type: integer
          enum:
          - 1
          - 2
          default: 1
          description: 2 only for checkout_recovery
    AutomationStats:
      type: object
