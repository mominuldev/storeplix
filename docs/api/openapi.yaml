  /stores/{store}/imports:
    post:
      tags:
      - data
      summary: Upload CSV for import
      operationId: createImport
      description: Owner/admin only (`BulkData`). CSV only, ≤ 10 MB, ≤ 5 000 rows, ≤ 50 columns. Archives/binaries/non-UTF-8
        → 422 `unsupported_file`.
      security:
      - sessionCookie: []
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/StorePath'
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/DataImport'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TenantForbiddenOrRole'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Another import is validating or importing (`import_in_progress`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '413':
          description: File over 10 MB (`payload_too_large`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: '`unsupported_file`, `too_many_rows`, `too_many_columns`, `empty_file` or `validation_failed`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - type
              properties:
                file:
                  type: string
                  format: binary
                type:
                  $ref: '#/components/schemas/DataImportType'
