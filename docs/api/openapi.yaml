    post:
      tags:
      - storefront
      summary: Place order (COD)
      operationId: storefrontCheckout
      description: 'One transaction: re-price, commit stock, coupon, zone, customer upsert, order. Replay with the same key → same 201
        + `Idempotent-Replayed: true`. Throttle `checkout`.'
      security:
      - storefrontKey: []
      parameters:
      - $ref: '#/components/parameters/StorefrontHost'
      - $ref: '#/components/parameters/StorefrontPreview'
      - $ref: '#/components/parameters/StorefrontClientIp'
      - $ref: '#/components/parameters/CartToken'
      - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CheckoutInput'
      responses:
        '201':
          description: Order placed
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/CheckoutResult'
          headers:
            Idempotent-Replayed:
              schema:
                type: string
                enum:
                - 'true'
              description: Present on replays
        '400':
          description: '`idempotency_key_required` (header missing or not 8–64 characters of `[A-Za-z0-9_-]`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Bad key (`invalid_storefront_key`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: '`cart_not_found` (clear sp_cart) or `not_found`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: '`store_not_live`, `checkout_changed`, `idempotency_key_mismatch`, `idempotency_key_in_use`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: '`cart_empty`, `out_of_stock` (`items.N.quantity`), `coupon_invalid`, `payment_method_unavailable`, `validation_failed`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          $ref: '#/components/responses/RateLimited'
