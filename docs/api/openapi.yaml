        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TenantForbiddenOrRole'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`revision_conflict` (draft changed since the client saw it) or `theme_not_active`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
