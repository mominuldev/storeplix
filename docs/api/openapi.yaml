  /storefront/config:
    get:
      tags:
      - storefront
      summary: Get storefront config
      operationId: getStorefrontConfig
      description: |
        Server-to-server only (Next.js storefront). Tenant resolved from X-Storefront-Host validated against
        store_domains (routable rows only). Active and draft stores resolve (draft → storefront renders Coming soon
        unless `preview` is true); suspended stores → 404. Returns published theme config unless previewing.
      security:
      - storefrontKey: []
      parameters:
      - in: header
        name: X-Storefront-Host
        required: true
        schema:
          type: string
          maxLength: 253
          example: demo.localhost
        description: Normalized host (lowercase, no port, no trailing dot, punycode).
      - in: header
        name: X-Storefront-Preview
        required: false
        schema:
          type: string
        description: |
          Preview token from the `sp_preview` cookie. Valid for the resolved store → `preview: true` (draft theme);
          invalid/expired/other store → silently ignored (`preview: false`). Responses are `Cache-Control: private, no-store`
          when the store is draft or a preview header is present.
      responses:
        '200':
          description: Render configuration
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    oneOf:
                    - $ref: '#/components/schemas/StorefrontConfig'
                    - $ref: '#/components/schemas/StorefrontSuspended'
                    description: 'Phase 8.1: `StorefrontSuspended` when the shop is suspended (P8-12).'
        '401':
          description: Missing/invalid X-Storefront-Key (code `invalid_storefront_key`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Unknown or non-routable host (code `store_not_found`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: store_not_found
                  message: Store not found.
