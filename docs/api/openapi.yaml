      - slug
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        slug:
          type: string
          minLength: 3
          maxLength: 63
          pattern: ^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$
