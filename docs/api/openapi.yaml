    StorefrontConfig:
      type: object
      required:
      - store
      - preview
      - theme
      - seo
      - contact
      - social
      properties:
        commerce:
          $ref: '#/components/schemas/StorefrontCommerce'
        store:
          type: object
          required:
          - id
          - name
          - slug
          - status
          - currency
          - logo_url
          - favicon_url
          - icons
          - primary_host
          properties:
            id:
              $ref: '#/components/schemas/Ulid'
            name:
              type: string
            slug:
              type: string
            primary_host:
              type: string
              description: Canonical host (store_domains.is_primary); used for canonical URLs, sitemap and robots.
            redirect_host:
              type:
              - string
              - 'null'
              description: Phase 6 (P6-15). The primary host, set only when the request host (X-Storefront-Host) is not the
                primary, the request is not a valid preview, and the primary or the request host is a custom domain (platform
                hosts never redirect to a platform primary); the storefront then permanently redirects GET page requests to the
                same path on this host (308; robots/sitemap 301). Optional on the wire for rolling deploys.
            status:
              type: string
              enum:
              - active
              - draft
            currency:
              type: string
            logo_url:
              type:
              - string
              - 'null'
              format: uri
              description: Logo variant w320 (or original while processing).
            favicon_url:
              type:
              - string
              - 'null'
              format: uri
              description: favicon_32 variant.
            icons:
              type: object
              required:
              - apple_touch
              - icon_192
              - icon_512
              properties:
                apple_touch:
                  type:
                  - string
                  - 'null'
                  format: uri
                icon_192:
                  type:
                  - string
                  - 'null'
                  format: uri
                icon_512:
                  type:
                  - string
                  - 'null'
                  format: uri
        preview:
          type: boolean
          description: true only when a valid X-Storefront-Preview token for this store was sent.
        theme:
          $ref: '#/components/schemas/ThemeConfig'
          description: Active theme's published config; the draft config when `preview` is true.
        seo:
          type: object
          required:
          - title
          - description
          - og_image_url
          - noindex
          properties:
            title:
              type: string
            description:
              type:
              - string
              - 'null'
            og_image_url:
              type:
              - string
              - 'null'
              format: uri
              description: Store share image (1200×630 recommended); falls back to null.
            noindex:
              type: boolean
              description: Merchant chose "Hide the whole shop from Google".
        navigation:
          type: object
          description: Resolved menus. Public responses drop links to unpublished/missing pages; preview keeps unpublished ones. Optional for rolling deploys.
          required: [main, footer, help]
          properties:
            main:
              $ref: '#/components/schemas/StorefrontNavMenu'
            footer:
              $ref: '#/components/schemas/StorefrontNavMenu'
            help:
              $ref: '#/components/schemas/StorefrontNavMenu'
        media:
          type: object
          description: Exactly the media ids referenced by `theme`, keyed by id. Optional for rolling deploys.
          additionalProperties:
            $ref: '#/components/schemas/StorefrontMedia'
        contact:
          $ref: '#/components/schemas/StoreContact'
        social:
          $ref: '#/components/schemas/SocialLinks'
