              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/InvitationPreview'
        '404':
          description: '`invitation_invalid` (unknown/expired/revoked/accepted)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /invitations/{token}/accept:
    post:
      tags:
      - staff
      summary: Accept invitation
      operationId: acceptInvitation
      description: 'Without Bearer: body AcceptInvitationInput creates the user → 201 AuthToken. With Bearer (user email must
        equal the invitation email): empty body → 200 TenantMembership.'
      security:
      - {}
      - bearerAuth: []
      parameters:
      - in: path
        name: token
        required: true
        schema:
          type: string
          maxLength: 64
        description: Invitation token from the email link.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptInvitationInput'
      responses:
        '200':
          description: Joined (existing user)
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/TenantMembership'
        '201':
          $ref: '#/components/responses/AuthTokenCreated'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '402':
          description: '`plan_limit_reached`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: '`invitation_email_mismatch`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: '`invitation_invalid`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: '`login_required` (account exists, no Bearer) or `already_member`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /media:
    post:
      tags:
      - media
      summary: Upload media
      operationId: uploadMedia
      description: Any role. MIME sniffed from bytes; per-purpose limits in PHASE-2-CONTRACT §1.5. Variants generated asynchronously.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - purpose
              properties:
                file:
                  type: string
                  format: binary
                purpose:
                  $ref: '#/components/schemas/MediaPurpose'
                alt:
                  type: string
                  maxLength: 255
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Media'
        '400':
          $ref: '#/components/responses/TenantRequired'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TenantForbiddenOrRole'
        '413':
          description: Body larger than 6 MB (rejected by Nginx)
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /media/{media}:
    get:
      tags:
      - media
      summary: Get media
      operationId: getMedia
      description: Any role. Poll until status != processing.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - in: path
        name: media
        required: true
        schema:
          $ref: '#/components/schemas/Ulid'
        description: ULID; must belong to the X-Tenant-Id tenant, else 404 `not_found`.
      responses:
        '200':
          description: Media
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Media'
        '400':
          $ref: '#/components/responses/TenantRequired'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TenantForbiddenOrRole'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - media
      summary: Delete media
      operationId: deleteMedia
      description: Any role; owner/admin for logo/favicon.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - in: path
        name: media
        required: true
        schema:
          $ref: '#/components/schemas/Ulid'
        description: ULID; must belong to the X-Tenant-Id tenant, else 404 `not_found`.
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/TenantRequired'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TenantForbiddenOrRole'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`media_in_use`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /plans:
    get:
      tags:
      - billing
      summary: List plans
      operationId: listPlans
      description: Public list of active plans.
      security: []
      responses:
        '200':
          description: Plans
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Plan'
  /subscription:
    get:
      tags:
      - billing
      summary: Get subscription
      operationId: getSubscription
      description: Owner/admin.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Subscription
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Subscription'
        '400':
          $ref: '#/components/responses/TenantRequired'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TenantForbiddenOrRole'
  /features:
    get:
      tags:
      - billing
      summary: Get features
      operationId: getFeatures
      description: Any role. Effective plan features and limit usage (FeatureGate).
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Features
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/FeatureAccess'
        '400':
          $ref: '#/components/responses/TenantRequired'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TenantForbiddenOrRole'
  /audit-logs:
    get:
      tags:
      - audit
      summary: List audit logs
      operationId: listAuditLogs
      description: Owner/admin. Only this tenant's rows; newest first.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
      - in: query
        name: per_page
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
      - in: query
        name: filter[action]
        schema:
          type: string
        description: Comma list of action names; `prefix.*` allowed
      - in: query
        name: filter[actor_id]
        schema:
          $ref: '#/components/schemas/Ulid'
      - in: query
        name: filter[subject_type]
        schema:
          type: string
          enum:
          - store
          - store_settings
          - staff_member
          - staff_invitation
          - media
          - subscription
          - user
      - in: query
        name: filter[subject_id]
        schema:
          $ref: '#/components/schemas/Ulid'
      - in: query
        name: filter[created_at][gte]
        schema:
          type: string
          format: date-time
      - in: query
        name: filter[created_at][lte]
        schema:
          type: string
          format: date-time
      - in: query
        name: sort
        schema:
          type: string
          enum:
          - -created_at
      responses:
        '200':
          description: Audit log
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLog'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/TenantRequired'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TenantForbiddenOrRole'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /storefront/config:
    get:
      tags:
      - storefront
      summary: Get storefront config
      operationId: getStorefrontConfig
      description: |
        Server-to-server only (Next.js storefront). Tenant resolved from X-Storefront-Host validated against
        store_domains (routable rows only). Active and draft stores resolve (draft → storefront renders Coming soon
        unless `preview` is true); suspended stores → 404. Returns published theme config unless previewing.
      security:
      - storefrontKey: []
      parameters:
      - in: header
        name: X-Storefront-Host
        required: true
        schema:
          type: string
          maxLength: 253
          example: demo.localhost
        description: Normalized host (lowercase, no port, no trailing dot, punycode).
      - in: header
        name: X-Storefront-Preview
        required: false
        schema:
          type: string
        description: |
          Preview token from the `sp_preview` cookie. Valid for the resolved store → `preview: true` (draft theme);
          invalid/expired/other store → silently ignored (`preview: false`). Responses are `Cache-Control: private, no-store`
          when the store is draft or a preview header is present.
      responses:
        '200':
          description: Render configuration
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/StorefrontConfig'
        '401':
          description: Missing/invalid X-Storefront-Key (code `invalid_storefront_key`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: Unknown or non-routable host (code `store_not_found`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: store_not_found
                  message: Store not found.
components:
  parameters:
    TenantId:
      in: header
      name: X-Tenant-Id
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
      description: Tenant ULID; validated against the user's tenant_users membership.
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Sanctum personal access token.
    storefrontKey:
      type: apiKey
      in: header
      name: X-Storefront-Key
      description: Shared secret STOREFRONT_API_KEY (server-to-server only).
  responses:
    ValidationFailed:
      description: Validation failed (code `validation_failed`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error:
              code: validation_failed
              message: The given data was invalid.
              details:
                email:
                - The email has already been taken.
    Unauthenticated:
      description: Missing or invalid token (code `unauthenticated`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimited:
      description: Too many requests. Body `{error:{code, message, retry_after}}` (code `rate_limited`, or `otp_rate_limited`
        for OTP send limits) plus a `Retry-After` header with the same number of seconds. Auth routes use per-route limiters;
        the exact limits are listed in apps/api/README.md (not duplicated here).
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait (same as error.retry_after).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error:
              code: otp_rate_limited
              message: Too many code requests. Please wait before trying again.
              retry_after: 42
    TenantRequired:
      description: X-Tenant-Id missing (code `tenant_required`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TenantForbiddenOrRole:
      description: X-Tenant-Id not one of the user's memberships (code `tenant_forbidden`), or the role may not call this
        endpoint (`forbidden`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Not found or belongs to another tenant (code `not_found`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    AuthTokenOk:
      description: Token issued
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthTokenResponse'
    AuthTokenCreated:
      description: User created and token issued
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthTokenResponse'
    InvalidOtp:
      description: Wrong, expired, consumed or over-attempted code, or unknown phone (code `invalid_otp`, no further detail)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    Ulid:
      type: string
      pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
      example: 01JD3Z8Q6V2K9X4M7N5P0R1S2T
    ApiError:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              example: not_found
            message:
              type: string
            details:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
            retry_after:
              type: integer
              description: Seconds until retry is allowed. Present on every 429 (mirrors the Retry-After header).
    PaginationMeta:
      type: object
      required:
      - current_page
      - per_page
      - total
      - last_page
      properties:
        current_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        last_page:
          type: integer
    HealthStatus:
      type: object
      required:
      - status
      - version
      - time
      properties:
        status:
          type: string
          enum:
          - ok
        version:
          type: string
          example: 0.1.0
        time:
          type: string
          format: date-time
    User:
      type: object
      required:
      - id
      - name
      - email
      - phone
      - created_at
      - password_changed_at
      - phone_verified_at
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        password_changed_at:
          type:
          - string
          - 'null'
          format: date-time
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/TenantMembership'
          description: Present on /auth/me and token responses.
        phone_verified_at:
          type:
          - string
          - 'null'
          format: date-time
    AuthToken:
      type: object
      required:
      - token
      - user
      - expires_at
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'
        expires_at:
          type: string
          format: date-time
          description: Token expiry (SANCTUM_EXPIRATION, default 7 days).
    PreviewToken:
      type: object
      required:
      - token
      - url
      - expires_at
      properties:
        token:
          type: string
        url:
          type: string
          format: uri
          example: https://demo.storeplix.com/?preview=eyJ...
        expires_at:
          type: string
          format: date-time
    AuthTokenResponse:
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/AuthToken'
    StoreStatus:
      type: string
      enum:
      - draft
      - active
      - suspended
    DomainStatus:
      type: string
      enum:
      - pending_verification
      - verification_failed
      - verified
      - ssl_provisioning
      - active
      - expired
      - suspended
    Store:
      type: object
      required:
      - id
      - tenant_id
      - name
      - slug
      - status
      - country
      - currency
      - primary_domain
      - created_at
      - business_categories
      - name_bn
      - timezone
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        tenant_id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
        slug:
          type: string
        status:
          $ref: '#/components/schemas/StoreStatus'
        country:
          type: string
          minLength: 2
          maxLength: 2
        currency:
          type: string
          minLength: 3
          maxLength: 3
        primary_domain:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        business_categories:
          type: array
          items:
            $ref: '#/components/schemas/BusinessCategory'
          description: 'Phase 2: replaces business_category (string).'
        name_bn:
          type:
          - string
          - 'null'
          maxLength: 80
        timezone:
          type: string
          example: Asia/Dhaka
    ThemeSection:
      type: object
      required:
      - type
      - enabled
      properties:
        type:
          type: string
          example: hero
        enabled:
          type: boolean
        settings:
          type: object
          additionalProperties: true
    ThemeConfig:
      type: object
      description: Theme config document; top-level `settings` keys are camelCase and passed through untransformed.
      required:
      - theme
      - version
      - settings
      - sections
      properties:
        theme:
          type: string
          example: classic
        version:
          type: string
          example: 1.0.0
        settings:
          type: object
          required:
          - primaryColor
          - secondaryColor
          - fontFamily
          additionalProperties: true
          properties:
            primaryColor:
              type: string
              pattern: ^#[0-9a-fA-F]{6}$
            secondaryColor:
              type: string
              pattern: ^#[0-9a-fA-F]{6}$
            fontFamily:
              type: string
              example: Inter
        sections:
          type: array
          maxItems: 30
          items:
            $ref: '#/components/schemas/ThemeSection'
    StorefrontConfig:
      type: object
      required:
      - store
      - preview
      - theme
      - seo
      - contact
      - social
      properties:
        store:
          type: object
          required:
          - id
          - name
          - slug
          - status
          - currency
          - logo_url
          - favicon_url
          - icons
          properties:
            id:
              $ref: '#/components/schemas/Ulid'
            name:
              type: string
            slug:
              type: string
            status:
              type: string
              enum:
              - active
              - draft
            currency:
              type: string
            logo_url:
              type:
              - string
              - 'null'
              format: uri
              description: Logo variant w320 (or original while processing).
            favicon_url:
              type:
              - string
              - 'null'
              format: uri
              description: favicon_32 variant.
            icons:
              type: object
              required:
              - apple_touch
              - icon_192
              - icon_512
              properties:
                apple_touch:
                  type:
                  - string
                  - 'null'
                  format: uri
                icon_192:
                  type:
                  - string
                  - 'null'
                  format: uri
                icon_512:
                  type:
                  - string
                  - 'null'
                  format: uri
        preview:
          type: boolean
          description: true only when a valid X-Storefront-Preview token for this store was sent.
        theme:
          $ref: '#/components/schemas/ThemeConfig'
        seo:
          type: object
          required:
          - title
          - description
          properties:
            title:
              type: string
            description:
              type:
              - string
              - 'null'
        contact:
          $ref: '#/components/schemas/StoreContact'
        social:
          $ref: '#/components/schemas/SocialLinks'
    TenantRole:
      type: string
      enum:
      - owner
      - admin
      - staff
    AssignableRole:
      type: string
      enum:
      - admin
      - staff
    TenantMembership:
      type: object
      required:
      - id
      - name
      - role
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
        role:
          $ref: '#/components/schemas/TenantRole'
    MessageResponse:
      type: object
      required:
      - message
      properties:
        message:
          type: string
    BusinessCategory:
      type: string
      enum:
      - fashion
      - beauty
      - kids
      - food_grocery
      - electronics
      - home
    CreateStoreInput:
      type: object
      required:
      - name
      - slug
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        slug:
          type: string
          minLength: 3
          maxLength: 63
          pattern: ^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$
          description: Not reserved; globally unique.
        country:
          type: string
          minLength: 2
          maxLength: 2
          default: BD
        currency:
          type: string
          enum:
          - BDT
          - USD
          default: BDT
        business_categories:
          type: array
          maxItems: 6
          uniqueItems: true
          items:
            $ref: '#/components/schemas/BusinessCategory'
        name_bn:
          type:
          - string
          - 'null'
          maxLength: 80
        timezone:
          type: string
          default: Asia/Dhaka
    ResetPasswordInput:
      type: object
      required:
      - email
      - token
      - password
      - password_confirmation
      properties:
        email:
          type: string
          format: email
        token:
          type: string
        password:
          type: string
          minLength: 8
          maxLength: 128
        password_confirmation:
          type: string
    UpdateProfileInput:
      type: object
      required: []
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        phone:
          type:
          - string
          - 'null'
          maxLength: 20
        current_password:
          type: string
          description: Required when email changes.
    ChangePasswordInput:
      type: object
      required:
      - current_password
      - password
      - password_confirmation
      properties:
        current_password:
          type: string
        password:
          type: string
          minLength: 8
          maxLength: 128
        password_confirmation:
          type: string
    StaffMember:
      type: object
      required:
      - id
      - kind
      - user_id
      - name
      - email
      - phone
      - role
      - status
      - is_you
      - invited_by
      - joined_at
      - expires_at
      - created_at
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        kind:
          type: string
          enum:
          - member
          - invitation
        user_id:
          oneOf:
          - $ref: '#/components/schemas/Ulid'
          - type: 'null'
        name:
          type:
          - string
          - 'null'
        email:
          type: string
          format: email
        phone:
          type:
          - string
          - 'null'
        role:
          $ref: '#/components/schemas/TenantRole'
        status:
