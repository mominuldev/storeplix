            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          $ref: '#/components/responses/TenantForbiddenOrRole'
        '422':
          description: '`validation_failed` (unknown scope, name), `scope_not_grantable` (details.scopes) or `limit_reached`'
