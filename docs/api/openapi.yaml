            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/TenantMembership'
        '201':
          $ref: '#/components/responses/AuthTokenCreated'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '402':
