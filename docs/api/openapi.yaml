          pattern: ^[a-z0-9]{8,16}$
        type:
          type: string
          enum: [heading, rich_text, image, button, callout, table]
        text:
          type: string
          maxLength: 120
        level:
          type: integer
          enum: [2, 3]
        doc:
          $ref: '#/components/schemas/RichTextDoc'
        media_id:
          type: [string, 'null']
