          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
components:
  parameters:
    AdminTenantPath:
      in: path
      name: tenant
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    AdminDomainPath:
      in: path
      name: domain
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    ImpersonationPath:
      in: path
      name: impersonation
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    PlatformUserPath:
      in: path
      name: user
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    PlatformInvitationPath:
      in: path
      name: invitation
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    PlatformInvitationToken:
      in: path
      name: token
      required: true
      schema:
        type: string
    BillingInvoicePath:
      in: path
      name: invoice
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
      description: billing_invoices.id of this tenant, else 404
    BillingPaymentPath:
      in: path
      name: payment
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
      description: billing_payments.id of this tenant, else 404
    ReportFrom:
      in: query
      name: from
      required: false
      schema:
        type: string
        format: date
      description: Store-local date (YYYY-MM-DD), default 1st of the current month; ≥ 2020-01-01; span ≤ 366 days
    ReportTo:
      in: query
      name: to
      required: false
      schema:
        type: string
        format: date
      description: Store-local date (YYYY-MM-DD), default today; future dates are clipped to today
    GatewayProviderPath:
      in: path
      name: provider
      required: true
      schema:
        $ref: '#/components/schemas/GatewayProvider'
      description: bkash | sslcommerz; anything else → 404
    CourierProviderPath:
      in: path
      name: provider
      required: true
      schema:
        $ref: '#/components/schemas/CourierProvider'
      description: steadfast | pathao | redx; anything else → 404
    ShipmentPath:
      in: path
      name: shipment
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
      description: shipments.id of this store, else 404
    ShipmentBatchPath:
      in: path
      name: batch
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
      description: shipment_batches.id of this store, else 404
    PaymentLinkPath:
      in: path
      name: link
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
      description: payment_links.id of this order, else 404
    ReturnPath:
      in: path
      name: return
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
      description: return_requests.id of this store, else 404
    DocumentPath:
      in: path
      name: document
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
      description: documents.id of this store, else 404
    DocumentKindPath:
      in: path
      name: kind
      required: true
      schema:
        $ref: '#/components/schemas/DocumentKind'
      description: Template kind; unknown → 404
    PaymentPath:
      in: path
      name: payment
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
      description: payments.id
    PayLinkToken:
      in: path
      name: token
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9]{12}$
      description: Payment link token (12 base62 characters)
    RouteKey:
      in: path
      name: route_key
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9]{32}$
      description: Per-account webhook route key; unknown → 404
    OrderToken:
      in: header
      name: X-Order-Token
      required: true
      schema:
        type: string
        maxLength: 64
      description: Confirmation token from the sp_order cookie (P5-23)
    SignedExpires:
      in: query
      name: expires
      required: true
      schema:
        type: integer
    SignedSignature:
      in: query
      name: signature
      required: true
      schema:
        type: string
    StorefrontPreview:
      in: header
      name: X-Storefront-Preview
      required: false
      schema:
        type: string
      description: Preview token from the sp_preview cookie; invalid is ignored.
    StorefrontClientIp:
      in: header
      name: X-Storefront-Client-Ip
      required: false
      schema:
        type: string
        maxLength: 45
      description: Shopper IP; trusted only with a valid storefront key.
    CartToken:
      in: header
      name: X-Cart-Token
      required: false
      schema:
        type: string
        maxLength: 64
      description: Opaque cart token from the sp_cart cookie (P5-3).
    IdempotencyKeyRequired:
      in: header
      name: Idempotency-Key
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 64
        pattern: '^[A-Za-z0-9_-]{8,64}$'
      description: 8–64 characters of `[A-Za-z0-9_-]` (a UUID or ULID fits); kept 24 h (API-CONVENTIONS §9). Missing or malformed → 400 `idempotency_key_required`.
    ProductSlug:
      in: path
      name: slug
      required: true
      schema:
        type: string
        maxLength: 220
    CategorySlug:
      in: path
      name: slug
      required: true
      schema:
        type: string
        maxLength: 140
    CartItemPath:
      in: path
      name: item
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    OrderPath:
      in: path
      name: order
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
      description: orders.id of this store, else 404.
    CouponPath:
      in: path
      name: coupon
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    PickupLocationPath:
      in: path
      name: location
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    TenantId:
      in: header
      name: X-Tenant-Id
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
      description: Tenant ULID; validated against the user's tenant_users membership.
    StorePath:
      in: path
      name: store
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
      description: ULID; must belong to the X-Tenant-Id tenant, else 404 `not_found`.
    DomainPath:
      in: path
      name: domain
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
      description: store_domains.id of this store, else 404 `not_found`
    PagePath:
      in: path
      name: page
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
      description: store_pages.id of this store, else 404 `not_found`.
    ThemeCode:
      in: path
      name: code
      required: true
      schema:
        type: string
        pattern: ^[a-z0-9-]{1,64}$
        example: modern-commerce
    StorefrontHost:
      in: header
      name: X-Storefront-Host
      required: true
      schema:
        type: string
        maxLength: 253
        example: demo.localhost
      description: Normalized host (lowercase, no port, no trailing dot, punycode).
    CategoryPath:
      in: path
      name: category
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
      description: categories.id of this store, else 404 `not_found`.
    ProductPath:
      in: path
      name: product
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
      description: products.id of this store, else 404 `not_found`.
    VariantPath:
      in: path
      name: variant
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
      description: product_variants.id of this store, else 404 `not_found`.
    CustomerPath:
      in: path
      name: customer
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
      description: customers.id of this store, else 404 `not_found`.
    NotePath:
      in: path
      name: note
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
      description: customer_notes.id of this customer, else 404 `not_found`.
    ImportPath:
      in: path
      name: import
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
      description: data_imports.id of this store, else 404 `not_found`.
    ExportPath:
      in: path
      name: export
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
      description: data_exports.id of this store, else 404 `not_found`.
    AnalyticsRangeParam:
      in: query
      name: range
      description: PHASE-8-2 P82-17. Default `30d` (overview) or `12m` (revenue).
      schema:
        $ref: '#/components/schemas/AnalyticsRange'
    AnalyticsFrom:
      in: query
      name: from
      description: Dhaka date; required iff `range=custom`. `from ≥ 2024-01-01`, at most 731 days before `to`.
      schema:
        type: string
        format: date
    AnalyticsTo:
      in: query
      name: to
      description: Dhaka date; required iff `range=custom`; clamped to `as_of`.
      schema:
        type: string
        format: date
    AnalyticsGranularityParam:
      in: query
      name: granularity
      description: Overrides the default bucket size (caps day ≤ 92, week ≤ 106, month ≤ 25 buckets; over → 422).
      schema:
        $ref: '#/components/schemas/AnalyticsGranularity'
    CampaignPath:
      in: path
      name: campaign
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    UnsubscribeCode:
      in: path
      name: code
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9]{10}$
      description: 10 base62 chars from the message link; a malformed value answers the same 404 as an unknown one.
    AutomationPath:
      in: path
      name: automation
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
    AutomationRunPath:
      in: path
      name: run
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-sp_session
      description: Phase 4.7 Sanctum SPA session (dev cookie name `sp_session`). Same-origin only; writes also need header `X-XSRF-TOKEN`
        (from the `XSRF-TOKEN` cookie), else 419 `csrf_token_mismatch`.
    bearerAuth:
      type: http
      scheme: bearer
      description: Sanctum personal access token. Deprecated in Phase 4.7a, removed in 4.7c (SPAs use sessionCookie).
    storefrontKey:
      type: apiKey
      in: header
      name: X-Storefront-Key
      description: Shared secret STOREFRONT_API_KEY (server-to-server only).
    ApiKeyAuth:
      type: http
      scheme: bearer
      bearerFormat: sp_live_<40 base62>
      description: 'Phase 8.4 developer API key (`Authorization: Bearer sp_live_…`), only for /external/*. 120 requests/min per
        key (limiter external-api). Merchant routes never accept it.'
  responses:
    AdminForbidden:
      description: Not an admin session (`surface`), not active staff, IP not allowed, or the role lacks the platform permission
        (code `forbidden`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RevisionConflict:
      description: The resource changed since the client read it (code `revision_conflict`). Refetch and retry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    StoreThemeOk:
      description: Store theme
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/StoreTheme'
    StorePageOk:
      description: Page
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/StorePage'
    ValidationFailed:
      description: Validation failed (code `validation_failed`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error:
              code: validation_failed
              message: The given data was invalid.
              details:
                email:
                - The email has already been taken.
    Unauthenticated:
      description: Missing or invalid token (code `unauthenticated`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimited:
      description: Too many requests. Body `{error:{code, message, retry_after}}` (code `rate_limited`, or `otp_rate_limited`
        for OTP send limits) plus a `Retry-After` header with the same number of seconds. Auth routes use per-route limiters;
        the exact limits are listed in apps/api/README.md (not duplicated here).
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait (same as error.retry_after).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error:
              code: otp_rate_limited
              message: Too many code requests. Please wait before trying again.
              retry_after: 42
    TenantRequired:
      description: X-Tenant-Id missing (code `tenant_required`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TenantForbiddenOrRole:
      description: X-Tenant-Id not one of the user's memberships (code `tenant_forbidden`), or the role may not call this
        endpoint (`forbidden`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Not found or belongs to another tenant (code `not_found`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    AuthTokenOk:
      description: Token issued
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthTokenResponse'
    AuthTokenCreated:
      description: User created and token issued
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthTokenResponse'
    InvalidOtp:
      description: Wrong, expired, consumed or over-attempted code, or unknown phone (code `invalid_otp`, no further detail)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    InvalidApiKey:
      description: Missing, malformed, unknown or revoked API key (code `invalid_api_key`; identical body in every case)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    Ulid:
      type: string
      pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
      example: 01JD3Z8Q6V2K9X4M7N5P0R1S2T
    ApiError:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              example: not_found
            message:
              type: string
            details:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
            retry_after:
              type: integer
              description: Seconds until retry is allowed. Present on every 429 (mirrors the Retry-After header).
    PaginationMeta:
      type: object
      required:
      - current_page
      - per_page
      - total
      - last_page
      properties:
        current_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        last_page:
          type: integer
    HealthStatus:
      type: object
      required:
      - status
      - version
      - time
      properties:
        status:
          type: string
          enum:
          - ok
        version:
          type: string
          example: 0.1.0
        time:
          type: string
          format: date-time
    User:
      type: object
      required:
      - id
      - name
      - email
      - phone
      - created_at
      - password_changed_at
      - phone_verified_at
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        password_changed_at:
          type:
          - string
          - 'null'
          format: date-time
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/TenantMembership'
          description: Present on /auth/me and token responses.
        phone_verified_at:
          type:
          - string
          - 'null'
          format: date-time
    AuthToken:
      type: object
      required:
      - token
      - user
      - expires_at
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'
        expires_at:
          type: string
          format: date-time
          description: Token expiry (SANCTUM_EXPIRATION, default 7 days).
    PreviewToken:
      type: object
      required:
      - token
      - url
      - expires_at
      properties:
        token:
          type: string
        url:
          type: string
          format: uri
          example: https://demo.storeplix.com/?preview=eyJ...
        expires_at:
          type: string
          format: date-time
    AuthTokenResponse:
      description: 'Phase 4.7a: login/register/OTP login/invitation accept/password change return AuthSessionResponse
        (user, expires_at) plus this deprecated `token`. Removed in 4.7c.'
      deprecated: true
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/AuthToken'
    StoreStatus:
      type: string
      enum:
      - draft
      - active
      - suspended
    DomainStatus:
      type: string
      enum:
      - pending_verification
      - verification_failed
      - verified
      - ssl_provisioning
      - active
      - expired
      - suspended
    DomainType:
      type: string
      enum:
      - platform
      - custom
    DomainFailureCode:
      type: string
      description: PHASE-6 §2.4. Clients must tolerate new values.
      enum:
      - txt_missing
      - txt_mismatch
      - cname_missing
      - cname_mismatch
      - dns_error
      - verification_timeout
      - provider_error
      - provider_blocked
      - provider_moved
      - ssl_validation_failed
      - ssl_timeout
      - ssl_lost
      - suspended
      - plan_limit
    DnsRecordStatus:
      type: string
      enum:
      - pending
      - ok
      - missing
      - mismatch
    DomainSslStatus:
      type: string
      enum:
      - none
      - pending
      - active
      - failed
    DomainDnsRecord:
      type: object
      required:
      - purpose
      - type
      - name
      - name_relative
      - value
      - status
      - found
      properties:
        purpose:
          type: string
          enum:
          - ownership
          - routing
        type:
          type: string
          enum:
          - TXT
          - CNAME
        name:
          type: string
          description: FQDN, e.g. `_storeplix-verify.shop.acme.com`
        name_relative:
          type: string
          description: Relative to the registrable domain (`@`, `shop`, `_storeplix-verify.shop`)
        value:
          type: string
          description: '`sp-verify=<token>` (TXT) or the CNAME target'
        status:
          $ref: '#/components/schemas/DnsRecordStatus'
        found:
          type: array
          maxItems: 5
          items:
            type: string
            maxLength: 255
          description: Values the resolvers returned at the last check
    StoreDomain:
      type: object
      description: PHASE-6 §6. Never exposes provider ids or raw provider statuses.
      required:
      - id
      - hostname
      - display_hostname
      - type
      - status
      - is_primary
      - is_apex
      - routable
      - dns_records
      - ssl_status
      - verification_started_at
      - verified_at
      - activated_at
      - status_changed_at
      - last_checked_at
      - next_check_at
      - deadline_at
      - failure_code
      - failure_message
      - can_recheck
      - can_make_primary
      - can_remove
      - created_at
      - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        hostname:
          type: string
          maxLength: 253
          description: Lowercase ASCII (punycode), no trailing dot
        display_hostname:
          type: string
          description: Unicode form for display
        type:
          $ref: '#/components/schemas/DomainType'
        status:
          $ref: '#/components/schemas/DomainStatus'
        is_primary:
          type: boolean
        is_apex:
          type: boolean
        routable:
          type: boolean
          description: status `active` and the store is not suspended
        dns_records:
          type: array
          description: Empty for platform rows
          items:
            $ref: '#/components/schemas/DomainDnsRecord'
        ssl_status:
          $ref: '#/components/schemas/DomainSslStatus'
        verification_started_at:
          type:
          - string
          - 'null'
          format: date-time
        verified_at:
          type:
          - string
          - 'null'
          format: date-time
        activated_at:
          type:
          - string
          - 'null'
          format: date-time
        status_changed_at:
          type:
          - string
          - 'null'
          format: date-time
        last_checked_at:
          type:
          - string
          - 'null'
          format: date-time
        next_check_at:
          type:
          - string
          - 'null'
          format: date-time
        deadline_at:
          type:
          - string
          - 'null'
          format: date-time
          description: The 72 h / 24 h / 7-day deadline that applies now
        failure_code:
          oneOf:
          - $ref: '#/components/schemas/DomainFailureCode'
          - type: 'null'
        failure_message:
          type:
          - string
          - 'null'
          maxLength: 255
        can_recheck:
          type: boolean
        can_make_primary:
          type: boolean
        can_remove:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    AddDomainInput:
      type: object
      required:
      - hostname
      additionalProperties: false
      properties:
        hostname:
          type: string
          maxLength: 300
          description: Bare hostname (Unicode or ASCII); no scheme, path or port
          example: shop.acme.com
    DomainListMeta:
      type: object
      required:
      - cname_target
      - txt_prefix
      - can_add
      - feature_enabled
      - limit
      properties:
        cname_target:
          type: string
          example: customers.storeplix.com
        txt_prefix:
          type: string
          example: _storeplix-verify
        can_add:
          type: boolean
        feature_enabled:
          type: boolean
        limit:
          type: object
          required:
          - used
          - max
          properties:
            used:
              type: integer
            max:
              type:
              - integer
              - 'null'
    DomainAllowed:
      type: object
      required:
      - allowed
      properties:
        allowed:
          type: boolean
          const: true
    Store:
      type: object
      required:
      - id
      - tenant_id
      - name
      - slug
      - status
      - country
      - currency
      - primary_domain
      - created_at
      - business_categories
      - name_bn
      - timezone
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        tenant_id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
        slug:
          type: string
        status:
          $ref: '#/components/schemas/StoreStatus'
        country:
          type: string
          minLength: 2
          maxLength: 2
        currency:
          type: string
          minLength: 3
          maxLength: 3
        primary_domain:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        business_categories:
          type: array
          items:
            $ref: '#/components/schemas/BusinessCategory'
          description: 'Phase 2: replaces business_category (string).'
        name_bn:
          type:
          - string
          - 'null'
          maxLength: 80
        timezone:
          type: string
          example: Asia/Dhaka
    ThemeBlock:
      type: object
      required: [id, type, settings]
      properties:
        id:
          type: string
          pattern: ^[a-z0-9]{8,16}$
        type:
          type: string
          example: stat
        settings:
          type: object
          additionalProperties: true
    ThemeSection:
      type: object
      description: Section of a theme config. Settings and blocks are validated by the theme's JSON Schema (packages/themes/<code>/schema.v<major>.json).
      required:
      - id
      - type
      - enabled
      properties:
        id:
          type: string
          pattern: ^[a-z0-9]{8,16}$
          description: Client-generated, unique within the config.
        type:
          type: string
          example: hero
        enabled:
          type: boolean
        settings:
          type: object
          additionalProperties: true
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/ThemeBlock'
    ThemeConfig:
      type: object
      description: |
        Theme config document. The WHOLE document (global, section and block settings) is camelCase and passed through
        untransformed. Authoritative per-theme schema: packages/themes/<code>/schema.v<major>.json (PHASE-3-CONTRACT §4).
        ≤ 64 KB, ≤ 30 sections.
      required:
      - theme
      - version
      - settings
      - sections
      properties:
        theme:
          type: string
          example: modern-commerce
        version:
          type: string
          example: 1.1.0
        settings:
          $ref: '#/components/schemas/ThemeGlobalSettings'
        sections:
          type: array
          maxItems: 30
          items:
            $ref: '#/components/schemas/ThemeSection'
    ThemeGlobalSettings:
      type: object
      additionalProperties: true
      required: [primaryColor, secondaryColor, textColor, backgroundColor, fontFamily, headingFontFamily, cornerStyle,
        buttonStyle, stylePreset, logoOnDarkMediaId, announcement, header, footer]
      properties:
        primaryColor:
          type: string
          pattern: ^#[0-9a-f]{6}$
        secondaryColor:
          type: string
          pattern: ^#[0-9a-f]{6}$
        textColor:
          type: string
          pattern: ^#[0-9a-f]{6}$
        backgroundColor:
          type: string
          pattern: ^#[0-9a-f]{6}$
        fontFamily:
          type: string
          enum: [Instrument Sans, Inter, Hind Siliguri, Fraunces, Noto Serif Bengali, Baloo Da 2]
        headingFontFamily:
          type: string
          enum: [Instrument Sans, Inter, Hind Siliguri, Fraunces, Noto Serif Bengali, Baloo Da 2]
        cornerStyle:
          type: string
          enum: [square, rounded, pill]
        buttonStyle:
          type: string
          enum: [solid, outline]
        stylePreset:
          type: [string, 'null']
        logoOnDarkMediaId:
