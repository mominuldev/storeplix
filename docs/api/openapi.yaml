          maxLength: 40
        href:
          type: string
          maxLength: 2048
        style:
          type: string
          enum: [primary, secondary]
        title:
          type: [string, 'null']
          maxLength: 80
        items:
          type: array
          maxItems: 8
          items:
            type: string
            maxLength: 200
        tone:
          type: string
          enum: [info, success, warning]
        headers:
          type: array
          minItems: 1
          maxItems: 6
          items:
            type: string
            maxLength: 60
        rows:
          type: array
          maxItems: 50
          items:
            type: array
            items:
              type: string
              maxLength: 200
