    post:
      tags:
      - orders
      summary: Create manual order
      operationId: createOrder
      description: O A S. Same pricing as checkout (P5-19). 402 at the monthly order limit (P5-27). Requires an
        `Idempotency-Key` (400 if missing or malformed). Accepted while the store's COD toggle is off (that toggle governs
        storefront checkout only). A line whose variant is unknown, disabled or archived is 422 `validation_failed` on
        `items.N.variant_id`, not `out_of_stock`. With no shipping zones configured (possible only before go-live) the
        delivery charge is ৳ 0 unless overridden.
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/StorePath'
      - $ref: '#/components/parameters/IdempotencyKeyRequired'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualOrderInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Order'
        '400':
          description: '`idempotency_key_required` (header missing or not 8–64 characters of `[A-Za-z0-9_-]`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '402':
          description: '`plan_limit_reached`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          $ref: '#/components/responses/TenantForbiddenOrRole'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`idempotency_key_mismatch` / `idempotency_key_in_use`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: '`validation_failed`, `out_of_stock`, `coupon_invalid`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          $ref: '#/components/responses/RateLimited'
