                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StoreDomain'
                  meta:
                    $ref: '#/components/schemas/DomainListMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TenantForbiddenOrRole'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - domains
      summary: Connect a custom domain
      operationId: addDomain
      description: Domains (PHASE-6 §4.1, P6-4–P6-7). Writes O A (`ManageDomains`). Normalises the hostname (IDN → punycode, PSL), checks reserved and taken hosts (a stale `verification_failed`/`expired` row of another store older than 7 days is released first, P6-6), gates on the `custom_domain` feature and the `custom_domains` limit, creates a `pending_verification` row with its DNS records and queues the first check. Throttle `domains` (30/min per tenant + user).
      security:
      - sessionCookie: []
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/StorePath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddDomainInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/StoreDomain'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '402':
          description: '`feature_not_in_plan` (custom_domain) or `plan_limit_reached` (custom_domains)'
          content:
