      type: object
      description: |
        Strict subset of ProseMirror/Tiptap JSON (PHASE-3-CONTRACT §4.4): blocks paragraph, heading (level 2|3),
        bulletList, orderedList, listItem (paragraphs only), blockquote; inline text + hardBreak; marks bold, italic,
        underline, strike, link{href}. Unknown nodes/marks/attrs → 422. Link hrefs: relative, https, http, mailto, tel.
        Never HTML.
      required: [type, content]
      properties:
        type:
          const: doc
        content:
          type: array
          maxItems: 100
          items:
            type: object
            required: [type]
            properties:
              type:
                type: string
                enum: [paragraph, heading, bulletList, orderedList, blockquote]
            additionalProperties: true
