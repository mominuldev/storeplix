components:
  parameters:
    TenantId:
      in: header
      name: X-Tenant-Id
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
      description: Tenant ULID; validated against the user's tenant_users membership.
    StorePath:
      in: path
      name: store
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
      description: ULID; must belong to the X-Tenant-Id tenant, else 404 `not_found`.
    PagePath:
      in: path
      name: page
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
      description: store_pages.id of this store, else 404 `not_found`.
    ThemeCode:
      in: path
      name: code
      required: true
      schema:
        type: string
        pattern: ^[a-z0-9-]{1,64}$
        example: modern-commerce
    StorefrontHost:
      in: header
      name: X-Storefront-Host
      required: true
      schema:
        type: string
        maxLength: 253
        example: demo.localhost
      description: Normalized host (lowercase, no port, no trailing dot, punycode).
    CategoryPath:
      in: path
      name: category
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
      description: categories.id of this store, else 404 `not_found`.
    ProductPath:
      in: path
      name: product
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
      description: products.id of this store, else 404 `not_found`.
    VariantPath:
      in: path
      name: variant
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
      description: product_variants.id of this store, else 404 `not_found`.
    CustomerPath:
      in: path
      name: customer
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
      description: customers.id of this store, else 404 `not_found`.
    NotePath:
      in: path
      name: note
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
      description: customer_notes.id of this customer, else 404 `not_found`.
    ImportPath:
      in: path
      name: import
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
      description: data_imports.id of this store, else 404 `not_found`.
    ExportPath:
      in: path
      name: export
      required: true
      schema:
        $ref: '#/components/schemas/Ulid'
      description: data_exports.id of this store, else 404 `not_found`.
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-sp_session
      description: Phase 4.7 Sanctum SPA session (dev cookie name `sp_session`). Same-origin only; writes also need header `X-XSRF-TOKEN`
        (from the `XSRF-TOKEN` cookie), else 419 `csrf_token_mismatch`.
    bearerAuth:
      type: http
      scheme: bearer
      description: Sanctum personal access token. Deprecated in Phase 4.7a, removed in 4.7c (SPAs use sessionCookie).
    storefrontKey:
      type: apiKey
      in: header
      name: X-Storefront-Key
      description: Shared secret STOREFRONT_API_KEY (server-to-server only).
  responses:
    RevisionConflict:
      description: The resource changed since the client read it (code `revision_conflict`). Refetch and retry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    StoreThemeOk:
      description: Store theme
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/StoreTheme'
    StorePageOk:
      description: Page
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data:
                $ref: '#/components/schemas/StorePage'
    ValidationFailed:
      description: Validation failed (code `validation_failed`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error:
              code: validation_failed
              message: The given data was invalid.
              details:
                email:
                - The email has already been taken.
    Unauthenticated:
      description: Missing or invalid token (code `unauthenticated`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    RateLimited:
      description: Too many requests. Body `{error:{code, message, retry_after}}` (code `rate_limited`, or `otp_rate_limited`
        for OTP send limits) plus a `Retry-After` header with the same number of seconds. Auth routes use per-route limiters;
        the exact limits are listed in apps/api/README.md (not duplicated here).
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds to wait (same as error.retry_after).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            error:
              code: otp_rate_limited
              message: Too many code requests. Please wait before trying again.
              retry_after: 42
    TenantRequired:
      description: X-Tenant-Id missing (code `tenant_required`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    TenantForbiddenOrRole:
      description: X-Tenant-Id not one of the user's memberships (code `tenant_forbidden`), or the role may not call this
        endpoint (`forbidden`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: Not found or belongs to another tenant (code `not_found`)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    AuthTokenOk:
      description: Token issued
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthTokenResponse'
    AuthTokenCreated:
      description: User created and token issued
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/AuthTokenResponse'
    InvalidOtp:
      description: Wrong, expired, consumed or over-attempted code, or unknown phone (code `invalid_otp`, no further detail)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    Ulid:
      type: string
      pattern: ^[0-9A-HJKMNP-TV-Z]{26}$
      example: 01JD3Z8Q6V2K9X4M7N5P0R1S2T
    ApiError:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
              example: not_found
            message:
              type: string
            details:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
            retry_after:
              type: integer
              description: Seconds until retry is allowed. Present on every 429 (mirrors the Retry-After header).
    PaginationMeta:
      type: object
      required:
      - current_page
      - per_page
      - total
      - last_page
      properties:
        current_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        last_page:
          type: integer
    HealthStatus:
      type: object
      required:
      - status
      - version
      - time
      properties:
        status:
          type: string
          enum:
          - ok
        version:
          type: string
          example: 0.1.0
        time:
          type: string
          format: date-time
    User:
      type: object
      required:
      - id
      - name
      - email
      - phone
      - created_at
      - password_changed_at
      - phone_verified_at
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
        email:
          type: string
          format: email
        phone:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        password_changed_at:
          type:
          - string
          - 'null'
          format: date-time
        tenants:
          type: array
          items:
            $ref: '#/components/schemas/TenantMembership'
          description: Present on /auth/me and token responses.
        phone_verified_at:
          type:
          - string
          - 'null'
          format: date-time
    AuthToken:
      type: object
      required:
      - token
      - user
      - expires_at
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'
        expires_at:
          type: string
          format: date-time
          description: Token expiry (SANCTUM_EXPIRATION, default 7 days).
    PreviewToken:
      type: object
      required:
      - token
      - url
      - expires_at
      properties:
        token:
          type: string
        url:
          type: string
          format: uri
          example: https://demo.storeplix.com/?preview=eyJ...
        expires_at:
          type: string
          format: date-time
    AuthTokenResponse:
      description: 'Phase 4.7a: login/register/OTP login/invitation accept/password change return AuthSessionResponse
        (user, expires_at) plus this deprecated `token`. Removed in 4.7c.'
      deprecated: true
      type: object
      required:
      - data
      properties:
        data:
          $ref: '#/components/schemas/AuthToken'
    StoreStatus:
      type: string
      enum:
      - draft
      - active
      - suspended
    DomainStatus:
      type: string
      enum:
      - pending_verification
      - verification_failed
      - verified
      - ssl_provisioning
      - active
      - expired
      - suspended
    Store:
      type: object
      required:
      - id
      - tenant_id
      - name
      - slug
      - status
      - country
      - currency
      - primary_domain
      - created_at
      - business_categories
      - name_bn
      - timezone
      properties:
        id:
          $ref: '#/components/schemas/Ulid'
        tenant_id:
          $ref: '#/components/schemas/Ulid'
        name:
          type: string
        slug:
          type: string
        status:
          $ref: '#/components/schemas/StoreStatus'
        country:
          type: string
          minLength: 2
          maxLength: 2
        currency:
          type: string
          minLength: 3
          maxLength: 3
        primary_domain:
          type:
          - string
          - 'null'
        created_at:
          type: string
          format: date-time
        business_categories:
          type: array
          items:
            $ref: '#/components/schemas/BusinessCategory'
          description: 'Phase 2: replaces business_category (string).'
        name_bn:
          type:
          - string
          - 'null'
          maxLength: 80
        timezone:
          type: string
          example: Asia/Dhaka
    ThemeBlock:
      type: object
      required: [id, type, settings]
      properties:
        id:
          type: string
          pattern: ^[a-z0-9]{8,16}$
        type:
          type: string
          example: stat
        settings:
          type: object
          additionalProperties: true
    ThemeSection:
      type: object
      description: Section of a theme config. Settings and blocks are validated by the theme's JSON Schema (packages/themes/<code>/schema.v<major>.json).
      required:
      - id
      - type
      - enabled
      properties:
        id:
          type: string
          pattern: ^[a-z0-9]{8,16}$
          description: Client-generated, unique within the config.
        type:
          type: string
          example: hero
        enabled:
          type: boolean
        settings:
          type: object
          additionalProperties: true
        blocks:
          type: array
          items:
            $ref: '#/components/schemas/ThemeBlock'
    ThemeConfig:
      type: object
      description: |
        Theme config document. The WHOLE document (global, section and block settings) is camelCase and passed through
        untransformed. Authoritative per-theme schema: packages/themes/<code>/schema.v<major>.json (PHASE-3-CONTRACT §4).
        ≤ 64 KB, ≤ 30 sections.
      required:
      - theme
      - version
      - settings
      - sections
      properties:
        theme:
          type: string
          example: modern-commerce
        version:
          type: string
          example: 1.1.0
        settings:
          $ref: '#/components/schemas/ThemeGlobalSettings'
        sections:
          type: array
          maxItems: 30
          items:
            $ref: '#/components/schemas/ThemeSection'
    ThemeGlobalSettings:
      type: object
      additionalProperties: true
      required: [primaryColor, secondaryColor, textColor, backgroundColor, fontFamily, headingFontFamily, cornerStyle,
        buttonStyle, stylePreset, logoOnDarkMediaId, announcement, header, footer]
      properties:
        primaryColor:
          type: string
          pattern: ^#[0-9a-f]{6}$
        secondaryColor:
          type: string
          pattern: ^#[0-9a-f]{6}$
        textColor:
          type: string
          pattern: ^#[0-9a-f]{6}$
        backgroundColor:
          type: string
          pattern: ^#[0-9a-f]{6}$
        fontFamily:
          type: string
          enum: [Instrument Sans, Inter, Hind Siliguri, Fraunces, Noto Serif Bengali, Baloo Da 2]
        headingFontFamily:
          type: string
          enum: [Instrument Sans, Inter, Hind Siliguri, Fraunces, Noto Serif Bengali, Baloo Da 2]
        cornerStyle:
          type: string
          enum: [square, rounded, pill]
        buttonStyle:
          type: string
          enum: [solid, outline]
        stylePreset:
          type: [string, 'null']
        logoOnDarkMediaId:
          type: [string, 'null']
        announcement:
          type: object
          required: [enabled, text, href]
          properties:
            enabled:
              type: boolean
            text:
              type: string
              maxLength: 120
            href:
              type: [string, 'null']
        header:
          type: object
          required: [sticky, showSearch, promoLink]
          properties:
            sticky:
              type: boolean
            showSearch:
              type: boolean
            promoLink:
              type: [object, 'null']
              properties:
                label:
                  type: string
                  maxLength: 30
                href:
                  type: string
        footer:
          type: object
          required: [tagline, showPaymentMethods, paymentMethods]
          properties:
            tagline:
              type: [string, 'null']
              maxLength: 240
            showPaymentMethods:
              type: boolean
            paymentMethods:
              type: array
              maxItems: 8
              uniqueItems: true
              items:
                type: string
                enum: [cod, bkash, nagad, rocket, upay, visa, mastercard, amex]
    StorefrontConfig:
      type: object
      required:
      - store
      - preview
      - theme
      - seo
      - contact
      - social
      properties:
        store:
          type: object
          required:
          - id
          - name
          - slug
          - status
          - currency
          - logo_url
          - favicon_url
          - icons
          - primary_host
          properties:
            id:
              $ref: '#/components/schemas/Ulid'
            name:
              type: string
            slug:
              type: string
            primary_host:
              type: string
              description: Canonical host (store_domains.is_primary); used for canonical URLs, sitemap and robots.
            status:
              type: string
              enum:
              - active
              - draft
            currency:
              type: string
            logo_url:
              type:
              - string
              - 'null'
              format: uri
              description: Logo variant w320 (or original while processing).
            favicon_url:
              type:
              - string
              - 'null'
              format: uri
              description: favicon_32 variant.
            icons:
              type: object
              required:
              - apple_touch
              - icon_192
              - icon_512
              properties:
                apple_touch:
                  type:
                  - string
                  - 'null'
                  format: uri
                icon_192:
                  type:
                  - string
                  - 'null'
                  format: uri
                icon_512:
                  type:
                  - string
                  - 'null'
                  format: uri
        preview:
          type: boolean
          description: true only when a valid X-Storefront-Preview token for this store was sent.
        theme:
          $ref: '#/components/schemas/ThemeConfig'
          description: Active theme's published config; the draft config when `preview` is true.
        seo:
          type: object
          required:
          - title
          - description
          - og_image_url
          - noindex
          properties:
            title:
              type: string
            description:
              type:
              - string
              - 'null'
            og_image_url:
              type:
              - string
              - 'null'
              format: uri
              description: Store share image (1200×630 recommended); falls back to null.
            noindex:
              type: boolean
              description: Merchant chose "Hide the whole shop from Google".
        navigation:
          type: object
          description: Resolved menus. Public responses drop links to unpublished/missing pages; preview keeps unpublished ones. Optional for rolling deploys.
          required: [main, footer, help]
          properties:
            main:
              $ref: '#/components/schemas/StorefrontNavMenu'
            footer:
              $ref: '#/components/schemas/StorefrontNavMenu'
            help:
              $ref: '#/components/schemas/StorefrontNavMenu'
        media:
          type: object
          description: Exactly the media ids referenced by `theme`, keyed by id. Optional for rolling deploys.
          additionalProperties:
            $ref: '#/components/schemas/StorefrontMedia'
        contact:
          $ref: '#/components/schemas/StoreContact'
        social:
          $ref: '#/components/schemas/SocialLinks'
    TenantRole:
      type: string
      enum:
      - owner
      - admin
      - staff
    AssignableRole:
      type: string
