      operationId: removeCustomerMarketingOptOut
      description: Needs customers.edit. Removes a `merchant` suppression only; a customer-owned (`link`) one → 409 `suppression_customer_owned`
        (P85-5, S118). No suppression → 200 (idempotent). Audited as customer.marketing_opt_out_removed.
      security:
