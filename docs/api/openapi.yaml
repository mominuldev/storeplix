    post:
      tags:
      - themes
      summary: Publish theme draft
      operationId: publishTheme
      description: Owner/admin. Copies draft to published and revalidates the storefront. Idempotent for an unchanged draft.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/StorePath'
      - $ref: '#/components/parameters/ThemeCode'
