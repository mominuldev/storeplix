          params:
            type: object
            required:
            - days
            properties:
              days:
                type: integer
                minimum: 1
                maximum: 365
                default: 30
            additionalProperties: false
          exclude:
            $ref: '#/components/schemas/CampaignAudienceExclude'
        additionalProperties: false
      - type: object
        required:
        - segment
        - params
        - exclude
        properties:
          segment:
            allOf:
            - $ref: '#/components/schemas/CampaignSegment'
            const: one_time
          params:
            type: object
            additionalProperties: false
            maxProperties: 0
