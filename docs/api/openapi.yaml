        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyInput'
      responses:
        '201':
          description: Created; store `plain_key` now, it is never shown again
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/ApiKeyCreated'
        '400':
          $ref: '#/components/responses/TenantRequired'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '402':
          description: '`feature_not_in_plan` (details.upgrade_plan = growth): the plan lacks api_webhooks'
