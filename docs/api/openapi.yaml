        '422':
          $ref: '#/components/responses/ValidationFailed'
    post:
      tags:
      - media
      summary: Upload media
      operationId: uploadMedia
      description: Any role. MIME sniffed from bytes; per-purpose limits in PHASE-2-CONTRACT §1.5. Variants generated asynchronously.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - purpose
              properties:
                file:
                  type: string
                  format: binary
                purpose:
                  $ref: '#/components/schemas/MediaPurpose'
                alt:
                  type: string
                  maxLength: 255
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Media'
