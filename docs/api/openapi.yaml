  /stores/{store}/themes/{code}/draft:
    put:
      tags:
      - themes
      summary: Save theme draft
      operationId: saveThemeDraft
      description: |
        Owner/admin. Replaces the whole draft. Validated against the theme's JSON Schema plus semantic checks
        (unique ids, maxInstances, tenant media, safe hrefs). Errors use dot paths (`config.sections.1.settings.limit`).
        Does not revalidate the storefront. Throttle 120/min.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/StorePath'
      - $ref: '#/components/parameters/ThemeCode'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaveThemeDraftInput'
      responses:
        '200':
          $ref: '#/components/responses/StoreThemeOk'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TenantForbiddenOrRole'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/RevisionConflict'
        '413':
          description: Config larger than 64 KB (code `payload_too_large`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: '`validation_failed` (details keyed by dot path) or `theme_mismatch` (config.theme ≠ {code} or wrong major version)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                error:
                  code: validation_failed
                  message: The given data was invalid.
                  details:
                    config.sections.1.settings.limit:
                    - Must be at most 8.
        '429':
          $ref: '#/components/responses/RateLimited'
