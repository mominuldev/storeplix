          default: BDT
        business_categories:
          type: array
          maxItems: 6
          uniqueItems: true
          items:
            $ref: '#/components/schemas/BusinessCategory'
        name_bn:
          type:
          - string
          - 'null'
          maxLength: 80
        timezone:
          type: string
          default: Asia/Dhaka
    ResetPasswordInput:
      type: object
      required:
