openapi: 3.1.0
info:
  title: Store Plix API
  version: 1.3.0
  description: |
    Phase 1, 1.1 (D1–D4), Phase 2 and Phase 3 (storefront engine) endpoints. Binding sources: docs/development/AGENT-CONTRACTS.md,
    docs/development/PHASE-2-CONTRACT.md and docs/development/PHASE-3-CONTRACT.md. Conventions: docs/api/API-CONVENTIONS.md. Types mirror packages/types/src/index.ts.
    Envelope: success `{data, meta?}`; error `{error:{code,message,details?}}`. IDs are ULIDs. snake_case JSON.
    Merchant routes need Bearer + X-Tenant-Id: missing header → 400 `tenant_required`; not a member → 403 `tenant_forbidden`;
    a resource id of another tenant → 404 `not_found`.
servers:
- url: http://localhost:8000/api/v1
  description: Local
- url: https://api.storeplix.com/api/v1
  description: Production
tags:
- name: system
- name: auth
- name: stores
- name: staff
- name: media
- name: billing
- name: audit
- name: storefront
- name: themes
- name: pages
- name: navigation
paths:
  /health:
    get:
      tags:
      - system
      summary: Get health
      operationId: getHealth
      security: []
      responses:
        '200':
          description: Service is up
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/HealthStatus'
  /auth/register:
    post:
      tags:
      - auth
      summary: Register
      operationId: register
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - email
              - password
              - password_confirmation
              properties:
                name:
                  type: string
                  maxLength: 120
                email:
                  type: string
                  format: email
                  maxLength: 254
                password:
                  type: string
                  minLength: 8
                  maxLength: 128
                password_confirmation:
                  type: string
                phone:
                  type:
                  - string
                  - 'null'
                  maxLength: 20
                  description: E.164 preferred, e.g. +8801712345678
      responses:
        '201':
          description: Registered; token issued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/login:
    post:
      tags:
      - auth
      summary: Login
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '422':
          description: Bad credentials → `validation_failed` with `details.email`; or other validation errors
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/forgot-password:
    post:
      tags:
      - auth
      summary: Forgot password
      operationId: forgotPassword
      security: []
      description: |
        Always returns 202 with the same body whether or not the email exists (no account enumeration).
        Phase 2: sends a reset email (60-min single-use token; Mailpit locally). Rate-limited by the `auth` limiter.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - email
              properties:
                email:
                  type: string
                  format: email
                  maxLength: 254
      responses:
        '202':
          description: Accepted (identical for known and unknown emails)
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/MessageResponse'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/reset-password:
    post:
      tags:
      - auth
      summary: Reset password
      operationId: resetPassword
      description: Consumes a 60-min single-use reset token; revokes all of the user's tokens.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResetPasswordInput'
      responses:
        '200':
          description: Password reset
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/MessageResponse'
        '422':
          description: '`invalid_reset_token` (unknown/expired/used/email mismatch) or `validation_failed`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/logout:
    post:
      tags:
      - auth
      summary: Logout
      operationId: logout
      security:
      - bearerAuth: []
      responses:
        '204':
          description: Current token revoked
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/otp/send:
    post:
      tags:
      - auth
      summary: Send OTP
      operationId: sendOtp
      description: |
        Sends a 6-digit code by SMS (TTL 5 min, resend cooldown 60 s; per-phone and per-IP hourly caps → 429 `otp_rate_limited`).
        `verify_phone` requires Bearer; the phone must be the user's, or replaces it while still unverified (422 otherwise).
        `login` / `reset_password`: identical 202 whether or not the phone is registered (a code is only sent when it is).
      security:
      - {}
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendOtpInput'
      responses:
        '202':
          description: Code sent (or silently not, see above)
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/SendOtpResponse'
        '401':
          description: '`unauthenticated` (purpose verify_phone without Bearer)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          $ref: '#/components/responses/ValidationFailed'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/phone/verify:
    post:
      tags:
      - auth
      summary: Verify phone
      operationId: verifyPhone
      description: Confirms the user's phone with a `verify_phone` code; sets `phone_verified_at`.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyPhoneInput'
      responses:
        '200':
          description: Verified user
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/InvalidOtp'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/login/otp:
    post:
      tags:
      - auth
      summary: Login with OTP
      operationId: loginWithOtp
      description: SMS sign-in with a `login` code. Same response shape as password login; marks the phone verified.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpLoginInput'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthTokenResponse'
        '422':
          $ref: '#/components/responses/InvalidOtp'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/reset-password/otp:
    post:
      tags:
      - auth
      summary: Reset password with OTP
      operationId: resetPasswordWithOtp
      description: Resets the password with a `reset_password` code; revokes all tokens.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OtpResetPasswordInput'
      responses:
        '200':
          description: Password reset
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/MessageResponse'
        '422':
          $ref: '#/components/responses/InvalidOtp'
        '429':
          $ref: '#/components/responses/RateLimited'
  /auth/me:
    get:
      tags:
      - auth
      summary: Me
      operationId: me
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    patch:
      tags:
      - auth
      summary: Update profile
      operationId: updateProfile
      description: Update own profile. Changing `email` requires `current_password`.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileInput'
      responses:
        '200':
          description: User
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /auth/password:
    put:
      tags:
      - auth
      summary: Change password
      operationId: changePassword
      description: Change own password. Returns a NEW token; all other tokens (including the current one) are revoked.
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordInput'
      responses:
        '200':
          $ref: '#/components/responses/AuthTokenOk'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /stores:
    get:
      tags:
      - stores
      summary: List stores
      operationId: listStores
      description: Stores of the current tenant (0 or 1 items; one store per tenant, D1). Any role.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - in: query
        name: page
        schema:
          type: integer
          minimum: 1
      - in: query
        name: per_page
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Stores
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Store'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '400':
          $ref: '#/components/responses/TenantRequired'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TenantForbiddenOrRole'
    post:
      tags:
      - stores
      summary: Create store
      operationId: createStore
      description: Create the tenant's store (owner/admin). Created as `draft` with a platform subdomain. The one-store check
        runs BEFORE validation, so a second request returns 409 even with an empty body.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStoreInput'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Store'
        '400':
          $ref: '#/components/responses/TenantRequired'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TenantForbiddenOrRole'
        '409':
          description: Tenant already has a store (code `store_limit_reached`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /stores/{store}:
    get:
      tags:
      - stores
      summary: Get store
      operationId: getStore
      description: Any role.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - in: path
        name: store
        required: true
        schema:
          $ref: '#/components/schemas/Ulid'
        description: ULID; must belong to the X-Tenant-Id tenant, else 404 `not_found`.
      responses:
        '200':
          description: Store
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/Store'
        '400':
          $ref: '#/components/responses/TenantRequired'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TenantForbiddenOrRole'
        '404':
          $ref: '#/components/responses/NotFound'
  /stores/{store}/settings:
    get:
      tags:
      - stores
      summary: Get store settings
      operationId: getStoreSettings
      description: Any role.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - in: path
        name: store
        required: true
        schema:
          $ref: '#/components/schemas/Ulid'
        description: ULID; must belong to the X-Tenant-Id tenant, else 404 `not_found`.
      responses:
        '200':
          description: Settings
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/StoreSettings'
        '400':
          $ref: '#/components/responses/TenantRequired'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TenantForbiddenOrRole'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - stores
      summary: Update store settings
      operationId: updateStoreSettings
      description: 'Owner/admin. Partial update: only sections/keys present change; null clears a nullable field. Validation
        rules: docs/development/PHASE-2-CONTRACT.md §1.4. Triggers storefront revalidation.'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - in: path
        name: store
        required: true
        schema:
          $ref: '#/components/schemas/Ulid'
        description: ULID; must belong to the X-Tenant-Id tenant, else 404 `not_found`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStoreSettingsInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/StoreSettings'
        '400':
          $ref: '#/components/responses/TenantRequired'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TenantForbiddenOrRole'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`currency_locked` (Phase 5+, store has orders)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /stores/{store}/preview-token:
    post:
      tags:
      - stores
      summary: Create preview token
      operationId: createPreviewToken
      description: |
        Issues a signed preview token (60 min, bound to the store) so the merchant can view a draft store.
        `url` = https://{primary_domain}/?preview={token} (http + :3000 in local env). See STOREFRONT-ENGINE.md §4.1.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - in: path
        name: store
        required: true
        schema:
          $ref: '#/components/schemas/Ulid'
        description: Must belong to the X-Tenant-Id tenant, else 404 `not_found`.
      responses:
        '201':
          description: Preview token issued
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/PreviewToken'
        '400':
          description: Missing X-Tenant-Id (code `tenant_required`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: X-Tenant-Id is not one of the user's memberships (code `tenant_forbidden`), or role not allowed (`forbidden`)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: '`{store}` is not a store of the X-Tenant-Id tenant (code `not_found`)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /staff:
    get:
      tags:
      - staff
      summary: List staff
      operationId: listStaff
      description: Owner/admin. Members (owner first) then pending invitations. Not paginated.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantId'
      responses:
        '200':
          description: Staff
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                - meta
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/StaffMember'
                  meta:
                    $ref: '#/components/schemas/StaffSeatsMeta'
        '400':
          $ref: '#/components/responses/TenantRequired'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TenantForbiddenOrRole'
  /staff/{member}:
    patch:
      tags:
      - staff
      summary: Update staff role
      operationId: updateStaffRole
      description: 'Owner/admin. Assignable roles: admin, staff.'
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - in: path
        name: member
        required: true
        schema:
          $ref: '#/components/schemas/Ulid'
        description: tenant_users.id; another tenant's → 404.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStaffRoleInput'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/StaffMember'
        '400':
          $ref: '#/components/responses/TenantRequired'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          description: '`tenant_forbidden`, `forbidden`, or `cannot_change_own_role`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`last_owner` (target is the owner)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags:
      - staff
      summary: Remove staff
      operationId: removeStaff
      description: Owner/admin; any role may remove itself (leave).
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - in: path
        name: member
        required: true
        schema:
          $ref: '#/components/schemas/Ulid'
        description: tenant_users.id; another tenant's → 404.
      responses:
        '204':
          description: Removed
        '400':
          $ref: '#/components/responses/TenantRequired'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TenantForbiddenOrRole'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`last_owner` (the owner can never be removed)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /staff/invitations:
    post:
      tags:
      - staff
      summary: Invite staff
      operationId: inviteStaff
      description: Owner/admin. Emails a 7-day invite link.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteStaffInput'
      responses:
        '201':
          description: Invitation
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/StaffMember'
        '400':
          $ref: '#/components/responses/TenantRequired'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '402':
          description: '`plan_limit_reached` (details.staff_seats)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          $ref: '#/components/responses/TenantForbiddenOrRole'
        '409':
          description: '`already_member` or `invitation_pending`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          $ref: '#/components/responses/ValidationFailed'
  /staff/invitations/{invitation}:
    delete:
      tags:
      - staff
      summary: Revoke invitation
      operationId: revokeInvitation
      description: Owner/admin.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - in: path
        name: invitation
        required: true
        schema:
          $ref: '#/components/schemas/Ulid'
        description: staff_invitations.id; another tenant's → 404.
      responses:
        '204':
          description: Revoked
        '400':
          $ref: '#/components/responses/TenantRequired'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TenantForbiddenOrRole'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`invitation_not_pending`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /staff/invitations/{invitation}/resend:
    post:
      tags:
      - staff
      summary: Resend invitation
      operationId: resendInvitation
      description: Owner/admin. New token + 7-day expiry; max 1/min per invitation.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - in: path
        name: invitation
        required: true
        schema:
          $ref: '#/components/schemas/Ulid'
        description: staff_invitations.id; another tenant's → 404.
      responses:
        '200':
          description: Invitation
          content:
            application/json:
              schema:
                type: object
                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/StaffMember'
        '400':
          $ref: '#/components/responses/TenantRequired'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/TenantForbiddenOrRole'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`invitation_not_pending`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          $ref: '#/components/responses/RateLimited'
  /invitations/{token}:
    get:
      tags:
      - staff
      summary: Get invitation
