  /internal/domains/allowed:
    get:
      tags:
      - internal
      summary: May a certificate be issued for this host? (Caddy on-demand TLS `ask`)
      operationId: domainAllowed
      description: 'Internal allowlist (PHASE-6 P6-17, roadmap 6.5). Server-to-server only, never exposed through the public Nginx. No tenant header, no session. 200 only for a host whose row is `verified`, `ssl_provisioning` or `active` (custom) or `active` (platform) in a store that is not suspended; every other host (unknown, malformed, pending, failed, expired, suspended) → 404 `domain_not_allowed` with a byte-identical body. The key is a query parameter because Caddy''s `ask` cannot send headers; it is never logged. Throttle `domains-ask` 1 200/min per IP. `Cache-Control: no-store`.'
      security: []
      parameters:
      - in: query
        name: domain
        required: true
        schema:
          type: string
          maxLength: 253
      - in: query
        name: key
        required: true
        schema:
          type: string
        description: DOMAINS_ASK_KEY (constant-time compare; empty server config → always 401)
      responses:
        '200':
          description: Allowed
