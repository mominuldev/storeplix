      type: object
      description: |
        Strict subset of ProseMirror/Tiptap JSON (PHASE-3-CONTRACT §4.4): blocks paragraph, heading (level 2|3),
        bulletList, orderedList, listItem (paragraphs only), blockquote; inline text + hardBreak; marks bold, italic,
        underline, strike, link{href}. Unknown nodes/marks/attrs → 422. Link hrefs: relative, https, http, mailto, tel.
        Never HTML.
      required: [type, content]
      properties:
        type:
          const: doc
        content:
          type: array
          maxItems: 100
          items:
            type: object
            required: [type]
            properties:
              type:
                type: string
                enum: [paragraph, heading, bulletList, orderedList, blockquote]
            additionalProperties: true
    PageBlock:
      type: object
      description: Discriminated by `type` (PHASE-3-CONTRACT §4.5). Unknown keys → 422.
      required: [id, type]
      properties:
        id:
          type: string
          pattern: ^[a-z0-9]{8,16}$
        type:
          type: string
          enum: [heading, rich_text, image, button, callout, table]
        text:
          type: string
          maxLength: 120
        level:
          type: integer
          enum: [2, 3]
        doc:
          $ref: '#/components/schemas/RichTextDoc'
        media_id:
          type: [string, 'null']
        alt:
          type: [string, 'null']
          maxLength: 160
        caption:
          type: [string, 'null']
          maxLength: 200
        label:
          type: string
          maxLength: 40
        href:
          type: string
          maxLength: 2048
        style:
          type: string
          enum: [primary, secondary]
        title:
          type: [string, 'null']
          maxLength: 80
        items:
          type: array
          maxItems: 8
          items:
            type: string
            maxLength: 200
        tone:
          type: string
          enum: [info, success, warning]
        headers:
          type: array
          minItems: 1
          maxItems: 6
          items:
            type: string
            maxLength: 60
        rows:
          type: array
          maxItems: 50
          items:
            type: array
            items:
              type: string
              maxLength: 200
