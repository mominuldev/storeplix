                required:
                - data
                properties:
                  data:
                    $ref: '#/components/schemas/RoleDetail'
        '400':
          $ref: '#/components/responses/TenantRequired'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '402':
          description: '`feature_not_in_plan`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: '`tenant_forbidden`, `forbidden`, `cannot_edit_own_role` or `permission_not_held`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`system_role_locked` or `revision_conflict`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          $ref: '#/components/responses/ValidationFailed'
    delete:
      tags:
      - staff
      summary: Delete custom role
      operationId: deleteRole
      description: Needs staff.manage (custom_roles not required). A role with members or open invitations needs
        `reassign_to`; they move to that role and the role is deleted in one transaction (staff.role_changed per member,
        role.deleted). Same delegation rules as update; reassigning to a custom role needs custom_roles.
        1.11.1 (SEC-L3) — `revision` is required like PATCH; the tenant and both role rows are locked and N2 / N5 are
        re-checked on them; a stale revision → 409 `revision_conflict`.
      security:
      - bearerAuth: []
      parameters:
      - in: query
        name: revision
        required: true
        schema:
          type: integer
          minimum: 1
        description: The role's `revision` as last read (1.11.1).
      - in: query
        name: reassign_to
        required: false
        schema:
          $ref: '#/components/schemas/Ulid'
        description: Role (not the owner role, not this role) that receives the members and open invitations.
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/TenantRequired'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '402':
          description: '`feature_not_in_plan` (reassign_to is a custom role)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: '`tenant_forbidden`, `forbidden`, `cannot_edit_own_role` or `permission_not_held`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`system_role_locked`, `revision_conflict` (stale `revision`, 1.11.1), or `role_in_use` without
            reassign_to (details.members, details.invitations = ids)'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          $ref: '#/components/responses/ValidationFailed'
