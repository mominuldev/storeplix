      operationId: discardThemeDraft
      description: Owner/admin. Resets the draft to the published config (draft_revision + 1). No revalidation.
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/TenantId'
      - $ref: '#/components/parameters/StorePath'
      - $ref: '#/components/parameters/ThemeCode'
      responses:
