      parameters:
      - in: query
        name: paymentID
        required: false
        schema:
          type: string
      - in: query
        name: status
        required: false
        schema:
          type: string
      responses:
        '200':
          description: HTML "Thank you" page (the store has no primary domain to redirect to)
          content:
            text/html:
              schema:
                type: string
        '303':
          description: Redirect to https://{primary_host}/checkout/payment-result?payment={id} (`/pay/result?payment=` for link payments; test payments go to the merchant app `/settings/payments?test_payment={id}`).
          headers:
            Location:
              schema:
                type: string
                format: uri
        '403':
          description: Bad signature (HTML page)
        '404':
          description: Unknown payment (HTML page)
