name: E2E (manual)

# Not part of required CI until the full stack boots reliably in Actions.
on:
  workflow_dispatch:
    inputs:
      visual:
        description: 'Also take the Figma visual-pass screenshots (E2E_VISUAL)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Boot stack
        run: |
          cp infrastructure/docker/.env.example .env
          # The e2e suite makes ~15 bulk calls per run on the demo tenant (merchant-bulk = 10/h by default).
          echo 'THROTTLE_MERCHANT_BULK_PER_HOUR=1000' >> .env
          # Phase 5b fake drivers (PHASE-5B-CONTRACT §13 QA, §17.7): no real gateway or courier is ever called from CI.
          # The fake hosted page lives on the API (PUBLIC_API_URL); documents are stored as HTML (no PDF assertions).
          {
            echo 'PAYMENTS_FAKE=true'
            echo 'COURIERS_FAKE=true'
            echo "INTEGRATION_CREDENTIALS_KEY=base64:$(openssl rand -base64 32)"
            echo 'PUBLIC_API_URL=http://localhost:8010'
            echo 'DOCUMENTS_DRIVER=html'
            # Phase 6 (PHASE-6-CONTRACT §11, §12.1): fake DNS + fake Cloudflare for SaaS, `*.localhost` custom hosts,
            # /api/v1/dev/domains/*. CI never calls Cloudflare or a public DoH resolver.
            echo 'DOMAINS_FAKE=true'
            echo 'DOMAINS_ASK_KEY=ci-domains-ask-key-0b7d4e19a3c2'
            # Phase 7 (PHASE-7-CONTRACT §11 QA, §12): fake platform billing gateway + /api/v1/dev/billing/clock.
            # CI never calls bKash or SSLCommerz; the sandbox certification spec (§13) is manual-only, never here.
            echo 'BILLING_FAKE=true'
            # Phase 8.4 (PHASE-8-4-CONTRACT §4.3, §10 QA): outbound webhooks never leave CI. The fake driver records
            # each request in the dev sink (GET /api/v1/dev/webhook-sink) and answers by path suffix (/fail-503 → 503).
            echo 'WEBHOOKS_OUT_FAKE=true'
            # Phase 8.5 (PHASE-8-5-CONTRACT §5.4, §11 QA): campaign SMS/email never leave CI. SMS through the `log`
            # driver, email through the `log` campaigns mailer; the dev sink (GET /api/v1/dev/stores/{store}/message-sink)
            # keeps the rendered copies (text, subject, unsubscribe URL) that phase8-5.* reads.
            echo 'SMS_DRIVER=log'
            echo 'CAMPAIGN_MAILER=log'
            echo 'CAMPAIGNS_DEV_SINK=true'
            # Phase 8.6 (PHASE-8-6-CONTRACT §13 QA): automation messages reuse the same three flags (no new provider); the
            # sink entries carry `automation_id`, which phase8-6.* reads. Nothing new to set here.
            # Phase 8.7 (PHASE-8-7-CONTRACT §13 QA): no new provider or flag. Receipts go to the private disk
            # (storeplix.private_disk, default `local`); image receipts are re-encoded by ProcessMedia on `media` and
            # recurring expenses are generated on `default`, both worked by compose's `queue` service. phase8-7.* runs
            # `expenses:repeat` through `docker compose exec api php artisan tinker` (E2E_ARTISAN=docker).
            # Phase 8.8a (PHASE-8-8-CONTRACT §13 QA): no new provider or flag. CheckOrderRisk runs on `default` (compose's
            # `queue` service); advance links pay on the fake gateway (PAYMENTS_FAKE), bookings on FakeCourier
            # (COURIERS_FAKE); the checkout OTP SMS goes through SMS_DRIVER=log and phase8-8.* reads the code from the
            # dev sink (CAMPAIGNS_DEV_SINK) or, failing that, from the API log through tinker. Every older spec turns the
            # guard off on its throwaway shop (support/commerce.ts setupShop), so their checkouts are unchanged.
          } >> .env
          cp apps/api/.env.example apps/api/.env
          # The api/queue containers read apps/api/.env; set the flag there too in case compose doesn't forward it.
          echo 'WEBHOOKS_OUT_FAKE=true' >> apps/api/.env
          printf '%s\n' 'SMS_DRIVER=log' 'CAMPAIGN_MAILER=log' 'CAMPAIGNS_DEV_SINK=true' >> apps/api/.env
          # Amendment A1 (PHASE-8-1-AMENDMENT-ADMIN-2FA A1-7): compose runs the API with APP_ENV=local, whose default for
          # staff two-step sign-in is now OFF. Force it ON so phase8.admin-auth (password → TOTP) stays valid;
          # phase8.admin-2fa-setting covers the off path by changing the stored setting through the admin API (the stored
          # value wins over this env default). compose loads apps/api/.env as env_file and doesn't set the key itself.
          echo 'ADMIN_TWO_FACTOR_REQUIRED=true' >> apps/api/.env
          docker compose up -d --build --wait
          docker compose exec -T api php artisan key:generate --force
          docker compose exec -T api php artisan migrate --seed --force --database=pgsql_owner
          # Phase 8.4: DeliverWebhook runs on the `webhooks-out` queue (§4.3). Start a worker for it unless compose
          # already defines one, so phase8-4.* deliveries are processed.
          if ! docker compose config --services | grep -qx 'queue-webhooks-out'; then
            docker compose exec -d -T api php artisan queue:work redis --queue=webhooks-out --sleep=1
          fi
          # Phase 8.5: StartCampaign / SendCampaignBatch run on the `campaigns` queue (§5.1, P85-12). Same fallback.
          if ! docker compose config --services | grep -qx 'queue-campaigns'; then
            docker compose exec -d -T api php artisan queue:work redis --queue=campaigns --sleep=1
          fi
          # Phase 8.6: EvaluateAutomation / step jobs run on the `automations` queue (P86-23, $timeout <= 240 s, message
          # steps never retried). Same fallback; compose defines `queue-automations`.
          if ! docker compose config --services | grep -qx 'queue-automations'; then
            docker compose exec -d -T api php artisan queue:work redis --queue=automations --tries=1 --timeout=250 --sleep=1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install Playwright
        working-directory: tests/e2e
        run: npm install --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Run smoke + flows
        working-directory: tests/e2e
        env:
          # compose sends mail to Mailpit; throwaway users are deleted via `docker compose exec api`.
          MAILPIT_URL: http://localhost:8025
          E2E_ARTISAN: docker
          # Phase 5 specs call the storefront API server-to-server; inside compose the API gets the
          # compose-level key (infrastructure/docker/.env.example), not the one in apps/api/.env.
          STOREFRONT_API_KEY: dev-storefront-key-change-me
          # 5b-2 specs open the fake gateway page on the API origin and check the payment-result pages.
          PAYMENTS_FAKE: 'true'
          # 5b-3 specs book on FakeCourier and move parcels with the testing-only fake-advance endpoint.
          COURIERS_FAKE: 'true'
          # Phase 6 phase6.domains: drives the fake DNS/provider via /api/v1/dev/domains/* and calls the `ask` endpoint
          # with this key (must equal the compose value above).
          DOMAINS_FAKE: 'true'
          DOMAINS_ASK_KEY: ci-domains-ask-key-0b7d4e19a3c2
          # Phase 7 phase7.* specs: fake platform gateway page + dev billing clock (must equal the compose value above).
          BILLING_FAKE: 'true'
          # Phase 8.4 phase8-4.* specs read the fake webhook sink and verify X-Storeplix-Signature (P84-8).
          WEBHOOKS_OUT_FAKE: 'true'
          # Phase 8.5 phase8-5.* specs read the campaign dev sink (must match the compose values above).
          CAMPAIGNS_DEV_SINK: 'true'
          # Phase 8.6 phase8-6.* specs use the same sink (automation messages, `automation_id`) with SMS_DRIVER=log and
          # CAMPAIGN_MAILER=log on the API side (compose values above).
          SMS_DRIVER: log
          CAMPAIGN_MAILER: log
          # Amendment A1: same value as the API (apps/api/.env above); tinker()/artisan calls inherit it.
          ADMIN_TWO_FACTOR_REQUIRED: 'true'
          E2E_VISUAL: ${{ inputs.visual && '1' || '' }}
        run: npx playwright test
      - if: failure()
        run: docker compose logs --no-color > compose.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: |
            tests/e2e/playwright-report
            tests/e2e/test-results
            compose.log
          if-no-files-found: ignore
