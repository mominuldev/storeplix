name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Sentinel used to prove the storefront secret never reaches client bundles.
  STOREFRONT_API_KEY: ci-sentinel-storefront-key-3f9a1c7e
  REVALIDATE_SECRET: ci-sentinel-revalidate-9d2b
  REVESMS_API_KEY: ci-sentinel-reve-api-7a1
  REVESMS_SECRET_KEY: ci-sentinel-reve-secret-5c2
  PLATFORM_DOMAIN: storeplix.test

jobs:
  # Path filtering is done in-job (not with `on.paths`) so required checks always report.
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      themes: ${{ steps.filter.outputs.themes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'infrastructure/docker/postgres/**'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/merchant-dashboard/**'
              - 'apps/super-admin/**'
              - 'apps/storefront/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
            # Phase 3: theme schema source of truth + its Laravel copy (PHASE-3-CONTRACT §4.1, P3-5).
            themes:
              - 'packages/themes/**'
              - 'apps/api/resources/themes/**'
              - 'apps/api/app/Domain/Themes/**'
              - 'apps/storefront/themes/**'
              - '.github/workflows/ci.yml'

  # Runs when either side of the theme schema changes, so a packages/themes-only change can't skip the
  # PHP parity/sync checks (the `api` job is filtered on apps/api/** only).
  themes:
    name: 'themes (schema parity - AJV, PHP opis, sync)'
    needs: changes
    if: needs.changes.outputs.themes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Byte-identical copy check that can never be skipped (ThemeSchemaSyncTest skips when
      # packages/themes is absent; here it is always present).
      - name: resources/themes mirrors packages/themes
        run: |
          for e in registry.json fonts.json modern-commerce fixtures; do
            diff -r "packages/themes/$e" "apps/api/resources/themes/$e"
          done
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: packages/themes (AJV fixture parity)
        run: pnpm --filter @storeplix/themes test
      - name: storefront Zod parity (valid fixtures resolve, invalid never throw)
        run: pnpm --filter @storeplix/storefront exec vitest run tests/theme.test.ts
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, bcmath, zip
          coverage: none
          tools: composer:v2
      - name: Composer install
        working-directory: apps/api
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP ThemeSchemaSyncTest + fixture parity + upgrader
        working-directory: apps/api
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test tests/Feature/Themes tests/Unit/SafeHrefTest.php

  api:
    name: api (lint + tests, sqlite)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, pdo_pgsql, redis, bcmath, zip
          coverage: none
          tools: composer:v2

      - name: Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint (code style)
        run: vendor/bin/pint --test

      - name: Test suite
        run: php artisan test

      # REQUIRED GATE. Tests must be tagged #[Group('tenancy')] (see docs/development/TESTING.md).
      # Fails if the group is empty so the gate can't silently pass.
      - name: tenant-isolation
        run: |
          mkdir -p build
          php artisan test --group=tenancy --log-junit build/tenancy.xml
          count=$(grep -o 'tests="[0-9]*"' build/tenancy.xml | head -1 | grep -o '[0-9]*' || echo 0)
          echo "tenancy tests executed: ${count}"
          if [ "${count:-0}" -lt 1 ]; then
            echo "::error::No tests in group 'tenancy' — tenant isolation is not being verified"
            exit 1
          fi

      - name: security
        run: php artisan test --group=security

      # Phase 6 (PHASE-6-CONTRACT §10, §12.2): the `domains` group must exist and pass on sqlite, and the committed
      # Public Suffix List snapshot must be present (HostnameInput never downloads it at runtime or in CI).
      - name: domains group + PSL snapshot
        run: |
          psl=resources/data/public_suffix_list.dat
          [ -s "$psl" ] || { echo "::error::$psl missing (php artisan domains:update-psl, then commit it)"; exit 1; }
          grep -q '===BEGIN ICANN DOMAINS===' "$psl" || { echo "::error::$psl is not a Public Suffix List"; exit 1; }
          grep -q '===BEGIN PRIVATE DOMAINS===' "$psl" || { echo "::error::$psl lacks the private section (P6-4)"; exit 1; }
          mkdir -p build
          php artisan test --group=domains --log-junit build/domains.xml
          ran=$(grep -o 'tests="[0-9]*"' build/domains.xml | head -1 | grep -o '[0-9]*' || echo 0)
          echo "domains tests executed: ${ran}"
          [ "${ran:-0}" -ge 1 ] || { echo "::error::no tests in group 'domains'"; exit 1; }

      # Phase 7 (PHASE-7-CONTRACT §11): the `billing`, `plans` and `reports` groups must exist and pass on sqlite.
      - name: phase 7 groups (billing, plans, reports)
        run: |
          mkdir -p build
          fail=0
          for g in billing plans reports; do
            php artisan test --group="$g" --exclude-group perf --exclude-group race --log-junit "build/${g}.xml" || fail=1
            ran=$(grep -o 'tests="[0-9]*"' "build/${g}.xml" | head -1 | grep -o '[0-9]*' || echo 0)
            echo "${g} tests executed: ${ran}"
            [ "${ran:-0}" -ge 1 ] || { echo "::error::no tests in group '${g}'"; fail=1; }
          done
          exit $fail

      # Phase 8.1 (PHASE-8-1-CONTRACT §10): the `admin` and `impersonation` groups must exist and pass on sqlite.
      - name: phase 8.1 groups (admin, impersonation)
        run: |
          mkdir -p build
          fail=0
          for g in admin impersonation; do
            php artisan test --group="$g" --exclude-group perf --exclude-group race --log-junit "build/${g}.xml" || fail=1
            ran=$(grep -o 'tests="[0-9]*"' "build/${g}.xml" | head -1 | grep -o '[0-9]*' || echo 0)
            echo "${g} tests executed: ${ran}"
            [ "${ran:-0}" -ge 1 ] || { echo "::error::no tests in group '${g}'"; fail=1; }
          done
          exit $fail

      # Phase 8.2 (PHASE-8-2-CONTRACT §10, §14.1): the `analytics` group (§3 definitions fixture to the paisa,
      # aggregate/backfill idempotency, /admin/analytics/* shapes) must exist and pass on sqlite.
      - name: phase 8.2 group (analytics)
        run: |
          mkdir -p build
          php artisan test --group=analytics --exclude-group perf --exclude-group race --log-junit build/analytics.xml; status=$?
          ran=$(grep -o 'tests="[0-9]*"' build/analytics.xml | head -1 | grep -o '[0-9]*' || echo 0)
          echo "analytics tests executed: ${ran}"
          [ "${ran:-0}" -ge 1 ] || { echo "::error::no tests in group 'analytics'"; exit 1; }
          exit $status

      # Phase 8.3 (PHASE-8-3-CONTRACT §10, §13.6): the `roles` group (parity fixture for owner/admin/staff on every
      # merchant route, route→permission map, catalogue, roles API, N1–N9) must exist and pass on sqlite.
      - name: phase 8.3 group (roles)
        run: |
          mkdir -p build
          php artisan test --group=roles --exclude-group perf --exclude-group race --log-junit build/roles.xml; status=$?
          ran=$(grep -o 'tests="[0-9]*"' build/roles.xml | head -1 | grep -o '[0-9]*' || echo 0)
          echo "roles tests executed: ${ran}"
          [ "${ran:-0}" -ge 1 ] || { echo "::error::no tests in group 'roles'"; exit 1; }
          exit $status

      # Phase 8.4 (PHASE-8-4-CONTRACT §10, §13.6): the `developer-api` group (API keys CRUD + non-delegation, external API
      # scopes/isolation/rate limit, outbound webhooks: emission per event, HMAC signature vector, retry schedule with a
      # frozen clock, auto-disable, prune, resend, SSRF refusals, fake-driver production guard) must exist and pass on sqlite.
      - name: phase 8.4 group (developer-api)
        run: |
          mkdir -p build
          php artisan test --group=developer-api --exclude-group perf --exclude-group race --log-junit build/developer-api.xml; status=$?
          ran=$(grep -o 'tests="[0-9]*"' build/developer-api.xml | head -1 | grep -o '[0-9]*' || echo 0)
          echo "developer-api tests executed: ${ran}"
          [ "${ran:-0}" -ge 1 ] || { echo "::error::no tests in group 'developer-api'"; exit 1; }
          exit $status

      # Phase 8.5 (PHASE-8-5-CONTRACT §10, §11, §14.4): the `campaigns` group (campaign CRUD/state machine, audience
      # segments + P85-3 eligibility matrix, SMS parts against docs/api/sms-parts-vectors.json, renderer, send pipeline
      # with the fake gateway + array mailer, quiet hours, at-most-once, attribution, overview, allowances, storefront
      # unsubscribe, S113–S126) must exist and pass on sqlite.
      - name: phase 8.5 group (campaigns)
        run: |
          mkdir -p build
          php artisan test --group=campaigns --exclude-group perf --exclude-group race --log-junit build/campaigns.xml; status=$?
          ran=$(grep -o 'tests="[0-9]*"' build/campaigns.xml | head -1 | grep -o '[0-9]*' || echo 0)
          echo "campaigns tests executed: ${ran}"
          [ "${ran:-0}" -ge 1 ] || { echo "::error::no tests in group 'campaigns'"; exit 1; }
          exit $status

      # Phase 8.6 (PHASE-8-6-CONTRACT §13, §16 AC 5): the `automations` group (every §9.1 route: happy, validation, authz,
      # isolation; each recipe trigger → run → steps → outcomes with the fake gateway + array mailer; conditions matrix;
      # dedupe; waits + resume-due; quiet hours; frequency cap; allowance shared with campaigns; exit on order; attribution;
      # cart contact + detect-abandoned; recovery-link clone; automation unsubscribe codes; dry run; test message;
      # reap-stuck; prune; plan downgrade; S127–S140) must exist and pass on sqlite.
      - name: phase 8.6 group (automations)
        run: |
          mkdir -p build
          php artisan test --group=automations --exclude-group perf --exclude-group race --log-junit build/automations.xml; status=$?
          ran=$(grep -o 'tests="[0-9]*"' build/automations.xml | head -1 | grep -o '[0-9]*' || echo 0)
          echo "automations tests executed: ${ran}"
          [ "${ran:-0}" -ge 1 ] || { echo "::error::no tests in group 'automations'"; exit 1; }
          exit $status

      # Phase 8.7 (PHASE-8-7-CONTRACT §13, §16 AC 8): the `expenses` group (every §8.1 route: happy, validation, authz,
      # isolation; summary maths + compare rule + profit gate matrix; recurrence generator (start, copy-latest, stop,
      # clamping, catch-up, idempotency); receipts (upload/sniff matrix, attach/replace/remove, signed link, download
      # headers, media-library separation, prune); CSV export + formula injection; Profit & loss with expenses and the
      # expenses_rev cache token; store currency lock (S153); S141–S153) must exist and pass on sqlite.
      - name: phase 8.7 group (expenses)
        run: |
          mkdir -p build
          php artisan test --group=expenses --exclude-group perf --exclude-group race --log-junit build/expenses.xml; status=$?
          ran=$(grep -o 'tests="[0-9]*"' build/expenses.xml | head -1 | grep -o '[0-9]*' || echo 0)
          echo "expenses tests executed: ${ran}"
          [ "${ran:-0}" -ge 1 ] || { echo "::error::no tests in group 'expenses'"; exit 1; }
          exit $status

      # Phase 8.8a (PHASE-8-8-CONTRACT §12, §13, §16 AC 7): the `fraud` group (every §8.1 route: happy, validation, authz,
      # isolation; P88-4 tier vectors + SQL/PHP parity; decision matrix (duplicate, risky × hold on/off, careful × advance
      # on/off × gateway); hold enforcement on every confirm/booking/external path (S156); check idempotency + stale
      # `checking` sweep; advance paid/expired; blocklist + repeat-returner auto block; storefront OTP + checkout errors
      # (cod_unavailable, order_limit_reached, otp_required, otp_invalid, fail-open); Free plan; S154–S166) must exist and
      # pass on sqlite.
      - name: phase 8.8a group (fraud)
        run: |
          mkdir -p build
          php artisan test --group=fraud --exclude-group perf --exclude-group race --log-junit build/fraud.xml; status=$?
          ran=$(grep -o 'tests="[0-9]*"' build/fraud.xml | head -1 | grep -o '[0-9]*' || echo 0)
          echo "fraud tests executed: ${ran}"
          [ "${ran:-0}" -ge 1 ] || { echo "::error::no tests in group 'fraud'"; exit 1; }
          exit $status

      # Phase 8.8b (PHASE-8-8B-CONTRACT §12, §13, §16 AC 6): the `purchasing` group (every §8.1 route: happy, validation,
      # authz, isolation; PO state machine matrix; receipts incl. partial, damaged, over-receive, idempotency; weighted-
      # average + landed-cost vectors (null old cost, on_hand <= 0, rounding, remainder to the largest line); payments,
      # owed/overdue/due-this-week; summaries; reorder suggestions; quick purchase; PO PDF (fake driver); supplier CSV
      # import; invoice uploads; CustomerRisk alias removal; no purchase reaches expenses/P&L; S167–S178) must exist and
      # pass on sqlite. Concurrency (`race`) runs on Postgres only.
      - name: phase 8.8b group (purchasing)
        run: |
          mkdir -p build
          php artisan test --group=purchasing --exclude-group perf --exclude-group race --log-junit build/purchasing.xml; status=$?
          ran=$(grep -o 'tests="[0-9]*"' build/purchasing.xml | head -1 | grep -o '[0-9]*' || echo 0)
          echo "purchasing tests executed: ${ran}"
          [ "${ran:-0}" -ge 1 ] || { echo "::error::no tests in group 'purchasing'"; exit 1; }
          exit $status

      # Phase 8.8c part A (PHASE-8-8C-CONTRACT §12 S179–S186, §13, §16 AC 1–3, 6): the `locations` group (every §9 part-A
      # route: happy, validation, authz, isolation; backfill migration test (S182); reader parity matrix + the static
      # 1:1 `join('inventories'` guard (S185); online-location change matrix: cancel/ship/return after make-default hit
      # the stored row (S184); weighted average across locations (S186); `multi_warehouse` gate + downgrade (S181);
      # external inventory shape; `stock.low` per location) must exist and pass on sqlite. Concurrency (`race`) runs on
      # Postgres only.
      - name: phase 8.8c-A group (locations)
        run: |
          mkdir -p build
          php artisan test --group=locations --exclude-group perf --exclude-group race --log-junit build/locations.xml; status=$?
          ran=$(grep -o 'tests="[0-9]*"' build/locations.xml | head -1 | grep -o '[0-9]*' || echo 0)
          echo "locations tests executed: ${ran}"
          [ "${ran:-0}" -ge 1 ] || { echo "::error::no tests in group 'locations'"; exit 1; }
          exit $status

      # Phase 8.8c part B (PHASE-8-8C-CONTRACT §12 S187–S194, §13, §16 AC 4–6): the `stocktransfer` group (every §9 part-B
      # route: happy, validation, authz, isolation incl. cross-tenant/cross-store 404 for transfers, lines, counts and
      # count lines (S187); transfer state machine, short units written off, cancel in transit returns the sent units once
      # (S188); idempotent send/receive/finish (S189); count delta-at-count vectors, keep vs zero uncounted (S190); values
      # hidden without costs.view (S191); `multi_warehouse` on transfer create/send, receive/cancel after a downgrade
      # (S192); scan input rules (S193); audit (S194)) must exist and pass on sqlite. Concurrency (`race`) runs on
      # Postgres only.
      - name: phase 8.8c-B group (stocktransfer)
        run: |
          mkdir -p build
          php artisan test --group=stocktransfer --exclude-group perf --exclude-group race --log-junit build/stocktransfer.xml; status=$?
          ran=$(grep -o 'tests="[0-9]*"' build/stocktransfer.xml | head -1 | grep -o '[0-9]*' || echo 0)
          echo "stocktransfer tests executed: ${ran}"
          [ "${ran:-0}" -ge 1 ] || { echo "::error::no tests in group 'stocktransfer'"; exit 1; }
          exit $status

      # Phase 8.8d part A (PHASE-8-8D-CONTRACT §13 S195–S205, §14, §16 AC 1–6): the `pos` group (every §10 part-A route:
      # happy, validation, authz, isolation incl. cross-tenant/cross-store 404 and foreign body ids 422 (S195); O/A/S/C
      # matrix, impersonation read-only (S196); plan `pos` on every write, close after a downgrade (S197); server prices,
      # 409 checkout_changed (S198); stock only at the register location via InventoryService::sell, ledger pos_sale
      # (S199); idempotent open/close/sale (S200); cash maths, tolerance and note rule (S201); session binding (S202);
      # exact phone lookup (S203); SMS receipt (S204); readers matrix with a walk-in till sale (S205)) must exist and pass
      # on sqlite. Concurrency (`race`) runs on Postgres only.
      - name: phase 8.8d-A group (pos)
        run: |
          mkdir -p build
          php artisan test --group=pos --exclude-group perf --exclude-group race --log-junit build/pos.xml; status=$?
          ran=$(grep -o 'tests="[0-9]*"' build/pos.xml | head -1 | grep -o '[0-9]*' || echo 0)
          echo "pos tests executed: ${ran}"
          [ "${ran:-0}" -ge 1 ] || { echo "::error::no tests in group 'pos'"; exit 1; }
          exit $status

      # Phase 8.9a (PHASE-8-9A-CONTRACT §11.2 S208–S219, §15, §17 AC 8): the `sms` group (every §10 route: happy, validation,
      # authz matrix O/A/S/C, impersonation read-only, isolation incl. cross-tenant/cross-store 404 (S208, S210); log rows of
      # this store only, never `otp_*` / null-tenant rows, masked phones (S209, S217); SmsCharger allowance → credits → skip
      # vectors, 0 allowance never uses credits, unlimited never touches them, consume/refund once (S211); credits only from
      # a verified platform payment, once per invoice, SMS invoices never touch the subscription (S212); admin adjust (S213);
      # template rules and byte-for-byte defaults (S214); sender ID rules, document privacy, admin review (S215, S216); test
      # SMS (S218); limiters (S219); static gateway allow-list) must exist and pass on sqlite. Concurrency (`race`) runs on
      # Postgres only.
      - name: phase 8.9a group (sms)
        run: |
          mkdir -p build
          php artisan test --group=sms --exclude-group perf --exclude-group race --log-junit build/sms.xml; status=$?
          ran=$(grep -o 'tests="[0-9]*"' build/sms.xml | head -1 | grep -o '[0-9]*' || echo 0)
          echo "sms tests executed: ${ran}"
          [ "${ran:-0}" -ge 1 ] || { echo "::error::no tests in group 'sms'"; exit 1; }
          exit $status

      # Phase 8.9b (PHASE-8-9B-CONTRACT §14, S220–S233, §17 AC 9): the `platform-sms` group (every §9 route: happy,
      # validation, 403 matrix per platform role + merchant token; env bootstrap byte for byte; SMS_DRIVER=fake never
      # routes to a DB provider; credential secrecy (S220); typed confirm, test-required, rotate test-then-swap, remove
      # (S222, S223); router vectors, breaker, retry windows (S225); SSRF (S224); §5 senders; templates (S226, S227);
      # broadcasts: hours, typed count, cap, opt-out, pause/resume (S228); opt-out codes (S229); platform log + CSV
      # (S230); fakes refuse production (S231); limiters (S232)) must exist and pass on sqlite. RLS grants (S233) and
      # the races run on Postgres only.
      - name: phase 8.9b group (platform-sms)
        run: |
          mkdir -p build
          php artisan test --group=platform-sms --exclude-group perf --exclude-group race --log-junit build/platform-sms.xml; status=$?
          ran=$(grep -o 'tests="[0-9]*"' build/platform-sms.xml | head -1 | grep -o '[0-9]*' || echo 0)
          echo "platform-sms tests executed: ${ran}"
          [ "${ran:-0}" -ge 1 ] || { echo "::error::no tests in group 'platform-sms'"; exit 1; }
          exit $status

      # Amendment A1 (PHASE-8-1-AMENDMENT-ADMIN-2FA §2, Q231): the `admin-settings` group (env default local off / testing
      # on / ADMIN_TWO_FACTOR_REQUIRED override, stored value wins, login `signed_in` path with session + audit, required
      # path unchanged, GET/PATCH /admin/settings/security authz (support, read_only, merchant → 403/401), wrong password
      # 422 `invalid_password`, audit + `risk: high`, cache bust) must exist and pass on sqlite.
      - name: amendment A1 group (admin-settings)
        run: |
          mkdir -p build
          php artisan test --group=admin-settings --exclude-group perf --exclude-group race --log-junit build/admin-settings.xml; status=$?
          ran=$(grep -o 'tests="[0-9]*"' build/admin-settings.xml | head -1 | grep -o '[0-9]*' || echo 0)
          echo "admin-settings tests executed: ${ran}"
          [ "${ran:-0}" -ge 1 ] || { echo "::error::no tests in group 'admin-settings'"; exit 1; }
          exit $status

  api-postgres:
    name: api (migrations + tenancy on postgres)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: storeplix_test
          POSTGRES_USER: storeplix
          POSTGRES_PASSWORD: storeplix
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U storeplix"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: storeplix_test
      DB_USERNAME: storeplix
      DB_PASSWORD: storeplix
      REDIS_HOST: 127.0.0.1
      CACHE_STORE: redis
      QUEUE_CONNECTION: sync
      # The seeder publishes the demo store; with a sync queue the revalidation job would call a storefront
      # that isn't running here. Empty URL = the job skips (RevalidateStorefront: "not_configured").
      STOREFRONT_REVALIDATE_URL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_pgsql, redis, bcmath, zip, pcntl, posix
          coverage: none
          tools: composer:v2
      - name: Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare env
        run: |
          cp .env.example .env
          php artisan key:generate
      # Phase 5b-1: the RLS policy migration grants to storeplix_app/storeplix_admin, so the roles must exist
      # (PHASE-5B-CONTRACT §2.1). This job still connects as the superuser (RLS bypassed, app-level isolation).
      - name: Create RLS roles (01-roles.sql)
        run: |
          docker exec -i ${{ job.services.postgres.id }} \
            psql -v ON_ERROR_STOP=1 -U storeplix -d "$DB_DATABASE" \
              -v owner_pw=ci-owner -v app_pw=ci-app -v admin_pw=ci-admin \
            < "$GITHUB_WORKSPACE/infrastructure/docker/postgres/initdb/01-roles.sql"
      - name: Migrate fresh + seed
        run: php artisan migrate:fresh --seed --force
      - name: Rollback is reversible
        run: php artisan migrate:rollback --force && php artisan migrate --force
      # phpunit.xml may force sqlite; override so the tenancy group also runs against real Postgres.
      - name: tenant-isolation (postgres)
        run: php artisan test --group=tenancy
        env:
          DB_CONNECTION: pgsql
          DB_DATABASE: storeplix_test
      # Phase 4: advisory locks (plan-limit race), partial/expression unique indexes and FOR UPDATE only
      # behave for real on Postgres.
      # Phase 5a: the fork-based race tests (S2, S3, S4, S17 + Phase 4 A8/A16) COMMIT their data
      # (RefreshDatabase can't roll back what forked children wrote), so they run isolated in the
      # `api-perf` job, each group in its own process. Here they are excluded so their committed rows
      # can't leak into later security tests with global counts (QA phase-5a F-M2).
      - name: security (postgres)
        run: php artisan test --group=security --exclude-group perf --exclude-group race
        env:
          DB_CONNECTION: pgsql
          DB_DATABASE: storeplix_test
          # Per-test in-memory cache, as locally: the job's Redis cache is never reset between tests, so
          # rate-limit counters piled up and later tests got 429. The race tests (shared Redis) run in api-perf.
          CACHE_STORE: array
      # Phase 6: partial unique primary, CHECK constraints, timestamptz conversion only behave for real on Postgres.
      - name: domains (postgres)
        run: php artisan test --group=domains --exclude-group perf --exclude-group race
        env:
          DB_CONNECTION: pgsql
          DB_DATABASE: storeplix_test
          CACHE_STORE: array
      # Phase 7: timestamptz conversion, partial unique open invoice, gapless invoice counter, CHECK constraints.
      - name: phase 7 groups (postgres)
        run: php artisan test --group=billing --group=plans --group=reports --exclude-group perf --exclude-group race
        env:
          DB_CONNECTION: pgsql
          DB_DATABASE: storeplix_test
          CACHE_STORE: array
      - name: phase 8.1 groups (postgres)
        run: php artisan test --group=admin --group=impersonation --exclude-group perf --exclude-group race
        env:
          DB_CONNECTION: pgsql
          DB_DATABASE: storeplix_test
          CACHE_STORE: array
      # Phase 8.2: the §10 fixtures must match to the paisa on Postgres too (ON CONFLICT upserts, jsonb columns,
      # Dhaka day boundaries on timestamptz, CHECK partition identities).
      - name: phase 8.2 analytics (postgres)
        run: php artisan test --group=analytics --exclude-group perf --exclude-group race
        env:
          DB_CONNECTION: pgsql
          DB_DATABASE: storeplix_test
          CACHE_STORE: array
      # Phase 8.3 (§13.2): the permission-parity fixture must give identical codes on Postgres too.
      - name: phase 8.3 roles (postgres)
        run: php artisan test --group=roles --exclude-group perf --exclude-group race
        env:
          DB_CONNECTION: pgsql
          DB_DATABASE: storeplix_test
          CACHE_STORE: array
      # Phase 8.4 (§13.6): api_keys / webhook_* jsonb columns, the actor CHECK migration (000300) and the
      # sp_api_key_owner() definer function exist on Postgres; developer-api must pass there too.
      - name: phase 8.4 developer-api (postgres)
        run: php artisan test --group=developer-api --exclude-group perf --exclude-group race
        env:
          DB_CONNECTION: pgsql
          DB_DATABASE: storeplix_test
          CACHE_STORE: array
      # Phase 8.5 (§7): campaigns / campaign_recipients / campaign_conversions / marketing_suppressions (jsonb audience,
      # CHECKs, composite FKs) and the plans.limits backfill (000300) exist on Postgres; campaigns must pass there too.
      - name: phase 8.5 campaigns (postgres)
        run: php artisan test --group=campaigns --exclude-group perf --exclude-group race
        env:
          DB_CONNECTION: pgsql
          DB_DATABASE: storeplix_test
          CACHE_STORE: array
      # Phase 8.6 (§4.4): automations / automation_runs / automation_run_steps / automation_conversions (jsonb settings,
      # CHECKs, composite FKs, partial indexes, ON CONFLICT DO NOTHING run dedupe) and the carts contact columns (000200)
      # exist on Postgres; automations must pass there too.
      - name: phase 8.6 automations (postgres)
        run: php artisan test --group=automations --exclude-group perf --exclude-group race
        env:
          DB_CONNECTION: pgsql
          DB_DATABASE: storeplix_test
          CACHE_STORE: array
      # Phase 8.7 (§4): expenses / expense_recurrences (CHECKs, composite FKs incl. the raw ON DELETE SET NULL
      # (recurrence_id), INCLUDE index, partial unique (recurrence_id, spent_on) for ON CONFLICT DO NOTHING) exist on
      # Postgres; expenses must pass there too.
      - name: phase 8.7 expenses (postgres)
        run: php artisan test --group=expenses --exclude-group perf --exclude-group race
        env:
          DB_CONNECTION: pgsql
          DB_DATABASE: storeplix_test
          CACHE_STORE: array
      # Phase 8.8a (§4): fraud_guard_settings / blocked_phones / order_risk_checks / fraud_guard_events / checkout_otps
      # (CHECKs incl. advance_below >= hold_below, partial unique (tenant_id, store_id, phone) WHERE unblocked_at IS NULL,
      # composite FKs, jsonb reasons/detail), orders.guard_hold CHECK and the re-created order_events type CHECK exist
      # on Postgres; fraud must pass there too.
      - name: phase 8.8a fraud (postgres)
        run: php artisan test --group=fraud --exclude-group perf --exclude-group race
        env:
          DB_CONNECTION: pgsql
          DB_DATABASE: storeplix_test
          CACHE_STORE: array
      # Phase 8.8b (§3): suppliers / purchase_orders / purchase_order_items / purchase_receipts / purchase_receipt_items /
      # supplier_payments (CHECKs incl. received + damaged <= ordered and the status/method lists, partial unique
      # lower(name) among non-archived suppliers, composite FKs, the store_counters `purchase_orders` kind) exist on
      # Postgres; purchasing must pass there too.
      - name: phase 8.8b purchasing (postgres)
        run: php artisan test --group=purchasing --exclude-group perf --exclude-group race
        env:
          DB_CONNECTION: pgsql
          DB_DATABASE: storeplix_test
          CACHE_STORE: array
      # Phase 8.8c-A (§3.1): locations (partial unique default, unique lower(name) among active, CHECK not default+archived,
      # composite FKs), inventories re-keyed to (variant, location) with the Postgres-only CHECK on_hand >= 0 and its
      # pre-check, movements/order_items/purchase_orders/purchase_receipts location columns + backfill exist on Postgres;
      # locations must pass there too and must not be empty.
      - name: phase 8.8c-A locations (postgres)
        run: |
          mkdir -p build
          php artisan test --group=locations --exclude-group perf --exclude-group race --log-junit build/locations-pg.xml; status=$?
          ran=$(grep -o 'tests="[0-9]*"' build/locations-pg.xml | head -1 | grep -o '[0-9]*' || echo 0)
          echo "locations tests executed (postgres): ${ran}"
          [ "${ran:-0}" -ge 1 ] || { echo "::error::no tests in group 'locations' on Postgres"; exit 1; }
          exit $status
        env:
          DB_CONNECTION: pgsql
          DB_DATABASE: storeplix_test
          CACHE_STORE: array
      # Phase 8.8c-B (§3.2): stock_transfers / stock_transfer_items / stock_counts / stock_count_items (CHECKs on status and
      # received <= quantity, one open count per location, composite FKs, the store_counters `stock_transfers` kind) exist
      # on Postgres; stocktransfer must pass there too and must not be empty.
      - name: phase 8.8c-B stocktransfer (postgres)
        run: |
          mkdir -p build
          php artisan test --group=stocktransfer --exclude-group perf --exclude-group race --log-junit build/stocktransfer-pg.xml; status=$?
          ran=$(grep -o 'tests="[0-9]*"' build/stocktransfer-pg.xml | head -1 | grep -o '[0-9]*' || echo 0)
          echo "stocktransfer tests executed (postgres): ${ran}"
          [ "${ran:-0}" -ge 1 ] || { echo "::error::no tests in group 'stocktransfer' on Postgres"; exit 1; }
          exit $status
        env:
          DB_CONNECTION: pgsql
          DB_DATABASE: storeplix_test
          CACHE_STORE: array
      # Phase 8.8d-A (§3.1, §3.2): pos_registers / pos_sessions / pos_sales (partial unique one open session per register and
      # active register name, CHECKs closed ⇔ closing figures and 0 ≤ left ≤ counted, composite FKs), orders
      # `orders_pos_sentinels_check`, payments.pos_session_id + method card, inventory_movements reason pos_sale exist on
      # Postgres; pos must pass there too and must not be empty.
      - name: phase 8.8d-A pos (postgres)
        run: |
          mkdir -p build
          php artisan test --group=pos --exclude-group perf --exclude-group race --log-junit build/pos-pg.xml; status=$?
          ran=$(grep -o 'tests="[0-9]*"' build/pos-pg.xml | head -1 | grep -o '[0-9]*' || echo 0)
          echo "pos tests executed (postgres): ${ran}"
          [ "${ran:-0}" -ge 1 ] || { echo "::error::no tests in group 'pos' on Postgres"; exit 1; }
          exit $status
        env:
          DB_CONNECTION: pgsql
          DB_DATABASE: storeplix_test
          CACHE_STORE: array
      # Phase 8.9a (§3.1, §3.2): sms_credit_accounts (balance CHECK ≥ 0) / sms_credit_ledger (append-only, unique consume and
      # refund per message) / sms_templates / sms_sender_ids (global unique active sender ID), sms_messages store columns,
      # billing_invoices kind sms_credits with nullable plan/interval, marketing sends charged_from exist on Postgres; sms
      # must pass there too and must not be empty.
      - name: phase 8.9a sms (postgres)
        run: |
          mkdir -p build
          php artisan test --group=sms --exclude-group perf --exclude-group race --log-junit build/sms-pg.xml; status=$?
          ran=$(grep -o 'tests="[0-9]*"' build/sms-pg.xml | head -1 | grep -o '[0-9]*' || echo 0)
          echo "sms tests executed (postgres): ${ran}"
          [ "${ran:-0}" -ge 1 ] || { echo "::error::no tests in group 'sms' on Postgres"; exit 1; }
          exit $status
        env:
          DB_CONNECTION: pgsql
          DB_DATABASE: storeplix_test
          CACHE_STORE: array
      # Phase 8.9b (§3.1, §3.2): sms_providers (partial unique primary/failover, encrypted credentials) /
      # platform_sms_message_types / platform_sms_templates / platform_sms_broadcasts / platform_sms_broadcast_recipients
      # (opt-out code sha256), users opt-out + welcome columns, sms_messages provider_id / merchant_tenant_id /
      # platform_type exist on Postgres; platform-sms must pass there too (incl. ILIKE shop search, Dhaka dates) and must
      # not be empty.
      - name: phase 8.9b platform-sms (postgres)
        run: |
          mkdir -p build
          php artisan test --group=platform-sms --exclude-group perf --exclude-group race --log-junit build/platform-sms-pg.xml; status=$?
          ran=$(grep -o 'tests="[0-9]*"' build/platform-sms-pg.xml | head -1 | grep -o '[0-9]*' || echo 0)
          echo "platform-sms tests executed (postgres): ${ran}"
          [ "${ran:-0}" -ge 1 ] || { echo "::error::no tests in group 'platform-sms' on Postgres"; exit 1; }
          exit $status
        env:
          DB_CONNECTION: pgsql
          DB_DATABASE: storeplix_test
          CACHE_STORE: array
      # Amendment A1 (§1 A1-2): `platform_settings` (key PK, jsonb value, updated_by FK SET NULL, timestamptz) exists on
      # Postgres; admin-settings must pass there too and must not be empty.
      - name: amendment A1 admin-settings (postgres)
        run: |
          mkdir -p build
          php artisan test --group=admin-settings --exclude-group perf --exclude-group race --log-junit build/admin-settings-pg.xml; status=$?
          ran=$(grep -o 'tests="[0-9]*"' build/admin-settings-pg.xml | head -1 | grep -o '[0-9]*' || echo 0)
          echo "admin-settings tests executed (postgres): ${ran}"
          [ "${ran:-0}" -ge 1 ] || { echo "::error::no tests in group 'admin-settings' on Postgres"; exit 1; }
          exit $status
        env:
          DB_CONNECTION: pgsql
          DB_DATABASE: storeplix_test
          CACHE_STORE: array

  # Phase 4 (PHASE-4-CONTRACT §5.4, §12, §15.4): perf group on the Postgres service. Fails the build when
  # the 5 000-row product import (validate + run) takes > 120 s, or the parallel stock-adjustment test
  # (50 × -1 on 50 → 0, 50 ledger rows) fails. Also fails when the group is empty.
  # Phase 8.2 (PHASE-8-2-CONTRACT §4.1, §10): the analytics budgets (aggregate one day for 5 000 tenants /
  # 200 000 orders < 30 s; /admin/analytics/revenue?range=12m p95 < 500 ms) are tagged `perf` + `analytics`
  # and run in the `perf group` step below.
  api-perf:
    name: api (perf group on postgres)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: storeplix_perf
          POSTGRES_USER: storeplix
          POSTGRES_PASSWORD: storeplix
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U storeplix"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: storeplix_perf
      DB_USERNAME: storeplix
      DB_PASSWORD: storeplix
      REDIS_HOST: 127.0.0.1
      # array, not redis: the race tests fork the test process, and forked children must not share the
      # parent's Redis socket (interleaved replies). Every lock under test is a database lock.
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_pgsql, redis, bcmath, zip, pcntl, posix
          ini-values: memory_limit=1G
          coverage: none
          tools: composer:v2
      - name: Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare env
        run: |
          cp .env.example .env
          php artisan key:generate
      # Phase 5b-1: the RLS policy migration grants to storeplix_app/storeplix_admin, so the roles must exist
      # (PHASE-5B-CONTRACT §2.1). This job still connects as the superuser (RLS bypassed, app-level isolation).
      - name: Create RLS roles (01-roles.sql)
        run: |
          docker exec -i ${{ job.services.postgres.id }} \
            psql -v ON_ERROR_STOP=1 -U storeplix -d "$DB_DATABASE" \
              -v owner_pw=ci-owner -v app_pw=ci-app -v admin_pw=ci-admin \
            < "$GITHUB_WORKSPACE/infrastructure/docker/postgres/initdb/01-roles.sql"
      - name: Migrate (pg_trgm + Phase 4 indexes)
        run: php artisan migrate:fresh --force
      - name: perf group
        run: |
          mkdir -p build
          start=$(date +%s)
          php artisan test --group=perf --log-junit build/perf.xml
          echo "perf group wall time: $(( $(date +%s) - start )) s"
          count=$(grep -o 'tests="[0-9]*"' build/perf.xml | head -1 | grep -o '[0-9]*' || echo 0)
          echo "perf tests executed: ${count}"
          if [ "${count:-0}" -lt 1 ]; then
            echo "::error::No tests in group 'perf': the 5 000-row import budget is not being verified"
            exit 1
          fi
          skipped=$(grep -o 'skipped="[0-9]*"' build/perf.xml | head -1 | grep -o '[0-9]*' || echo 0)
          if [ "${skipped:-0}" -gt 0 ]; then
            echo "::error::${skipped} perf test(s) skipped on Postgres (missing pcntl/pgsql?): the race tests must run"
            exit 1
          fi
      # PHASE-5-CONTRACT §12/§15.2: the Postgres race tests must RUN, never skip (they skip themselves
      # without pgsql + pcntl). Each runs in a fresh process (RefreshDatabase migrates fresh once per
      # process) with an array cache: forked children must not share the parent's Redis socket.
      #   S2 oversell (stock 5, 20 parallel checkouts → 5 orders) · S2 mixed-cart deadlock · S3 coupon
      #   usage limit · S4 same Idempotency-Key · S17 manual-order plan limit · Phase 4 A8/A16.
      - name: race tests (postgres, must not skip)
        run: |
          mkdir -p build
          fail=0
          for t in \
            test_concurrent_checkouts_never_oversell \
            test_mixed_carts_do_not_deadlock \
            test_coupon_usage_limit_holds_under_parallel_checkouts \
            test_concurrent_same_key_creates_one_order \
            test_manual_order_plan_limit_race \
            test_parallel_adjustments_never_go_negative \
            test_plan_limit_race \
            test_concurrent_edit_and_checkout_on_the_last_unit_do_not_oversell \
            test_concurrent_ipn_and_return_apply_the_payment_once \
            test_concurrent_bookings_create_one_shipment \
            test_concurrent_receipts_never_exceed_ordered \
            test_concurrent_make_primary_keeps_one_primary \
            test_concurrent_remove_and_make_primary_do_not_deadlock \
            test_concurrent_invites_at_the_seat_limit_give_one_201_and_one_402 \
            test_concurrent_courier_connects_at_the_limit_give_one_success_and_one_402 \
            test_concurrent_domain_adds_at_the_limit_give_one_201_and_one_402 \
            test_concurrent_invoice_issuing_gives_gapless_consecutive_numbers \
            test_parallel_checkouts_sell_only_the_online_locations_stock \
            test_parallel_location_writes_keep_the_cap_and_one_default \
            test_parallel_sends_and_checkouts_never_take_the_source_below_committed \
            test_parallel_sends_of_one_transfer_move_stock_once \
            test_parallel_receive_and_cancel_settle_an_in_transit_transfer_once \
            test_parallel_count_starts_open_one_count_per_location \
            test_parallel_till_sales_and_checkouts_on_one_location_never_oversell \
            test_parallel_opens_of_one_register_open_one_session \
            test_a_sale_racing_the_close_is_counted_in_it_or_refused \
            test_a_double_tapped_sale_makes_one_order \
            test_two_resumes_of_one_held_sale_complete_it_once \
            test_a_cash_return_racing_the_close_is_counted_in_it_or_refused_and_two_never_empty_the_drawer_twice \
            test_parallel_charges_never_overspend_the_credits \
            test_concurrent_verifications_of_one_payment_grant_the_credits_once \
            test_two_shops_racing_for_one_sender_id_get_one_request \
            test_two_activations_leave_one_primary \
            test_a_broadcast_scheduled_twice_is_scheduled_once_and_the_cap_holds; do
            php artisan test --filter="::${t}\$" --log-junit "build/race-${t}.xml" || fail=1
            ran=$(grep -o 'tests="[0-9]*"' "build/race-${t}.xml" | head -1 | grep -o '[0-9]*' || echo 0)
            skipped=$(grep -o 'skipped="[0-9]*"' "build/race-${t}.xml" | head -1 | grep -o '[0-9]*' || echo 0)
            echo "${t}: tests=${ran} skipped=${skipped}"
            if [ "${ran:-0}" -lt 1 ] || [ "${skipped:-0}" -gt 0 ]; then
              echo "::error::race test ${t} did not run on Postgres (tests=${ran}, skipped=${skipped})"
              fail=1
            fi
          done
          exit $fail
      # Phase 8.8c-A (S183, §13): the `locations` ∩ `race` tests (LocationRaceTest: checkout sells only the online
      # location's stock; parallel location writes keep the cap and one default) run in the list above. This guard
      # DISCOVERS that intersection from the test files (a #[Group('race')] method or class in a file tagged
      # #[Group('locations')]) and fails when it is empty or when a discovered test is missing from the race lists of
      # api-perf and api-rls, so a new location race test can't silently not run.
      - name: phase 8.8c-A race list complete (discovered)
        run: |
          names=$(grep -rlE "Group\('locations'\)" tests --include='*.php' | xargs -r awk '
            FNR == 1 { pend = 0; classrace = 0 }
            /^[[:space:]]*#\[Group\(.race.\)\]/ { pend = 1; next }
            /^[[:space:]]*(#\[|\/\*\*|\*)/ { next }
            /^[[:space:]]*((final|abstract|readonly)[[:space:]]+)*class[[:space:]]/ { classrace = pend; pend = 0; next }
            /function[[:space:]]+test_/ { if (pend || classrace) { match($0, /test_[A-Za-z0-9_]+/); print substr($0, RSTART, RLENGTH) } pend = 0; next }
            /^[[:space:]]*$/ { next }
            { pend = 0 }' | sort -u)
          [ -n "$names" ] || { echo "::error::no race tests in group 'locations' (S183 needs a Postgres oversell race on the online location)"; exit 1; }
          fail=0
          for t in $names; do
            listed=$(grep -cw -- "${t}" "$GITHUB_WORKSPACE/.github/workflows/ci.yml" || true)
            echo "${t}: listed ${listed}x"
            [ "${listed:-0}" -ge 2 ] || { echo "::error::locations race test ${t} is not in both race lists (api-perf, api-rls)"; fail=1; }
          done
          exit $fail
      # Phase 8.8c-B (S188, S190, §13): the `stocktransfer` ∩ `race` tests (two sends + a checkout never take the source
      # below committed; one open count per location) run in the list above. This guard
      # DISCOVERS that intersection from the test files (a #[Group('race')] method or class in a file tagged
      # #[Group('stocktransfer')]) and fails when it is empty or when a discovered test is missing from the race lists of
      # api-perf and api-rls, so a new transfer/count race test can't silently not run.
      - name: phase 8.8c-B race list complete (discovered)
        run: |
          names=$(grep -rlE "Group\('stocktransfer'\)" tests --include='*.php' | xargs -r awk '
            FNR == 1 { pend = 0; classrace = 0 }
            /^[[:space:]]*#\[Group\(.race.\)\]/ { pend = 1; next }
            /^[[:space:]]*(#\[|\/\*\*|\*)/ { next }
            /^[[:space:]]*((final|abstract|readonly)[[:space:]]+)*class[[:space:]]/ { classrace = pend; pend = 0; next }
            /function[[:space:]]+test_/ { if (pend || classrace) { match($0, /test_[A-Za-z0-9_]+/); print substr($0, RSTART, RLENGTH) } pend = 0; next }
            /^[[:space:]]*$/ { next }
            { pend = 0 }' | sort -u)
          [ -n "$names" ] || { echo "::error::no race tests in group 'stocktransfer' (S188 needs a Postgres send-vs-checkout race, S190 a one-open-count race)"; exit 1; }
          fail=0
          for t in $names; do
            listed=$(grep -cw -- "${t}" "$GITHUB_WORKSPACE/.github/workflows/ci.yml" || true)
            echo "${t}: listed ${listed}x"
            [ "${listed:-0}" -ge 2 ] || { echo "::error::stocktransfer race test ${t} is not in both race lists (api-perf, api-rls)"; fail=1; }
          done
          exit $fail
      # Phase 8.8d-A/B (S199, S200, S201, S206, S207, §14): the `pos` ∩ `race` tests (two till sales + a storefront checkout
      # never oversell one location; parallel opens of one register open one session; a sale racing the close is counted in
      # it or refused with register_closed; a double-tapped sale makes one order; part B: two resumes of one held sale
      # complete it once; a cash return racing the close is counted in it or refused, and two never empty the drawer
      # twice) run in the list above. This guard
      # DISCOVERS that intersection from the test files (a #[Group('race')] method or class in a file tagged
      # #[Group('pos')]) and fails when it is empty or when a discovered test is missing from the race lists of api-perf
      # and api-rls, so a new POS race test can't silently not run.
      - name: phase 8.8d-A race list complete (discovered)
        run: |
          names=$(grep -rlE "Group\('pos'\)" tests --include='*.php' | xargs -r awk '
            FNR == 1 { pend = 0; classrace = 0 }
            /^[[:space:]]*#\[Group\(.race.\)\]/ { pend = 1; next }
            /^[[:space:]]*(#\[|\/\*\*|\*)/ { next }
            /^[[:space:]]*((final|abstract|readonly)[[:space:]]+)*class[[:space:]]/ { classrace = pend; pend = 0; next }
            /function[[:space:]]+test_/ { if (pend || classrace) { match($0, /test_[A-Za-z0-9_]+/); print substr($0, RSTART, RLENGTH) } pend = 0; next }
            /^[[:space:]]*$/ { next }
            { pend = 0 }' | sort -u)
          [ -n "$names" ] || { echo "::error::no race tests in group 'pos' (S199 needs a Postgres oversell race at the register location, S201 open and sale-vs-close races)"; exit 1; }
          fail=0
          for t in $names; do
            listed=$(grep -cw -- "${t}" "$GITHUB_WORKSPACE/.github/workflows/ci.yml" || true)
            echo "${t}: listed ${listed}x"
            [ "${listed:-0}" -ge 2 ] || { echo "::error::pos race test ${t} is not in both race lists (api-perf, api-rls)"; fail=1; }
          done
          exit $fail
      # Phase 8.9a (S211, S212, S215, §15): the `sms` ∩ `race` tests (20 parallel charges against a balance for 10 charge
      # exactly 10; two concurrent verifications of one SMS credit payment grant the pack once; two shops racing for one
      # sender ID get one request) run in the list above. This guard DISCOVERS that intersection from the test files (a
      # #[Group('race')] method or class in a file tagged #[Group('sms')]) and fails when it is empty or when a discovered
      # test is missing from the race lists of api-perf and api-rls, so a new SMS race test can't silently not run.
      - name: phase 8.9a race list complete (discovered)
        run: |
          names=$(grep -rlE "Group\('sms'\)" tests --include='*.php' | xargs -r awk '
            FNR == 1 { pend = 0; classrace = 0 }
            /^[[:space:]]*#\[Group\(.race.\)\]/ { pend = 1; next }
            /^[[:space:]]*(#\[|\/\*\*|\*)/ { next }
            /^[[:space:]]*((final|abstract|readonly)[[:space:]]+)*class[[:space:]]/ { classrace = pend; pend = 0; next }
            /function[[:space:]]+test_/ { if (pend || classrace) { match($0, /test_[A-Za-z0-9_]+/); print substr($0, RSTART, RLENGTH) } pend = 0; next }
            /^[[:space:]]*$/ { next }
            { pend = 0 }' | sort -u)
          [ -n "$names" ] || { echo "::error::no race tests in group 'sms' (S211 needs a Postgres charge race, S212 a grant race, S215 a sender-ID race)"; exit 1; }
          fail=0
          for t in $names; do
            listed=$(grep -cw -- "${t}" "$GITHUB_WORKSPACE/.github/workflows/ci.yml" || true)
            echo "${t}: listed ${listed}x"
            [ "${listed:-0}" -ge 2 ] || { echo "::error::sms race test ${t} is not in both race lists (api-perf, api-rls)"; fail=1; }
          done
          exit $fail
      # Phase 8.9b (S228, §14): the `platform-sms` ∩ `race` tests (two activations of different providers as primary leave
      # exactly one primary; one broadcast scheduled twice is scheduled once and the weekly cap of 2 holds under the
      # tenant-keyed advisory lock) run in the list above. This guard DISCOVERS that intersection from the test files (a
      # #[Group('race')] method or class in a file tagged #[Group('platform-sms')]) and fails when it is empty or when a
      # discovered test is missing from the race lists of api-perf and api-rls, so a new platform SMS race can't silently
      # not run.
      - name: phase 8.9b race list complete (discovered)
        run: |
          names=$(grep -rlE "Group\('platform-sms'\)" tests --include='*.php' | xargs -r awk '
            FNR == 1 { pend = 0; classrace = 0 }
            /^[[:space:]]*#\[Group\(.race.\)\]/ { pend = 1; next }
            /^[[:space:]]*(#\[|\/\*\*|\*)/ { next }
            /^[[:space:]]*((final|abstract|readonly)[[:space:]]+)*class[[:space:]]/ { classrace = pend; pend = 0; next }
            /function[[:space:]]+test_/ { if (pend || classrace) { match($0, /test_[A-Za-z0-9_]+/); print substr($0, RSTART, RLENGTH) } pend = 0; next }
            /^[[:space:]]*$/ { next }
            { pend = 0 }' | sort -u)
          [ -n "$names" ] || { echo "::error::no race tests in group 'platform-sms' (S228 needs a cap race, §14 a two-activation race)"; exit 1; }
          fail=0
          for t in $names; do
            listed=$(grep -cw -- "${t}" "$GITHUB_WORKSPACE/.github/workflows/ci.yml" || true)
            echo "${t}: listed ${listed}x"
            [ "${listed:-0}" -ge 2 ] || { echo "::error::platform-sms race test ${t} is not in both race lists (api-perf, api-rls)"; fail=1; }
          done
          exit $fail
      # Phase 5a perf budget (§12): checkout p95 < 300 ms, 10-line cart, 50 sequential runs. Runs the
      # `checkout-perf` group when the API adds it; until then the step warns instead of failing.
      - name: checkout p95 budget (postgres)
        run: |
          mkdir -p build
          php artisan test --group=checkout-perf --log-junit build/checkout-perf.xml || exit 1
          ran=$(grep -o 'tests="[0-9]*"' build/checkout-perf.xml | head -1 | grep -o '[0-9]*' || echo 0)
          if [ "${ran:-0}" -lt 1 ]; then
            echo "::warning::no 'checkout-perf' test yet: the §12 checkout p95 < 300 ms budget is not verified (QA phase-5a F-M3)"
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-junit
          path: apps/api/build/*.xml
          if-no-files-found: ignore

  # Phase 5b-1 (PHASE-5B-CONTRACT §2.6, §2.7, §2.8, §20.1; ADR 0012): the same suites with Postgres RLS ON.
  # Roles from infrastructure/docker/postgres/initdb/01-roles.sql; migrations as storeplix_owner; the tests'
  # default connection `pgsql` is storeplix_app (NOSUPERUSER NOBYPASSRLS, owns nothing) with TENANCY_RLS=true.
  # Fails when the `rls` group is empty or anything in it skips, and when a race test or the checkout p95
  # test doesn't run.
  api-rls:
    name: api (RLS on, app role, postgres)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Name must end in _test: raceCleanup() refuses to TRUNCATE anything else.
          POSTGRES_DB: storeplix_rls_test
          POSTGRES_USER: storeplix
          POSTGRES_PASSWORD: storeplix
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U storeplix"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: storeplix_rls_test
      # §2.2: pgsql (default) = app role; pgsql_owner = migrations; pgsql_admin = platform/console.
      DB_USERNAME: storeplix_app
      DB_PASSWORD: ci-app
      DB_OWNER_USERNAME: storeplix_owner
      DB_OWNER_PASSWORD: ci-owner
      DB_ADMIN_USERNAME: storeplix_admin
      DB_ADMIN_PASSWORD: ci-admin
      TENANCY_RLS: 'true'
      REDIS_HOST: 127.0.0.1
      # array, not redis: rate-limit counters must not leak between tests (security step in api-postgres),
      # and forked race children must not share the parent's Redis socket.
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      STOREFRONT_REVALIDATE_URL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_pgsql, redis, bcmath, zip, pcntl, posix
          ini-values: memory_limit=1G
          coverage: none
          tools: composer:v2
      - name: Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare env
        run: |
          cp .env.example .env
          php artisan key:generate
      # Service containers can't mount files: pipe the script into the container's psql (same 16.x client),
      # as the service superuser. The script itself aborts if storeplix_app could bypass RLS.
      - name: Create roles (01-roles.sql, superuser)
        run: |
          docker exec -i ${{ job.services.postgres.id }} \
            psql -v ON_ERROR_STOP=1 -U storeplix -d "$DB_DATABASE" \
              -v owner_pw="$DB_OWNER_PASSWORD" -v app_pw="$DB_PASSWORD" -v admin_pw="$DB_ADMIN_PASSWORD" \
            < "$GITHUB_WORKSPACE/infrastructure/docker/postgres/initdb/01-roles.sql"
      - name: Migrate fresh + seed (storeplix_owner)
        run: php artisan migrate:fresh --seed --force --database=pgsql_owner
      # QA 5b-1 F-L4: roll back exactly the RLS migration and everything after it (not the whole schema), prove the
      # policies are really gone with the tables and data still there, then re-apply.
      - name: Rollback is reversible (storeplix_owner)
        run: |
          q() { docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U storeplix -d "$DB_DATABASE" -AtX -c "$1"; }
          steps=$(ls database/migrations | awk '$0 >= "2026_06_01_000100"' | wc -l | tr -d ' ')
          [ "$steps" -ge 1 ] || { echo "::error::RLS migration not found"; exit 1; }
          stores_before=$(q "select count(*) from stores")
          php artisan migrate:rollback --step="$steps" --force --database=pgsql_owner
          policies=$(q "select count(*) from pg_policies where schemaname = 'public'")
          forced=$(q "select count(*) from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname = 'public' and (c.relrowsecurity or c.relforcerowsecurity)")
          stores_after=$(q "select count(*) from stores")
          echo "rolled back ${steps} migration(s): policies=${policies} rls_tables=${forced} stores ${stores_before}->${stores_after}"
          [ "$policies" = "0" ] || { echo "::error::policies left after rollback"; exit 1; }
          [ "$forced" = "0" ] || { echo "::error::RLS still enabled after rollback"; exit 1; }
          [ "$stores_before" = "$stores_after" ] || { echo "::error::data lost on RLS rollback"; exit 1; }
          php artisan migrate --force --database=pgsql_owner
      # Raw catalogue checks, independent of the PHP tests: the app role owns nothing, can't bypass RLS, and
      # every table with a tenant_id column has RLS enabled AND forced with at least one policy.
      - name: Catalogue checks (ownership, roles, forced RLS)
        run: |
          q() { docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U storeplix -d "$DB_DATABASE" -AtX -c "$1"; }
          fail=0
          bad=$(q "select rolname from pg_roles where rolname = 'storeplix_app' and (rolsuper or rolbypassrls)")
          [ -n "$bad" ] && { echo "::error::storeplix_app can bypass RLS"; fail=1; }
          owned=$(q "select string_agg(tablename, ', ') from pg_tables where schemaname = 'public' and tableowner <> 'storeplix_owner'")
          [ -n "$owned" ] && { echo "::error::tables not owned by storeplix_owner: ${owned}"; fail=1; }
          unforced=$(q "select string_agg(distinct c.relname, ', ') from information_schema.columns col
                        join pg_class c on c.relname = col.table_name and c.relkind in ('r','p')
                        join pg_namespace n on n.oid = c.relnamespace and n.nspname = col.table_schema
                        where col.table_schema = 'public' and col.column_name = 'tenant_id'
                          and not (c.relrowsecurity and c.relforcerowsecurity
                                   and exists (select 1 from pg_policy p where p.polrelid = c.oid))")
          [ -n "$unforced" ] && { echo "::error::tenant tables without forced RLS + policy: ${unforced}"; fail=1; }
          tables=$(q "select count(distinct table_name) from information_schema.columns where table_schema = 'public' and column_name = 'tenant_id'")
          echo "tenant tables: ${tables}"
          [ "${tables:-0}" -lt 1 ] && { echo "::error::no tenant tables found"; fail=1; }
          exit $fail
      # Shared guard: runs `php artisan test <args>` with JUnit, fails on a non-zero exit, an empty run, and
      # (when the second argument is `strict`) any skipped test.
      - name: Test-run guard
        run: |
          cat > "$RUNNER_TEMP/run-group.sh" <<'SH'
          #!/usr/bin/env bash
          # usage: run-group.sh <label> <strict|lenient> <php artisan test args...>
          set -u
          label=$1; mode=$2; shift 2
          mkdir -p build
          xml="build/rls-${label}.xml"
          php artisan test "$@" --log-junit "$xml"; status=$?
          ran=$(grep -o 'tests="[0-9]*"' "$xml" 2>/dev/null | head -1 | grep -o '[0-9]*' || echo 0)
          skipped=$(grep -o 'skipped="[0-9]*"' "$xml" 2>/dev/null | head -1 | grep -o '[0-9]*' || echo 0)
          echo "${label}: tests=${ran:-0} skipped=${skipped:-0} exit=${status}"
          if [ "${ran:-0}" -lt 1 ]; then
            echo "::error::${label}: no tests ran with RLS on (empty group?)"; exit 1
          fi
          if [ "$mode" = strict ] && [ "${skipped:-0}" -gt 0 ]; then
            echo "::error::${label}: ${skipped} test(s) skipped with RLS on; they must run on Postgres"; exit 1
          fi
          exit $status
          SH
          chmod +x "$RUNNER_TEMP/run-group.sh"
      # §2.6 raw-SQL probes, coverage, definer functions, lifecycle. Must not be empty or skipped.
      - name: rls group (must run, never skip)
        run: '"$RUNNER_TEMP/run-group.sh" rls strict --group=rls'
      - name: tenant-isolation (RLS on)
        run: '"$RUNNER_TEMP/run-group.sh" tenancy lenient --group=tenancy'
      # Race tests commit their data, so they are excluded here and run one per process below.
      - name: security (RLS on)
        run: '"$RUNNER_TEMP/run-group.sh" security lenient --group=security --exclude-group perf --exclude-group race'
      # 5a race tests once more with RLS on (§2.6), same loop as api-perf: one process each, must not skip.
      - name: race tests (RLS on, must not skip)
        run: |
          fail=0
          for t in \
            test_concurrent_checkouts_never_oversell \
            test_mixed_carts_do_not_deadlock \
            test_coupon_usage_limit_holds_under_parallel_checkouts \
            test_concurrent_same_key_creates_one_order \
            test_manual_order_plan_limit_race \
            test_parallel_adjustments_never_go_negative \
            test_plan_limit_race \
            test_concurrent_edit_and_checkout_on_the_last_unit_do_not_oversell \
            test_concurrent_ipn_and_return_apply_the_payment_once \
            test_concurrent_bookings_create_one_shipment \
            test_concurrent_receipts_never_exceed_ordered \
            test_concurrent_make_primary_keeps_one_primary \
            test_concurrent_remove_and_make_primary_do_not_deadlock \
            test_concurrent_invites_at_the_seat_limit_give_one_201_and_one_402 \
            test_concurrent_courier_connects_at_the_limit_give_one_success_and_one_402 \
            test_concurrent_domain_adds_at_the_limit_give_one_201_and_one_402 \
            test_concurrent_invoice_issuing_gives_gapless_consecutive_numbers \
            test_parallel_checkouts_sell_only_the_online_locations_stock \
            test_parallel_location_writes_keep_the_cap_and_one_default \
            test_parallel_sends_and_checkouts_never_take_the_source_below_committed \
            test_parallel_sends_of_one_transfer_move_stock_once \
            test_parallel_receive_and_cancel_settle_an_in_transit_transfer_once \
            test_parallel_count_starts_open_one_count_per_location \
            test_parallel_till_sales_and_checkouts_on_one_location_never_oversell \
            test_parallel_opens_of_one_register_open_one_session \
            test_a_sale_racing_the_close_is_counted_in_it_or_refused \
            test_a_double_tapped_sale_makes_one_order \
            test_two_resumes_of_one_held_sale_complete_it_once \
            test_a_cash_return_racing_the_close_is_counted_in_it_or_refused_and_two_never_empty_the_drawer_twice \
            test_parallel_charges_never_overspend_the_credits \
            test_concurrent_verifications_of_one_payment_grant_the_credits_once \
            test_two_shops_racing_for_one_sender_id_get_one_request \
            test_two_activations_leave_one_primary \
            test_a_broadcast_scheduled_twice_is_scheduled_once_and_the_cap_holds; do
            "$RUNNER_TEMP/run-group.sh" "race-${t}" strict --filter="::${t}\$" || fail=1
          done
          exit $fail
      # Phase 6 (PHASE-6-CONTRACT §10, §12.2): definer functions sp_domain_claim_state / sp_domain_allowed (B17, B18),
      # the `ask` endpoint, domains:check discovery and the domain isolation tests with RLS on.
      - name: domains (RLS on)
        run: '"$RUNNER_TEMP/run-group.sh" domains lenient --group=domains --exclude-group perf --exclude-group race'
      # Phase 7 (PHASE-7-CONTRACT §11, S56, S63): billing tables (forced RLS), sp_billing_payment_owner (B22/B23),
      # billing:run / reconcile discovery on pgsql_admin, report aggregates under RLS.
      - name: phase 7 billing (RLS on)
        run: '"$RUNNER_TEMP/run-group.sh" billing lenient --group=billing --exclude-group perf --exclude-group race'
      - name: phase 7 plans (RLS on)
        run: '"$RUNNER_TEMP/run-group.sh" plans lenient --group=plans --exclude-group perf --exclude-group race'
      - name: phase 7 reports (RLS on)
        run: '"$RUNNER_TEMP/run-group.sh" reports lenient --group=reports --exclude-group perf --exclude-group race'
      # Phase 8.1 (PHASE-8-1-CONTRACT §10, §14.7): admin reads on pgsql_admin, sp_resolve_host with the suspended
      # flag, impersonation scoped to one tenant with RLS on.
      - name: phase 8.1 admin (RLS on)
        run: '"$RUNNER_TEMP/run-group.sh" admin lenient --group=admin --exclude-group perf --exclude-group race'
      - name: phase 8.1 impersonation (RLS on)
        run: '"$RUNNER_TEMP/run-group.sh" impersonation lenient --group=impersonation --exclude-group perf --exclude-group race'
      # Phase 8.2 (PHASE-8-2-CONTRACT §10, S84): analytics aggregate/backfill and /admin/analytics/* on pgsql_admin
      # with RLS on; the app-role REVOKE and forced RLS on tenant_daily_metrics are covered by the `rls` step above.
      - name: phase 8.2 analytics (RLS on)
        run: '"$RUNNER_TEMP/run-group.sh" analytics lenient --group=analytics --exclude-group perf --exclude-group race'
      # Phase 8.3 (PHASE-8-3-CONTRACT §10, §13.6): roles API, N1–N9, parity and the roles/role_permissions member-read
      # policy with the app role and RLS forced (RLS probes for both tables are also in the `rls` step above).
      - name: phase 8.3 roles (RLS on)
        run: '"$RUNNER_TEMP/run-group.sh" roles lenient --group=roles --exclude-group perf --exclude-group race'
      # Phase 8.4 (PHASE-8-4-CONTRACT §10, S102, S110): key lookup through sp_api_key_owner() before tenant context,
      # external API and deliveries isolated with the app role and RLS forced on the four new tables (their RLS probes
      # are also in the `rls` step above); DeliverWebhook runs in the delivery's tenant.
      - name: phase 8.4 developer-api (RLS on)
        run: '"$RUNNER_TEMP/run-group.sh" developer-api lenient --group=developer-api --exclude-group perf --exclude-group race'
      # Phase 8.5 (PHASE-8-5-CONTRACT §4.2, §7, S117, S119): the four new tables are RLS-forced; storefront unsubscribe
      # resolves the code inside the host's tenant (normal RLS path, no definer function); campaign jobs run in the
      # campaign's tenant (their RLS probes are also in the `rls` step above).
      - name: phase 8.5 campaigns (RLS on)
        run: '"$RUNNER_TEMP/run-group.sh" campaigns lenient --group=campaigns --exclude-group perf --exclude-group race'
      # Phase 8.6 (PHASE-8-6-CONTRACT §4.4, S130): the four new tables are RLS-forced; cart contact + recover resolve inside
      # the host's tenant; EvaluateAutomation / resume-due / detect-abandoned run in the automation's tenant.
      - name: phase 8.6 automations (RLS on)
        run: '"$RUNNER_TEMP/run-group.sh" automations lenient --group=automations --exclude-group perf --exclude-group race'
      # Phase 8.7 (PHASE-8-7-CONTRACT §4, §9, S141, S149): expenses + expense_recurrences are RLS-forced; expenses:repeat
      # and expenses:prune-receipts discover cross-tenant and generate/delete inside each tenant; the signed receipt
      # download resolves the tenant from the signature (their RLS probes are also in the `rls` step above).
      - name: phase 8.7 expenses (RLS on)
        run: '"$RUNNER_TEMP/run-group.sh" expenses lenient --group=expenses --exclude-group perf --exclude-group race'
      # Phase 8.8a (PHASE-8-8-CONTRACT §4, §9, S154, S161): the five guard tables are RLS-forced; CheckOrderRisk runs in
      # the order's tenant; fraud:resolve-stale and fraud:prune discover cross-tenant and work inside each tenant; the
      # storefront OTP + checkout rules resolve inside the host's tenant (their RLS probes are also in the `rls` step above).
      - name: phase 8.8a fraud (RLS on)
        run: '"$RUNNER_TEMP/run-group.sh" fraud lenient --group=fraud --exclude-group perf --exclude-group race'
      # Phase 8.8b (PHASE-8-8B-CONTRACT §3, S167): the six purchasing tables are RLS-forced; receipts, quick purchase and
      # the supplier import write stock and cost inside the actor's tenant; invoice uploads stay on the private disk
      # (their RLS probes are also in the `rls` step above).
      - name: phase 8.8b purchasing (RLS on)
        run: '"$RUNNER_TEMP/run-group.sh" purchasing lenient --group=purchasing --exclude-group perf --exclude-group race'
      # Phase 8.8c-A (PHASE-8-8C-CONTRACT §3.1, S179, S183): `locations` is RLS-forced; per-location stock rows, the
      # backfill, order line locations, "Receive at" and make-default work inside the actor's tenant with the app role
      # (the RLS probe for `locations` is also in the `rls` step above).
      - name: phase 8.8c-A locations (RLS on)
        run: '"$RUNNER_TEMP/run-group.sh" locations lenient --group=locations --exclude-group perf --exclude-group race'
      # Phase 8.8c-B (PHASE-8-8C-CONTRACT §3.2, S187): the four transfer/count tables are RLS-forced; send, receive,
      # cancel, scan and finish write stock inside the actor's tenant with the app role (their RLS probes are also in the
      # `rls` step above). Must not be empty.
      - name: phase 8.8c-B stocktransfer (RLS on)
        run: '"$RUNNER_TEMP/run-group.sh" stocktransfer lenient --group=stocktransfer --exclude-group perf --exclude-group race'
      # Phase 8.8d-A (PHASE-8-8D-CONTRACT §3.1, S195): pos_registers / pos_sessions / pos_sales are RLS-forced; open, close,
      # sale (orders, payments with pos_session_id, InventoryService::sell at the register location), receipts and the SMS
      # receipt run inside the actor's tenant with the app role (their RLS probes are also in the `rls` step above). Must
      # not be empty.
      - name: phase 8.8d-A pos (RLS on)
        run: '"$RUNNER_TEMP/run-group.sh" pos lenient --group=pos --exclude-group perf --exclude-group race'
      # Phase 8.9a (PHASE-8-9A-CONTRACT §3.1, S208, S209): the four SMS tables are RLS-forced (the credit ledger append-only);
      # charging, purchase grants, templates, sender IDs and the log run inside the actor's tenant with the app role; the
      # log never shows another tenant's, null-tenant or `otp_*` rows with RLS on. Admin sender-ID review and credit adjust
      # run cross-tenant on the admin connection. Must not be empty.
      - name: phase 8.9a sms (RLS on)
        run: '"$RUNNER_TEMP/run-group.sh" sms lenient --group=sms --exclude-group perf --exclude-group race'
      # Phase 8.9b (PHASE-8-9B-CONTRACT §3, S230, S233): the app role has SELECT only on sms_providers /
      # platform_sms_message_types / platform_sms_templates and nothing on the broadcast tables; platform SMS rows
      # (tenant_id NULL + merchant_tenant_id) are never visible inside a tenant; provider admin, broadcasts, the log and
      # the opt-out lookup run on the admin connection; routing reads providers as the app role. Must not be empty.
      - name: phase 8.9b platform-sms (RLS on)
        run: '"$RUNNER_TEMP/run-group.sh" platform-sms lenient --group=platform-sms --exclude-group perf --exclude-group race'
      # Amendment A1 (§1 A1-2): `platform_settings` follows RlsTables::PLATFORM (the app role can't write it outside the
      # admin surface); the setting is read/written on the admin connection and login reads it before any tenant context.
      # Must not be empty.
      - name: amendment A1 admin-settings (RLS on)
        run: '"$RUNNER_TEMP/run-group.sh" admin-settings lenient --group=admin-settings --exclude-group perf --exclude-group race'
      # §2.8 / §20.1: checkout p95 < 300 ms with RLS on (CheckoutPerfTest, group checkout-perf).
      - name: checkout p95 budget (RLS on)
        run: '"$RUNNER_TEMP/run-group.sh" checkout-perf strict --group=checkout-perf'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rls-junit
          path: apps/api/build/*.xml
          if-no-files-found: ignore

  web:
    name: web (typecheck, lint, test, build)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # version from root package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/storefront/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/storefront/**/*.ts', 'apps/storefront/**/*.tsx') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm -r --if-present run typecheck
      - run: pnpm -r --if-present run lint
      - run: pnpm -r --if-present run test
      - run: pnpm -r --if-present run build
        env:
          STOREFRONT_API_URL: http://127.0.0.1:8010
          VITE_API_URL: http://127.0.0.1:8010
      - name: Secret leak check (client bundles)
        run: |
          set -e
          dirs=""
          for d in apps/storefront/.next/static apps/merchant-dashboard/dist apps/super-admin/dist; do
            [ -d "$d" ] && dirs="$dirs $d"
          done
          if [ -z "$dirs" ]; then echo "::warning::no client bundles found"; exit 0; fi
          if grep -rl -e "$STOREFRONT_API_KEY" -e "STOREFRONT_API_KEY" -e "$REVALIDATE_SECRET" -e "REVALIDATE_SECRET" \
               -e "$REVESMS_API_KEY" -e "$REVESMS_SECRET_KEY" -e "REVESMS_" $dirs; then
            echo "::error::a server secret (or its name) was found in a client bundle"
            exit 1
          fi
          echo "no storefront secret in client bundles"

  # PHASE-5B-CONTRACT §7 / §13 / §17.7: the `documents` group against a REAL Gotenberg (same pinned image and
  # basic auth as docker-compose.yml): Bangla font embedded (pdffonts), text round-trip (pdftotext), every kind ×
  # language a PDF with the expected pages, the queued job stores a PDF, 100 labels < 20 s. sqlite is enough
  # here (documents isolation with RLS on runs in api-rls). Fails when the group is empty or anything skips.
  api-documents:
    name: api (documents, real Gotenberg)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    env:
      APP_ENV: testing
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      STOREFRONT_REVALIDATE_URL: ''
      GOTENBERG_URL: http://127.0.0.1:3000
      GOTENBERG_USERNAME: ci
      GOTENBERG_PASSWORD: ci-gotenberg
    steps:
      - uses: actions/checkout@v4
      # Service containers can't override the command, and basic auth needs --api-enable-basic-auth.
      - name: Start Gotenberg (pinned, basic auth)
        working-directory: .
        run: |
          image=$(awk '/^  gotenberg:/{f=1} f && /image:/{print $2; exit}' docker-compose.yml)
          [ -n "$image" ] || { echo "::error::gotenberg image not found in docker-compose.yml"; exit 1; }
          echo "image: $image"
          docker run -d --name gotenberg -p 127.0.0.1:3000:3000 --memory=1g \
            -e GOTENBERG_API_BASIC_AUTH_USERNAME="$GOTENBERG_USERNAME" \
            -e GOTENBERG_API_BASIC_AUTH_PASSWORD="$GOTENBERG_PASSWORD" \
            "$image" gotenberg --api-enable-basic-auth --api-timeout=120s
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3000/health >/dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:3000/health
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3000/forms/chromium/convert/html)
          [ "$code" = 401 ] || { echo "::error::Gotenberg accepted a request without basic auth (${code})"; exit 1; }
      - name: poppler-utils (pdffonts, pdftotext, pdfinfo)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, bcmath, zip, gd
          ini-values: memory_limit=1G
          coverage: none
          tools: composer:v2
      - name: Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare env
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: documents group (real Gotenberg, must not skip)
        run: |
          mkdir -p build
          php artisan test --group=documents --log-junit build/documents.xml; status=$?
          ran=$(grep -o 'tests="[0-9]*"' build/documents.xml | head -1 | grep -o '[0-9]*' || echo 0)
          skipped=$(grep -o 'skipped="[0-9]*"' build/documents.xml | head -1 | grep -o '[0-9]*' || echo 0)
          echo "documents: tests=${ran} skipped=${skipped} exit=${status}"
          [ "${ran:-0}" -ge 1 ] || { echo "::error::no tests in group 'documents'"; exit 1; }
          [ "${skipped:-0}" -eq 0 ] || { echo "::error::${skipped} documents test(s) skipped: Gotenberg or poppler missing"; exit 1; }
          exit $status
      - if: failure()
        name: Gotenberg logs
        run: docker logs gotenberg 2>&1 | tail -100

  # Single required status for branch protection.
  ci-ok:
    if: always()
    needs: [changes, api, api-postgres, api-perf, api-rls, api-documents, web, themes]
    runs-on: ubuntu-latest
    steps:
      - name: Verify job results
        run: |
          for r in "${{ needs.changes.result }}" "${{ needs.api.result }}" "${{ needs.api-postgres.result }}" "${{ needs.api-perf.result }}" "${{ needs.api-rls.result }}" "${{ needs.api-documents.result }}" "${{ needs.web.result }}" "${{ needs.themes.result }}"; do
            case "$r" in success|skipped) ;; *) echo "job result: $r"; exit 1 ;; esac
          done
