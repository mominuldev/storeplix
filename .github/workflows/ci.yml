name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Sentinel used to prove the storefront secret never reaches client bundles.
  STOREFRONT_API_KEY: ci-sentinel-storefront-key-3f9a1c7e
  REVALIDATE_SECRET: ci-sentinel-revalidate-9d2b
  REVESMS_API_KEY: ci-sentinel-reve-api-7a1
  REVESMS_SECRET_KEY: ci-sentinel-reve-secret-5c2
  PLATFORM_DOMAIN: storeplix.test

jobs:
  # Path filtering is done in-job (not with `on.paths`) so required checks always report.
  changes:
    runs-on: ubuntu-latest
    outputs:
      api: ${{ steps.filter.outputs.api }}
      web: ${{ steps.filter.outputs.web }}
      themes: ${{ steps.filter.outputs.themes }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            api:
              - 'apps/api/**'
              - 'infrastructure/docker/postgres/**'
              - '.github/workflows/ci.yml'
            web:
              - 'apps/merchant-dashboard/**'
              - 'apps/super-admin/**'
              - 'apps/storefront/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '.github/workflows/ci.yml'
            # Phase 3: theme schema source of truth + its Laravel copy (PHASE-3-CONTRACT §4.1, P3-5).
            themes:
              - 'packages/themes/**'
              - 'apps/api/resources/themes/**'
              - 'apps/api/app/Domain/Themes/**'
              - 'apps/storefront/themes/**'
              - '.github/workflows/ci.yml'

  # Runs when either side of the theme schema changes, so a packages/themes-only change can't skip the
  # PHP parity/sync checks (the `api` job is filtered on apps/api/** only).
  themes:
    name: 'themes (schema parity - AJV, PHP opis, sync)'
    needs: changes
    if: needs.changes.outputs.themes == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Byte-identical copy check that can never be skipped (ThemeSchemaSyncTest skips when
      # packages/themes is absent; here it is always present).
      - name: resources/themes mirrors packages/themes
        run: |
          for e in registry.json fonts.json modern-commerce fixtures; do
            diff -r "packages/themes/$e" "apps/api/resources/themes/$e"
          done
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: packages/themes (AJV fixture parity)
        run: pnpm --filter @storeplix/themes test
      - name: storefront Zod parity (valid fixtures resolve, invalid never throw)
        run: pnpm --filter @storeplix/storefront exec vitest run tests/theme.test.ts
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, bcmath, zip
          coverage: none
          tools: composer:v2
      - name: Composer install
        working-directory: apps/api
        run: composer install --no-interaction --prefer-dist --no-progress
      - name: PHP ThemeSchemaSyncTest + fixture parity + upgrader
        working-directory: apps/api
        env:
          APP_ENV: testing
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          CACHE_STORE: array
          QUEUE_CONNECTION: sync
          SESSION_DRIVER: array
        run: |
          cp .env.example .env
          php artisan key:generate
          php artisan test tests/Feature/Themes tests/Unit/SafeHrefTest.php

  api:
    name: api (lint + tests, sqlite)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    env:
      APP_ENV: testing
      DB_CONNECTION: sqlite
      DB_DATABASE: ':memory:'
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, pdo_pgsql, redis, bcmath, zip
          coverage: none
          tools: composer:v2

      - name: Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-

      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint (code style)
        run: vendor/bin/pint --test

      - name: Test suite
        run: php artisan test

      # REQUIRED GATE. Tests must be tagged #[Group('tenancy')] (see docs/development/TESTING.md).
      # Fails if the group is empty so the gate can't silently pass.
      - name: tenant-isolation
        run: |
          mkdir -p build
          php artisan test --group=tenancy --log-junit build/tenancy.xml
          count=$(grep -o 'tests="[0-9]*"' build/tenancy.xml | head -1 | grep -o '[0-9]*' || echo 0)
          echo "tenancy tests executed: ${count}"
          if [ "${count:-0}" -lt 1 ]; then
            echo "::error::No tests in group 'tenancy' — tenant isolation is not being verified"
            exit 1
          fi

      - name: security
        run: php artisan test --group=security

      # Phase 6 (PHASE-6-CONTRACT §10, §12.2): the `domains` group must exist and pass on sqlite, and the committed
      # Public Suffix List snapshot must be present (HostnameInput never downloads it at runtime or in CI).
      - name: domains group + PSL snapshot
        run: |
          psl=resources/data/public_suffix_list.dat
          [ -s "$psl" ] || { echo "::error::$psl missing (php artisan domains:update-psl, then commit it)"; exit 1; }
          grep -q '===BEGIN ICANN DOMAINS===' "$psl" || { echo "::error::$psl is not a Public Suffix List"; exit 1; }
          grep -q '===BEGIN PRIVATE DOMAINS===' "$psl" || { echo "::error::$psl lacks the private section (P6-4)"; exit 1; }
          mkdir -p build
          php artisan test --group=domains --log-junit build/domains.xml
          ran=$(grep -o 'tests="[0-9]*"' build/domains.xml | head -1 | grep -o '[0-9]*' || echo 0)
          echo "domains tests executed: ${ran}"
          [ "${ran:-0}" -ge 1 ] || { echo "::error::no tests in group 'domains'"; exit 1; }

      # Phase 7 (PHASE-7-CONTRACT §11): the `billing`, `plans` and `reports` groups must exist and pass on sqlite.
      - name: phase 7 groups (billing, plans, reports)
        run: |
          mkdir -p build
          fail=0
          for g in billing plans reports; do
            php artisan test --group="$g" --exclude-group perf --exclude-group race --log-junit "build/${g}.xml" || fail=1
            ran=$(grep -o 'tests="[0-9]*"' "build/${g}.xml" | head -1 | grep -o '[0-9]*' || echo 0)
            echo "${g} tests executed: ${ran}"
            [ "${ran:-0}" -ge 1 ] || { echo "::error::no tests in group '${g}'"; fail=1; }
          done
          exit $fail

      # Phase 8.1 (PHASE-8-1-CONTRACT §10): the `admin` and `impersonation` groups must exist and pass on sqlite.
      - name: phase 8.1 groups (admin, impersonation)
        run: |
          mkdir -p build
          fail=0
          for g in admin impersonation; do
            php artisan test --group="$g" --exclude-group perf --exclude-group race --log-junit "build/${g}.xml" || fail=1
            ran=$(grep -o 'tests="[0-9]*"' "build/${g}.xml" | head -1 | grep -o '[0-9]*' || echo 0)
            echo "${g} tests executed: ${ran}"
            [ "${ran:-0}" -ge 1 ] || { echo "::error::no tests in group '${g}'"; fail=1; }
          done
          exit $fail

      # Phase 8.2 (PHASE-8-2-CONTRACT §10, §14.1): the `analytics` group (§3 definitions fixture to the paisa,
      # aggregate/backfill idempotency, /admin/analytics/* shapes) must exist and pass on sqlite.
      - name: phase 8.2 group (analytics)
        run: |
          mkdir -p build
          php artisan test --group=analytics --exclude-group perf --exclude-group race --log-junit build/analytics.xml; status=$?
          ran=$(grep -o 'tests="[0-9]*"' build/analytics.xml | head -1 | grep -o '[0-9]*' || echo 0)
          echo "analytics tests executed: ${ran}"
          [ "${ran:-0}" -ge 1 ] || { echo "::error::no tests in group 'analytics'"; exit 1; }
          exit $status

  api-postgres:
    name: api (migrations + tenancy on postgres)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: storeplix_test
          POSTGRES_USER: storeplix
          POSTGRES_PASSWORD: storeplix
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U storeplix"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: storeplix_test
      DB_USERNAME: storeplix
      DB_PASSWORD: storeplix
      REDIS_HOST: 127.0.0.1
      CACHE_STORE: redis
      QUEUE_CONNECTION: sync
      # The seeder publishes the demo store; with a sync queue the revalidation job would call a storefront
      # that isn't running here. Empty URL = the job skips (RevalidateStorefront: "not_configured").
      STOREFRONT_REVALIDATE_URL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_pgsql, redis, bcmath, zip, pcntl, posix
          coverage: none
          tools: composer:v2
      - name: Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare env
        run: |
          cp .env.example .env
          php artisan key:generate
      # Phase 5b-1: the RLS policy migration grants to storeplix_app/storeplix_admin, so the roles must exist
      # (PHASE-5B-CONTRACT §2.1). This job still connects as the superuser (RLS bypassed, app-level isolation).
      - name: Create RLS roles (01-roles.sql)
        run: |
          docker exec -i ${{ job.services.postgres.id }} \
            psql -v ON_ERROR_STOP=1 -U storeplix -d "$DB_DATABASE" \
              -v owner_pw=ci-owner -v app_pw=ci-app -v admin_pw=ci-admin \
            < "$GITHUB_WORKSPACE/infrastructure/docker/postgres/initdb/01-roles.sql"
      - name: Migrate fresh + seed
        run: php artisan migrate:fresh --seed --force
      - name: Rollback is reversible
        run: php artisan migrate:rollback --force && php artisan migrate --force
      # phpunit.xml may force sqlite; override so the tenancy group also runs against real Postgres.
      - name: tenant-isolation (postgres)
        run: php artisan test --group=tenancy
        env:
          DB_CONNECTION: pgsql
          DB_DATABASE: storeplix_test
      # Phase 4: advisory locks (plan-limit race), partial/expression unique indexes and FOR UPDATE only
      # behave for real on Postgres.
      # Phase 5a: the fork-based race tests (S2, S3, S4, S17 + Phase 4 A8/A16) COMMIT their data
      # (RefreshDatabase can't roll back what forked children wrote), so they run isolated in the
      # `api-perf` job, each group in its own process. Here they are excluded so their committed rows
      # can't leak into later security tests with global counts (QA phase-5a F-M2).
      - name: security (postgres)
        run: php artisan test --group=security --exclude-group perf --exclude-group race
        env:
          DB_CONNECTION: pgsql
          DB_DATABASE: storeplix_test
          # Per-test in-memory cache, as locally: the job's Redis cache is never reset between tests, so
          # rate-limit counters piled up and later tests got 429. The race tests (shared Redis) run in api-perf.
          CACHE_STORE: array
      # Phase 6: partial unique primary, CHECK constraints, timestamptz conversion only behave for real on Postgres.
      - name: domains (postgres)
        run: php artisan test --group=domains --exclude-group perf --exclude-group race
        env:
          DB_CONNECTION: pgsql
          DB_DATABASE: storeplix_test
          CACHE_STORE: array
      # Phase 7: timestamptz conversion, partial unique open invoice, gapless invoice counter, CHECK constraints.
      - name: phase 7 groups (postgres)
        run: php artisan test --group=billing --group=plans --group=reports --exclude-group perf --exclude-group race
        env:
          DB_CONNECTION: pgsql
          DB_DATABASE: storeplix_test
          CACHE_STORE: array
      - name: phase 8.1 groups (postgres)
        run: php artisan test --group=admin --group=impersonation --exclude-group perf --exclude-group race
        env:
          DB_CONNECTION: pgsql
          DB_DATABASE: storeplix_test
          CACHE_STORE: array
      # Phase 8.2: the §10 fixtures must match to the paisa on Postgres too (ON CONFLICT upserts, jsonb columns,
      # Dhaka day boundaries on timestamptz, CHECK partition identities).
      - name: phase 8.2 analytics (postgres)
        run: php artisan test --group=analytics --exclude-group perf --exclude-group race
        env:
          DB_CONNECTION: pgsql
          DB_DATABASE: storeplix_test
          CACHE_STORE: array

  # Phase 4 (PHASE-4-CONTRACT §5.4, §12, §15.4): perf group on the Postgres service. Fails the build when
  # the 5 000-row product import (validate + run) takes > 120 s, or the parallel stock-adjustment test
  # (50 × -1 on 50 → 0, 50 ledger rows) fails. Also fails when the group is empty.
  # Phase 8.2 (PHASE-8-2-CONTRACT §4.1, §10): the analytics budgets (aggregate one day for 5 000 tenants /
  # 200 000 orders < 30 s; /admin/analytics/revenue?range=12m p95 < 500 ms) are tagged `perf` + `analytics`
  # and run in the `perf group` step below.
  api-perf:
    name: api (perf group on postgres)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: storeplix_perf
          POSTGRES_USER: storeplix
          POSTGRES_PASSWORD: storeplix
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U storeplix"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: storeplix_perf
      DB_USERNAME: storeplix
      DB_PASSWORD: storeplix
      REDIS_HOST: 127.0.0.1
      # array, not redis: the race tests fork the test process, and forked children must not share the
      # parent's Redis socket (interleaved replies). Every lock under test is a database lock.
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_pgsql, redis, bcmath, zip, pcntl, posix
          ini-values: memory_limit=1G
          coverage: none
          tools: composer:v2
      - name: Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare env
        run: |
          cp .env.example .env
          php artisan key:generate
      # Phase 5b-1: the RLS policy migration grants to storeplix_app/storeplix_admin, so the roles must exist
      # (PHASE-5B-CONTRACT §2.1). This job still connects as the superuser (RLS bypassed, app-level isolation).
      - name: Create RLS roles (01-roles.sql)
        run: |
          docker exec -i ${{ job.services.postgres.id }} \
            psql -v ON_ERROR_STOP=1 -U storeplix -d "$DB_DATABASE" \
              -v owner_pw=ci-owner -v app_pw=ci-app -v admin_pw=ci-admin \
            < "$GITHUB_WORKSPACE/infrastructure/docker/postgres/initdb/01-roles.sql"
      - name: Migrate (pg_trgm + Phase 4 indexes)
        run: php artisan migrate:fresh --force
      - name: perf group
        run: |
          mkdir -p build
          start=$(date +%s)
          php artisan test --group=perf --log-junit build/perf.xml
          echo "perf group wall time: $(( $(date +%s) - start )) s"
          count=$(grep -o 'tests="[0-9]*"' build/perf.xml | head -1 | grep -o '[0-9]*' || echo 0)
          echo "perf tests executed: ${count}"
          if [ "${count:-0}" -lt 1 ]; then
            echo "::error::No tests in group 'perf': the 5 000-row import budget is not being verified"
            exit 1
          fi
          skipped=$(grep -o 'skipped="[0-9]*"' build/perf.xml | head -1 | grep -o '[0-9]*' || echo 0)
          if [ "${skipped:-0}" -gt 0 ]; then
            echo "::error::${skipped} perf test(s) skipped on Postgres (missing pcntl/pgsql?): the race tests must run"
            exit 1
          fi
      # PHASE-5-CONTRACT §12/§15.2: the Postgres race tests must RUN, never skip (they skip themselves
      # without pgsql + pcntl). Each runs in a fresh process (RefreshDatabase migrates fresh once per
      # process) with an array cache: forked children must not share the parent's Redis socket.
      #   S2 oversell (stock 5, 20 parallel checkouts → 5 orders) · S2 mixed-cart deadlock · S3 coupon
      #   usage limit · S4 same Idempotency-Key · S17 manual-order plan limit · Phase 4 A8/A16.
      - name: race tests (postgres, must not skip)
        run: |
          mkdir -p build
          fail=0
          for t in \
            test_concurrent_checkouts_never_oversell \
            test_mixed_carts_do_not_deadlock \
            test_coupon_usage_limit_holds_under_parallel_checkouts \
            test_concurrent_same_key_creates_one_order \
            test_manual_order_plan_limit_race \
            test_parallel_adjustments_never_go_negative \
            test_plan_limit_race \
            test_concurrent_edit_and_checkout_on_the_last_unit_do_not_oversell \
            test_concurrent_ipn_and_return_apply_the_payment_once \
            test_concurrent_bookings_create_one_shipment \
            test_concurrent_make_primary_keeps_one_primary \
            test_concurrent_remove_and_make_primary_do_not_deadlock \
            test_concurrent_invites_at_the_seat_limit_give_one_201_and_one_402 \
            test_concurrent_courier_connects_at_the_limit_give_one_success_and_one_402 \
            test_concurrent_domain_adds_at_the_limit_give_one_201_and_one_402 \
            test_concurrent_invoice_issuing_gives_gapless_consecutive_numbers; do
            php artisan test --filter="::${t}\$" --log-junit "build/race-${t}.xml" || fail=1
            ran=$(grep -o 'tests="[0-9]*"' "build/race-${t}.xml" | head -1 | grep -o '[0-9]*' || echo 0)
            skipped=$(grep -o 'skipped="[0-9]*"' "build/race-${t}.xml" | head -1 | grep -o '[0-9]*' || echo 0)
            echo "${t}: tests=${ran} skipped=${skipped}"
            if [ "${ran:-0}" -lt 1 ] || [ "${skipped:-0}" -gt 0 ]; then
              echo "::error::race test ${t} did not run on Postgres (tests=${ran}, skipped=${skipped})"
              fail=1
            fi
          done
          exit $fail
      # Phase 5a perf budget (§12): checkout p95 < 300 ms, 10-line cart, 50 sequential runs. Runs the
      # `checkout-perf` group when the API adds it; until then the step warns instead of failing.
      - name: checkout p95 budget (postgres)
        run: |
          mkdir -p build
          php artisan test --group=checkout-perf --log-junit build/checkout-perf.xml || exit 1
          ran=$(grep -o 'tests="[0-9]*"' build/checkout-perf.xml | head -1 | grep -o '[0-9]*' || echo 0)
          if [ "${ran:-0}" -lt 1 ]; then
            echo "::warning::no 'checkout-perf' test yet: the §12 checkout p95 < 300 ms budget is not verified (QA phase-5a F-M3)"
          fi
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-junit
          path: apps/api/build/*.xml
          if-no-files-found: ignore

  # Phase 5b-1 (PHASE-5B-CONTRACT §2.6, §2.7, §2.8, §20.1; ADR 0012): the same suites with Postgres RLS ON.
  # Roles from infrastructure/docker/postgres/initdb/01-roles.sql; migrations as storeplix_owner; the tests'
  # default connection `pgsql` is storeplix_app (NOSUPERUSER NOBYPASSRLS, owns nothing) with TENANCY_RLS=true.
  # Fails when the `rls` group is empty or anything in it skips, and when a race test or the checkout p95
  # test doesn't run.
  api-rls:
    name: api (RLS on, app role, postgres)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: apps/api
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Name must end in _test: raceCleanup() refuses to TRUNCATE anything else.
          POSTGRES_DB: storeplix_rls_test
          POSTGRES_USER: storeplix
          POSTGRES_PASSWORD: storeplix
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U storeplix"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: storeplix_rls_test
      # §2.2: pgsql (default) = app role; pgsql_owner = migrations; pgsql_admin = platform/console.
      DB_USERNAME: storeplix_app
      DB_PASSWORD: ci-app
      DB_OWNER_USERNAME: storeplix_owner
      DB_OWNER_PASSWORD: ci-owner
      DB_ADMIN_USERNAME: storeplix_admin
      DB_ADMIN_PASSWORD: ci-admin
      TENANCY_RLS: 'true'
      REDIS_HOST: 127.0.0.1
      # array, not redis: rate-limit counters must not leak between tests (security step in api-postgres),
      # and forked race children must not share the parent's Redis socket.
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      STOREFRONT_REVALIDATE_URL: ''
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_pgsql, redis, bcmath, zip, pcntl, posix
          ini-values: memory_limit=1G
          coverage: none
          tools: composer:v2
      - name: Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare env
        run: |
          cp .env.example .env
          php artisan key:generate
      # Service containers can't mount files: pipe the script into the container's psql (same 16.x client),
      # as the service superuser. The script itself aborts if storeplix_app could bypass RLS.
      - name: Create roles (01-roles.sql, superuser)
        run: |
          docker exec -i ${{ job.services.postgres.id }} \
            psql -v ON_ERROR_STOP=1 -U storeplix -d "$DB_DATABASE" \
              -v owner_pw="$DB_OWNER_PASSWORD" -v app_pw="$DB_PASSWORD" -v admin_pw="$DB_ADMIN_PASSWORD" \
            < "$GITHUB_WORKSPACE/infrastructure/docker/postgres/initdb/01-roles.sql"
      - name: Migrate fresh + seed (storeplix_owner)
        run: php artisan migrate:fresh --seed --force --database=pgsql_owner
      # QA 5b-1 F-L4: roll back exactly the RLS migration and everything after it (not the whole schema), prove the
      # policies are really gone with the tables and data still there, then re-apply.
      - name: Rollback is reversible (storeplix_owner)
        run: |
          q() { docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U storeplix -d "$DB_DATABASE" -AtX -c "$1"; }
          steps=$(ls database/migrations | awk '$0 >= "2026_06_01_000100"' | wc -l | tr -d ' ')
          [ "$steps" -ge 1 ] || { echo "::error::RLS migration not found"; exit 1; }
          stores_before=$(q "select count(*) from stores")
          php artisan migrate:rollback --step="$steps" --force --database=pgsql_owner
          policies=$(q "select count(*) from pg_policies where schemaname = 'public'")
          forced=$(q "select count(*) from pg_class c join pg_namespace n on n.oid = c.relnamespace where n.nspname = 'public' and (c.relrowsecurity or c.relforcerowsecurity)")
          stores_after=$(q "select count(*) from stores")
          echo "rolled back ${steps} migration(s): policies=${policies} rls_tables=${forced} stores ${stores_before}->${stores_after}"
          [ "$policies" = "0" ] || { echo "::error::policies left after rollback"; exit 1; }
          [ "$forced" = "0" ] || { echo "::error::RLS still enabled after rollback"; exit 1; }
          [ "$stores_before" = "$stores_after" ] || { echo "::error::data lost on RLS rollback"; exit 1; }
          php artisan migrate --force --database=pgsql_owner
      # Raw catalogue checks, independent of the PHP tests: the app role owns nothing, can't bypass RLS, and
      # every table with a tenant_id column has RLS enabled AND forced with at least one policy.
      - name: Catalogue checks (ownership, roles, forced RLS)
        run: |
          q() { docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U storeplix -d "$DB_DATABASE" -AtX -c "$1"; }
          fail=0
          bad=$(q "select rolname from pg_roles where rolname = 'storeplix_app' and (rolsuper or rolbypassrls)")
          [ -n "$bad" ] && { echo "::error::storeplix_app can bypass RLS"; fail=1; }
          owned=$(q "select string_agg(tablename, ', ') from pg_tables where schemaname = 'public' and tableowner <> 'storeplix_owner'")
          [ -n "$owned" ] && { echo "::error::tables not owned by storeplix_owner: ${owned}"; fail=1; }
          unforced=$(q "select string_agg(distinct c.relname, ', ') from information_schema.columns col
                        join pg_class c on c.relname = col.table_name and c.relkind in ('r','p')
                        join pg_namespace n on n.oid = c.relnamespace and n.nspname = col.table_schema
                        where col.table_schema = 'public' and col.column_name = 'tenant_id'
                          and not (c.relrowsecurity and c.relforcerowsecurity
                                   and exists (select 1 from pg_policy p where p.polrelid = c.oid))")
          [ -n "$unforced" ] && { echo "::error::tenant tables without forced RLS + policy: ${unforced}"; fail=1; }
          tables=$(q "select count(distinct table_name) from information_schema.columns where table_schema = 'public' and column_name = 'tenant_id'")
          echo "tenant tables: ${tables}"
          [ "${tables:-0}" -lt 1 ] && { echo "::error::no tenant tables found"; fail=1; }
          exit $fail
      # Shared guard: runs `php artisan test <args>` with JUnit, fails on a non-zero exit, an empty run, and
      # (when the second argument is `strict`) any skipped test.
      - name: Test-run guard
        run: |
          cat > "$RUNNER_TEMP/run-group.sh" <<'SH'
          #!/usr/bin/env bash
          # usage: run-group.sh <label> <strict|lenient> <php artisan test args...>
          set -u
          label=$1; mode=$2; shift 2
          mkdir -p build
          xml="build/rls-${label}.xml"
          php artisan test "$@" --log-junit "$xml"; status=$?
          ran=$(grep -o 'tests="[0-9]*"' "$xml" 2>/dev/null | head -1 | grep -o '[0-9]*' || echo 0)
          skipped=$(grep -o 'skipped="[0-9]*"' "$xml" 2>/dev/null | head -1 | grep -o '[0-9]*' || echo 0)
          echo "${label}: tests=${ran:-0} skipped=${skipped:-0} exit=${status}"
          if [ "${ran:-0}" -lt 1 ]; then
            echo "::error::${label}: no tests ran with RLS on (empty group?)"; exit 1
          fi
          if [ "$mode" = strict ] && [ "${skipped:-0}" -gt 0 ]; then
            echo "::error::${label}: ${skipped} test(s) skipped with RLS on; they must run on Postgres"; exit 1
          fi
          exit $status
          SH
          chmod +x "$RUNNER_TEMP/run-group.sh"
      # §2.6 raw-SQL probes, coverage, definer functions, lifecycle. Must not be empty or skipped.
      - name: rls group (must run, never skip)
        run: '"$RUNNER_TEMP/run-group.sh" rls strict --group=rls'
      - name: tenant-isolation (RLS on)
        run: '"$RUNNER_TEMP/run-group.sh" tenancy lenient --group=tenancy'
      # Race tests commit their data, so they are excluded here and run one per process below.
      - name: security (RLS on)
        run: '"$RUNNER_TEMP/run-group.sh" security lenient --group=security --exclude-group perf --exclude-group race'
      # 5a race tests once more with RLS on (§2.6), same loop as api-perf: one process each, must not skip.
      - name: race tests (RLS on, must not skip)
        run: |
          fail=0
          for t in \
            test_concurrent_checkouts_never_oversell \
            test_mixed_carts_do_not_deadlock \
            test_coupon_usage_limit_holds_under_parallel_checkouts \
            test_concurrent_same_key_creates_one_order \
            test_manual_order_plan_limit_race \
            test_parallel_adjustments_never_go_negative \
            test_plan_limit_race \
            test_concurrent_edit_and_checkout_on_the_last_unit_do_not_oversell \
            test_concurrent_ipn_and_return_apply_the_payment_once \
            test_concurrent_bookings_create_one_shipment \
            test_concurrent_make_primary_keeps_one_primary \
            test_concurrent_remove_and_make_primary_do_not_deadlock \
            test_concurrent_invites_at_the_seat_limit_give_one_201_and_one_402 \
            test_concurrent_courier_connects_at_the_limit_give_one_success_and_one_402 \
            test_concurrent_domain_adds_at_the_limit_give_one_201_and_one_402 \
            test_concurrent_invoice_issuing_gives_gapless_consecutive_numbers; do
            "$RUNNER_TEMP/run-group.sh" "race-${t}" strict --filter="::${t}\$" || fail=1
          done
          exit $fail
      # Phase 6 (PHASE-6-CONTRACT §10, §12.2): definer functions sp_domain_claim_state / sp_domain_allowed (B17, B18),
      # the `ask` endpoint, domains:check discovery and the domain isolation tests with RLS on.
      - name: domains (RLS on)
        run: '"$RUNNER_TEMP/run-group.sh" domains lenient --group=domains --exclude-group perf --exclude-group race'
      # Phase 7 (PHASE-7-CONTRACT §11, S56, S63): billing tables (forced RLS), sp_billing_payment_owner (B22/B23),
      # billing:run / reconcile discovery on pgsql_admin, report aggregates under RLS.
      - name: phase 7 billing (RLS on)
        run: '"$RUNNER_TEMP/run-group.sh" billing lenient --group=billing --exclude-group perf --exclude-group race'
      - name: phase 7 plans (RLS on)
        run: '"$RUNNER_TEMP/run-group.sh" plans lenient --group=plans --exclude-group perf --exclude-group race'
      - name: phase 7 reports (RLS on)
        run: '"$RUNNER_TEMP/run-group.sh" reports lenient --group=reports --exclude-group perf --exclude-group race'
      # Phase 8.1 (PHASE-8-1-CONTRACT §10, §14.7): admin reads on pgsql_admin, sp_resolve_host with the suspended
      # flag, impersonation scoped to one tenant with RLS on.
      - name: phase 8.1 admin (RLS on)
        run: '"$RUNNER_TEMP/run-group.sh" admin lenient --group=admin --exclude-group perf --exclude-group race'
      - name: phase 8.1 impersonation (RLS on)
        run: '"$RUNNER_TEMP/run-group.sh" impersonation lenient --group=impersonation --exclude-group perf --exclude-group race'
      # Phase 8.2 (PHASE-8-2-CONTRACT §10, S84): analytics aggregate/backfill and /admin/analytics/* on pgsql_admin
      # with RLS on; the app-role REVOKE and forced RLS on tenant_daily_metrics are covered by the `rls` step above.
      - name: phase 8.2 analytics (RLS on)
        run: '"$RUNNER_TEMP/run-group.sh" analytics lenient --group=analytics --exclude-group perf --exclude-group race'
      # §2.8 / §20.1: checkout p95 < 300 ms with RLS on (CheckoutPerfTest, group checkout-perf).
      - name: checkout p95 budget (RLS on)
        run: '"$RUNNER_TEMP/run-group.sh" checkout-perf strict --group=checkout-perf'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rls-junit
          path: apps/api/build/*.xml
          if-no-files-found: ignore

  web:
    name: web (typecheck, lint, test, build)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # version from root package.json "packageManager"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Next.js build cache
        uses: actions/cache@v4
        with:
          path: apps/storefront/.next/cache
          key: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('apps/storefront/**/*.ts', 'apps/storefront/**/*.tsx') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm -r --if-present run typecheck
      - run: pnpm -r --if-present run lint
      - run: pnpm -r --if-present run test
      - run: pnpm -r --if-present run build
        env:
          STOREFRONT_API_URL: http://127.0.0.1:8000
          VITE_API_URL: http://127.0.0.1:8000
      - name: Secret leak check (client bundles)
        run: |
          set -e
          dirs=""
          for d in apps/storefront/.next/static apps/merchant-dashboard/dist apps/super-admin/dist; do
            [ -d "$d" ] && dirs="$dirs $d"
          done
          if [ -z "$dirs" ]; then echo "::warning::no client bundles found"; exit 0; fi
          if grep -rl -e "$STOREFRONT_API_KEY" -e "STOREFRONT_API_KEY" -e "$REVALIDATE_SECRET" -e "REVALIDATE_SECRET" \
               -e "$REVESMS_API_KEY" -e "$REVESMS_SECRET_KEY" -e "REVESMS_" $dirs; then
            echo "::error::a server secret (or its name) was found in a client bundle"
            exit 1
          fi
          echo "no storefront secret in client bundles"

  # PHASE-5B-CONTRACT §7 / §13 / §17.7: the `documents` group against a REAL Gotenberg (same pinned image and
  # basic auth as docker-compose.yml): Bangla font embedded (pdffonts), text round-trip (pdftotext), every kind ×
  # language a PDF with the expected pages, the queued job stores a PDF, 100 labels < 20 s. sqlite is enough
  # here (documents isolation with RLS on runs in api-rls). Fails when the group is empty or anything skips.
  api-documents:
    name: api (documents, real Gotenberg)
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    env:
      APP_ENV: testing
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: array
      STOREFRONT_REVALIDATE_URL: ''
      GOTENBERG_URL: http://127.0.0.1:3000
      GOTENBERG_USERNAME: ci
      GOTENBERG_PASSWORD: ci-gotenberg
    steps:
      - uses: actions/checkout@v4
      # Service containers can't override the command, and basic auth needs --api-enable-basic-auth.
      - name: Start Gotenberg (pinned, basic auth)
        working-directory: .
        run: |
          image=$(awk '/^  gotenberg:/{f=1} f && /image:/{print $2; exit}' docker-compose.yml)
          [ -n "$image" ] || { echo "::error::gotenberg image not found in docker-compose.yml"; exit 1; }
          echo "image: $image"
          docker run -d --name gotenberg -p 127.0.0.1:3000:3000 --memory=1g \
            -e GOTENBERG_API_BASIC_AUTH_USERNAME="$GOTENBERG_USERNAME" \
            -e GOTENBERG_API_BASIC_AUTH_PASSWORD="$GOTENBERG_PASSWORD" \
            "$image" gotenberg --api-enable-basic-auth --api-timeout=120s
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3000/health >/dev/null && break; sleep 2; done
          curl -sf http://127.0.0.1:3000/health
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3000/forms/chromium/convert/html)
          [ "$code" = 401 ] || { echo "::error::Gotenberg accepted a request without basic auth (${code})"; exit 1; }
      - name: poppler-utils (pdffonts, pdftotext, pdfinfo)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, pdo_sqlite, bcmath, zip, gd
          ini-values: memory_limit=1G
          coverage: none
          tools: composer:v2
      - name: Composer cache dir
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: composer-${{ runner.os }}-${{ hashFiles('apps/api/composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - run: composer install --no-interaction --prefer-dist --no-progress
      - name: Prepare env
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: documents group (real Gotenberg, must not skip)
        run: |
          mkdir -p build
          php artisan test --group=documents --log-junit build/documents.xml; status=$?
          ran=$(grep -o 'tests="[0-9]*"' build/documents.xml | head -1 | grep -o '[0-9]*' || echo 0)
          skipped=$(grep -o 'skipped="[0-9]*"' build/documents.xml | head -1 | grep -o '[0-9]*' || echo 0)
          echo "documents: tests=${ran} skipped=${skipped} exit=${status}"
          [ "${ran:-0}" -ge 1 ] || { echo "::error::no tests in group 'documents'"; exit 1; }
          [ "${skipped:-0}" -eq 0 ] || { echo "::error::${skipped} documents test(s) skipped: Gotenberg or poppler missing"; exit 1; }
          exit $status
      - if: failure()
        name: Gotenberg logs
        run: docker logs gotenberg 2>&1 | tail -100

  # Single required status for branch protection.
  ci-ok:
    if: always()
    needs: [changes, api, api-postgres, api-perf, api-rls, api-documents, web, themes]
    runs-on: ubuntu-latest
    steps:
      - name: Verify job results
        run: |
          for r in "${{ needs.changes.result }}" "${{ needs.api.result }}" "${{ needs.api-postgres.result }}" "${{ needs.api-perf.result }}" "${{ needs.api-rls.result }}" "${{ needs.api-documents.result }}" "${{ needs.web.result }}" "${{ needs.themes.result }}"; do
            case "$r" in success|skipped) ;; *) echo "job result: $r"; exit 1 ;; esac
          done
