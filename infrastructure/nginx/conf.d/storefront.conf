# Wildcard storefront hosts -> Next.js storefront (:3000).
# Tenant is resolved by the storefront + API from the normalized Host, validated against
# store_domains. nginx only forwards; it never trusts client-supplied X-Forwarded-* headers.
server {
    listen 80 default_server;
    server_name *.storeplix.test *.localhost;   # custom domains also fall through to default_server

    location / {
        set $storefront_upstream storefront:3000;
        proxy_pass http://$storefront_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host               $host;
        proxy_set_header X-Forwarded-Host   $host;    # overwrite, never append client value
        proxy_set_header X-Forwarded-Proto  $scheme;
        proxy_set_header X-Forwarded-For    $remote_addr;
        proxy_set_header X-Real-IP          $remote_addr;
        # Storefront->API internal headers must never come from the browser.
        proxy_set_header X-Storefront-Key   "";
        proxy_set_header X-Storefront-Host  "";
        proxy_set_header Upgrade            $http_upgrade;   # Next.js HMR websocket
        proxy_set_header Connection         $connection_upgrade;
        proxy_read_timeout 60s;
    }
}
