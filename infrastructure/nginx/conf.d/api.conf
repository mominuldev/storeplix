# Laravel API (php-fpm in the `api` container) on :8000
server {
    listen 8000 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Tenant media (MEDIA_DISK=public): static only, never handed to PHP.
    location ^~ /storage/ {
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; sandbox" always;
        try_files $uri =404;
    }

    # Phase 4 CSV import upload (PHASE-4-CONTRACT §5.1, §10): the API caps files at 10 MB (413
    # payload_too_large); Nginx allows 12m so that check (and its envelope) is reached. Handled here
    # directly, not via try_files: an internal redirect would re-apply the 6m server limit.
    location ~ "^/api/v1/stores/[0-9A-Za-z]{26}/imports$" {
        client_max_body_size 12m;
        set $php_upstream api:9000;
        fastcgi_pass $php_upstream;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTP_X_FORWARDED_HOST "";
        fastcgi_read_timeout 60s;
    }

    location ~ \.php$ {
        set $php_upstream api:9000;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        # Do not let clients inject a forwarded host into PHP; Laravel must use the real Host.
        fastcgi_param HTTP_X_FORWARDED_HOST "";
        fastcgi_read_timeout 60s;
    }

    location ~ /\.(?!well-known) { deny all; }
}
