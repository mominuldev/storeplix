# Phase 4.7 (PHASE-4-CONTRACT §7.1, P4-25): the merchant and super-admin SPAs reach the API same-origin.
# Prod: app.storeplix.com / admin.storeplix.com serve the built SPA and proxy /api/* + /sanctum/csrf-cookie
# to Laravel, so the session and XSRF-TOKEN cookies are host-only per SPA host (never Domain=.storeplix.com,
# which would also reach every {slug}.storeplix.com storefront).
# Local docker: app.localhost / admin.localhost proxy the Vite dev servers and the php-fpm API the same way.
# The SPA hosts are reserved store slugs (T-19), so they can never collide with a storefront host.

map $host $spa_upstream {
    default              merchant-dashboard:5183;
    ~^admin\.            super-admin:5184;
}

server {
    listen 80;
    server_name app.localhost admin.localhost app.storeplix.test admin.storeplix.test;

    root /var/www/html/public;   # only used for index.php below

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    # §7.3: the SPA talks only to itself (+ media). Dev needs the Vite HMR websocket.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: http://localhost:8010; connect-src 'self' ws: wss:; frame-src http://*.localhost http://*.storeplix.test; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # API (Laravel via php-fpm). Same origin → stateful Sanctum session + CSRF.
    location /api/ {   # plain prefix so the imports regex below can still match
        client_max_body_size 6m;
        set $php_upstream api:9000;
        fastcgi_pass $php_upstream;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTP_X_FORWARDED_HOST "";
        fastcgi_read_timeout 60s;
    }

    # CSV import upload: 10 MB API cap + multipart overhead (§5.1, §10).
    location ~ "^/api/v1/stores/[0-9A-Za-z]{26}/imports$" {
        client_max_body_size 12m;
        set $php_upstream api:9000;
        fastcgi_pass $php_upstream;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTP_X_FORWARDED_HOST "";
        fastcgi_read_timeout 60s;
    }

    location = /sanctum/csrf-cookie {
        set $php_upstream api:9000;
        fastcgi_pass $php_upstream;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_param DOCUMENT_ROOT /var/www/html/public;
        fastcgi_param HTTP_X_FORWARDED_HOST "";
    }

    # Anything else under /sanctum is not part of the SPA contract.
    location ^~ /sanctum/ { return 404; }

    # The SPA (Vite dev server here; static dist with try_files $uri /index.html in prod).
    location / {
        proxy_pass http://$spa_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header Upgrade           $http_upgrade;   # Vite HMR websocket
        proxy_set_header Connection        $connection_upgrade;
        # Storefront internals never come from a browser.
        proxy_set_header X-Storefront-Key  "";
        proxy_set_header X-Storefront-Host "";
        proxy_read_timeout 60s;
    }
}
